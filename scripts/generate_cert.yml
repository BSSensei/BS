name: 生成签名证书

on:
  workflow_dispatch:
    inputs:
      cert_name:
        description: '证书名称（随意填写）'
        required: true
        default: 'PermanentStore'
      cert_password:
        description: '证书密码'
        required: true
        default: 'troll'
      team_id:
        description: 'Team ID（可选，如 0000000000）'
        required: false
        default: '0000000000'

jobs:
  generate:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 依赖
        run: pip3 install cryptography

      - name: 运行证书生成脚本
        run: |
          python3 make_cert.py \
            "${{ github.event.inputs.team_id }}" \
            "./cert_output" \
            "${{ github.event.inputs.cert_password }}"

      - name: 上传证书文件
        uses: actions/upload-artifact@v4
        with:
          name: certificates
          path: |
            cert_output/
            certificates.zip
          retention-days: 90
