name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_SDK_VERSION: "16.5"
  IOS_DEPLOYMENT_TARGET: "16.0"
  THEOS_REPO: "https://github.com/theos/theos.git"
  THEOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
  OPENSSL_URL: "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip"
  CURL_URL: "https://github.com/XDcobra/libcurl-ios-prebuilt-and-buildscripts/releases/download/curl-8_17_0/libcurl_artifact.zip"
  CURL_SOURCE_URL: "https://curl.se/download/curl-8.17.0.tar.xz"
  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"

jobs:
  build-ios-arm64:
    name: iOS arm64 / Theos / iOS 16.5
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          clang --version
          clang++ --version
          make --version | head -n 1
          sysctl -n hw.logicalcpu_max

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q ldid.zip -d source
          test -f source/ldid.cpp
          test -f source/ldid.hpp
          test -d source/libplist_include
          test -d source/libplist_lib
          find source -maxdepth 3 -type f -print | sort

      - name: Setup Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="${GITHUB_WORKSPACE}/theos"
          rm -rf "${THEOS}"
          git clone --depth 1 "${THEOS_REPO}" "${THEOS}"
          test -f "${THEOS}/makefiles/common.mk"
          git -C "${THEOS}" submodule update --init --recursive || true

          mkdir -p "${THEOS}/sdks" "${THEOS}/vendor"

          SDK_DIR="${THEOS}/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"
          rm -rf "${SDK_DIR}"
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "${THEOS_SDK_URL}" -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "${THEOS}/sdks"
          test -d "${SDK_DIR}"
          test -f "${SDK_DIR}/SDKSettings.plist"

          echo "THEOS=${THEOS}" >> "${GITHUB_ENV}"
          git -C "${THEOS}" rev-parse HEAD

      - name: Download dependencies
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party
          mkdir -p third_party/openssl third_party/curl third_party/curl-headers

          # OpenSSL xcframework
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "${OPENSSL_URL}" -o /tmp/OpenSSL.xcframework.zip
          unzip -q -o /tmp/OpenSSL.xcframework.zip -d third_party/openssl

          # libcurl prebuilt
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "${CURL_URL}" -o /tmp/libcurl_artifact.zip
          unzip -q -o /tmp/libcurl_artifact.zip -d third_party/curl

          # curl headers
          rm -rf /tmp/curl-source
          mkdir -p /tmp/curl-source
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "${CURL_SOURCE_URL}" -o /tmp/curl-8.17.0.tar.xz
          tar -xJf /tmp/curl-8.17.0.tar.xz -C /tmp/curl-source
          cp -R /tmp/curl-source/curl-8.17.0/include/curl third_party/curl-headers/
          test -f third_party/curl-headers/curl/curl.h

          # libarchive
          git clone --depth 1 "${LIBARCHIVE_REPO}" third_party/libarchive

          echo "===== dependency tree ====="
          find third_party -maxdepth 5 -print | sort | head -n 200

      - name: Detect dependency paths
        shell: bash
        run: |
          set -euo pipefail

          WS="${GITHUB_WORKSPACE}"

          # OpenSSL
          OPENSSL_FW="$(find "${WS}/third_party/openssl" -type d -name 'OpenSSL.framework' -path '*ios-arm64*' -print -quit)"
          if [ -z "${OPENSSL_FW}" ]; then
            OPENSSL_FW="$(find "${WS}/third_party/openssl" -type d -name 'OpenSSL.framework' -print -quit)"
          fi
          if [ -z "${OPENSSL_FW}" ]; then
            echo "ERROR: OpenSSL.framework not found"
            find "${WS}/third_party/openssl" -maxdepth 8 -print
            exit 1
          fi
          OPENSSL_SLICE="$(dirname "${OPENSSL_FW}")"

          EVP_H="$(find "${OPENSSL_FW}" -type f -name 'evp.h' -print -quit)"
          if [ -z "${EVP_H}" ]; then
            echo "ERROR: evp.h not found under ${OPENSSL_FW}"
            find "${OPENSSL_FW}" -maxdepth 4 -print
            exit 1
          fi
          EVP_DIR="$(dirname "${EVP_H}")"

          if [ "$(basename "${EVP_DIR}")" = "openssl" ]; then
            OPENSSL_INCLUDE_ROOT="$(dirname "${EVP_DIR}")"
          else
            OPENSSL_INCLUDE_ROOT="${WS}/third_party/openssl-shim"
            rm -rf "${OPENSSL_INCLUDE_ROOT}"
            mkdir -p "${OPENSSL_INCLUDE_ROOT}/openssl"
            shopt -s nullglob
            cp "${EVP_DIR}"/*.h "${OPENSSL_INCLUDE_ROOT}/openssl/" 2>/dev/null || true
            for d in "${EVP_DIR}"/*; do
              [ -d "$d" ] && cp -R "$d" "${OPENSSL_INCLUDE_ROOT}/openssl/" || true
            done
            shopt -u nullglob
          fi

          test -f "${OPENSSL_INCLUDE_ROOT}/openssl/evp.h"

          # libcurl
          CURL_LIB="$(find "${WS}/third_party/curl" -type f -name 'libcurl.a' -path '*ios-arm64*' -print -quit)"
          if [ -z "${CURL_LIB}" ]; then
            CURL_LIB="$(find "${WS}/third_party/curl" -type f -name 'libcurl.a' -print -quit)"
          fi
          if [ -z "${CURL_LIB}" ]; then
            echo "ERROR: libcurl.a not found"
            find "${WS}/third_party/curl" -maxdepth 8 -type f -print
            exit 1
          fi

          CURL_INCLUDE="$(find "${WS}/third_party" -type f -path '*/curl/curl.h' -print -quit)"
          if [ -z "${CURL_INCLUDE}" ]; then
            echo "ERROR: curl.h not found under third_party"
            find "${WS}/third_party" -maxdepth 8 -type f | sort | head -n 200
            exit 1
          fi
          CURL_INCLUDE_DIR="$(dirname "$(dirname "${CURL_INCLUDE}")")"

          # libarchive
          ARCHIVE_LIB="$(find "${WS}/third_party/libarchive" -type f -name 'libarchive.a' -path '*ios-arm64*' -print -quit)"
          if [ -z "${ARCHIVE_LIB}" ]; then
            ARCHIVE_LIB="$(find "${WS}/third_party/libarchive" -type f -name 'libarchive.a' -print -quit)"
          fi
          if [ -z "${ARCHIVE_LIB}" ]; then
            echo "ERROR: libarchive.a not found"
            find "${WS}/third_party/libarchive" -maxdepth 8 -type f -print
            exit 1
          fi

          ARCHIVE_INCLUDE="$(find "${WS}/third_party/libarchive" -type f -name 'archive.h' -print -quit)"
          if [ -z "${ARCHIVE_INCLUDE}" ]; then
            echo "ERROR: archive.h not found"
            exit 1
          fi
          ARCHIVE_INCLUDE_DIR="$(dirname "${ARCHIVE_INCLUDE}")"

          # libplist
          PLIST_LIB="$(find "${WS}/source/libplist_lib" -type f -name 'libplist*.a' -print -quit)"
          if [ -z "${PLIST_LIB}" ]; then
            echo "ERROR: libplist*.a not found"
            find "${WS}/source/libplist_lib" -maxdepth 3 -type f -print
            exit 1
          fi

          PLIST_INCLUDE="$(find "${WS}/source/libplist_include" -type f -name 'plist.h' -print -quit)"
          if [ -z "${PLIST_INCLUDE}" ]; then
            echo "ERROR: plist.h not found"
            exit 1
          fi
          PLIST_INCLUDE_DIR="$(dirname "${PLIST_INCLUDE}")"

          echo "OPENSSL_INCLUDE_ROOT=${OPENSSL_INCLUDE_ROOT}" >> "${GITHUB_ENV}"
          echo "OPENSSL_SLICE=${OPENSSL_SLICE}" >> "${GITHUB_ENV}"
          echo "CURL_LIB_DIR=$(dirname "${CURL_LIB}")" >> "${GITHUB_ENV}"
          echo "CURL_INCLUDE_DIR=${CURL_INCLUDE_DIR}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_LIB_DIR=$(dirname "${ARCHIVE_LIB}")" >> "${GITHUB_ENV}"
          echo "ARCHIVE_INCLUDE_DIR=${ARCHIVE_INCLUDE_DIR}" >> "${GITHUB_ENV}"
          echo "PLIST_LIB_DIR=$(dirname "${PLIST_LIB}")" >> "${GITHUB_ENV}"
          echo "PLIST_INCLUDE_DIR=${PLIST_INCLUDE_DIR}" >> "${GITHUB_ENV}"

          echo "===== detected paths ====="
          env | grep -E '^(OPENSSL|CURL|ARCHIVE|PLIST)_' | sort

      - name: Prepare optimized Theos project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf theos-build
          mkdir -p theos-build
          cp source/ldid.cpp theos-build/ldid.cpp
          cp source/ldid.hpp theos-build/ldid.hpp
          cp -R source/libplist_include theos-build/libplist_include
          cp -R source/libplist_lib theos-build/libplist_lib

          cat > theos-build/Makefile <<EOF
          THEOS ?= ${THEOS}
          TARGET := iphone:clang:16.5:16.0](#)

