name: Build and Package TrollStore Rust IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Extract and Auto-Fix Project Structure
        run: |
          mkdir -p extracted
          unzip -o TrollStore.zip -d extracted
          
          CARGO_FILE=$(find extracted -name "Cargo.toml" -maxdepth 3 | head -n 1)
          if [ -z "$CARGO_FILE" ]; then
            echo "Error: Cargo.toml not found in zip!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$CARGO_FILE")
          echo "Found project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          cd "$PROJECT_DIR"
          
          # 自动修复 Rust 源码结构
          if [ ! -d "src" ]; then
            echo "Auto-fixing: Moving .rs files into src/ directory..."
            mkdir -p src/core
            for file in main.rs ui.rs error.rs; do [ -f "$file" ] && mv "$file" src/; done
            for file in mod.rs ipa.rs cert.rs dylib.rs fs.rs plist.rs; do [ -f "$file" ] && mv "$file" src/core/; done
          fi
          
          # 确保 resources 目录存在，供 rust-embed 打包进二进制
          mkdir -p resources
          for bin in ldid RootHelper TrollHelper fastPathSign; do [ -f "$bin" ] && mv "$bin" resources/; done
          
          # 处理 Resources 文件夹或 zip
          if [ -d "Resources" ]; then
            mv Resources resources/
          elif [ -f "Resources.zip" ]; then
            mv Resources.zip resources/
            cd resources && unzip -o Resources.zip && rm Resources.zip && cd ..
          fi
          
          chmod +x resources/ldid resources/RootHelper resources/TrollHelper resources/fastPathSign 2>/dev/null || true

      - name: Setup iOS Environment Variables
        run: |
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "IPHONEOS_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV

      - name: Build for iOS (arm64)
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo build --release --target aarch64-apple-ios

      - name: Package as iOS App (IPA) and Sign
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Starting iOS App packaging and signing process..."
          
          # 1. 创建标准的 iOS Payload 结构
          mkdir -p Payload/TrollStore.app
          
          # 2. 复制编译好的 Rust 核心二进制文件
          # (假设你的 Info.plist 中 CFBundleExecutable 的值是 TrollStore)
          cp target/aarch64-apple-ios/release/trollstore-rs Payload/TrollStore.app/TrollStore
          
          # 3. 解压 UI 资源 (Info.plist, AppIcon 图标, entitlements) 到 .app 根目录
          if [ -d "resources/Resources" ]; then
            cp -R resources/Resources/* Payload/TrollStore.app/
          elif [ -d "resources" ] && [ -f "resources/Info.plist" ]; then
            # 兼容平铺结构
            cp resources/Info.plist Payload/TrollStore.app/
            cp resources/AppIcon*.png Payload/TrollStore.app/ 2>/dev/null || true
            cp resources/entitlements.plist Payload/TrollStore.app/ 2>/dev/null || true
          fi
          
          # 4. 将核心工具链物理放入 App Bundle (供主程序运行时调用)
          mkdir -p Payload/TrollStore.app/Binaries
          cp resources/ldid Payload/TrollStore.app/Binaries/
          cp resources/RootHelper Payload/TrollStore.app/Binaries/
          cp resources/TrollHelper Payload/TrollStore.app/Binaries/
          cp resources/fastPathSign Payload/TrollStore.app/Binaries/
          
          # 5. 赋予所有二进制文件执行权限
          chmod +x Payload/TrollStore.app/TrollStore
          chmod +x Payload/TrollStore.app/Binaries/*
          
          # 6. 使用内置的 ldid 和 entitlements 对主程序进行伪签名 (核心步骤)
          if [ -f "Payload/TrollStore.app/entitlements.plist" ]; then
            echo "Signing main binary with entitlements..."
            ./Payload/TrollStore.app/Binaries/ldid -SPayload/TrollStore.app/entitlements.plist Payload/TrollStore.app/TrollStore
            echo "✅ Successfully signed the main binary!"
          else
            echo "⚠️ Warning: entitlements.plist not found. App might not launch correctly on iOS."
          fi
          
          # 7. 压缩成标准的 .ipa 文件
          zip -r TrollStore-Rust.ipa Payload
          echo "✅ IPA package created: TrollStore-Rust.ipa"

      - name: Upload Final IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-Rust-IPA-Release
          path: ${{ env.PROJECT_DIR }}/TrollStore-Rust.ipa
