name: 构建 iOS 静态库与 IPA（含 ldid）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # 保留凭据，避免后续克隆失败

      - name: 安装编译依赖
        run: |
          brew install cmake make git autoconf automake libtool pkg-config

      - name: 修复 Git 认证（核心修复）
        run: |
          # 禁用所有凭据助手，避免交互式密码提示
          git config --global --unset-all credential.helper || true
          # 禁止终端密码提示
          export GIT_TERMINAL_PROMPT=0
          # 强制使用匿名 HTTPS 克隆（不携带令牌）
          git config --global url."https://github.com/".insteadOf "https://github.com/"

      - name: 执行构建脚本
        run: |
          chmod +x scripts/build_all.sh
          bash scripts/build_all.sh

      - name: 上传静态库
        uses: actions/upload-artifact@v4
        with:
          name: ios-static-libs
          path: Frameworks/

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PermanentStore-IPA
          path: IPA/

      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: scripts/build_log.txt.gz  # 修正路径：日志实际生成在 scripts/ 目录下
