name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  # ==============================================================
  # Target
  # ==============================================================
  IOS_DEPLOYMENT_TARGET: "16.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  # ==============================================================
  # Prebuilt libarchive
  # ==============================================================
  LIBARCHIVE_REPOSITORY: "okferret/libarchive"

  # ==============================================================
  # Prebuilt OpenSSL + libcurl
  #
  # libcurl is built against the OpenSSL libraries from the same
  # project/release. Do not mix it with source/openssl_lib.
  # ==============================================================
  OPENSSL_CURL_REPOSITORY: "jasonacox/Build-OpenSSL-cURL"

jobs:
  ios:
    name: Build ldid iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # Extract ldid.zip
      # ============================================================

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== SOURCE TREE ====="

          find source -maxdepth 2 -print


      # ============================================================
      # Download exact iPhoneOS 16.5 SDK
      # ============================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf \
            "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          if [ -z "${IOS_SDK_DIR}" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found."

            find "${SDK_ROOT}" \
              -maxdepth 5 \
              -print

            exit 1
          fi

          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== SDK ====="
          echo "${IOS_SDK_DIR}"


      # ============================================================
      # Configure Apple compiler
      # ============================================================

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== CLANG ====="
          "${IOS_CLANGXX}" --version


      # ============================================================
      # Locate bundled libplist
      # ============================================================

      - name: Locate libplist
        shell: bash
        run: |
          set -euo pipefail

          PLIST="$(
            find source/libplist_lib \
              -type f \
              -name "libplist*.a" \
              -print \
              -quit
          )"

          if [ -z "${PLIST}" ]; then
            echo "ERROR: libplist.a not found."

            find source/libplist_lib \
              -print

            exit 1
          fi

          PLIST="$(
            cd "$(dirname "${PLIST}")" &&
            printf '%s/%s' "$PWD" "$(basename "${PLIST}")"
          )"

          echo "PLIST=${PLIST}" >> "${GITHUB_ENV}"

          echo "===== LIBPLIST ====="
          echo "${PLIST}"


      # ============================================================
      # Patch macOS-only SecStaticCode usage
      #
      # __APPLE__ is also defined on iOS.
      # SecStaticCodeRef / SecStaticCodeCreateWithPath /
      # SecStaticCodeCheckValidity are macOS-only APIs.
      # ============================================================

      - name: Patch macOS-only Security APIs
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("source/ldid.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # Ensure TargetConditionals is available.
          # --------------------------------------------------------

          if "#include <TargetConditionals.h>" not in s:
              marker = "#ifdef __APPLE__"

              if marker in s:
                  s = s.replace(
                      marker,
                      "#ifdef __APPLE__\n"
                      "#include <TargetConditionals.h>",
                      1,
                  )
              else:
                  s = (
                      "#if defined(__APPLE__)\n"
                      "#include <TargetConditionals.h>\n"
                      "#endif\n\n"
                      + s
                  )

          # --------------------------------------------------------
          # Restrict SecStaticCode implementation to macOS.
          # --------------------------------------------------------

          s = s.replace(
              "#ifdef __APPLE__\ninline bool verify_with_apple_system",
              "#if defined(__APPLE__) && TARGET_OS_OSX\n"
              "inline bool verify_with_apple_system",
              1,
          )

          s = s.replace(
              "#ifdef __APPLE__\r\ninline bool verify_with_apple_system",
              "#if defined(__APPLE__) && TARGET_OS_OSX\r\n"
              "inline bool verify_with_apple_system",
              1,
          )

          # --------------------------------------------------------
          # Restrict system verification implementation.
          # --------------------------------------------------------

          old = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\n"
              "#ifdef __APPLE__"
          )

          new = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\n"
              "#if defined(__APPLE__) && TARGET_OS_OSX"
          )

          if old in s:
              s = s.replace(old, new, 1)

          old = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\r\n"
              "#ifdef __APPLE__"
          )

          new = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\r\n"
              "#if defined(__APPLE__) && TARGET_OS_OSX"
          )

          if old in s:
              s = s.replace(old, new, 1)

          # --------------------------------------------------------
          # Hard failure if SecStaticCode remains unguarded.
          # --------------------------------------------------------

          if "SecStaticCodeRef" in s:
              pos = s.find("SecStaticCodeRef")

              before = s[:pos]

              if "TARGET_OS_OSX" not in before[-2000:]:
                  raise SystemExit(
                      "ERROR: SecStaticCodeRef appears to be outside "
                      "a TARGET_OS_OSX guarded section."
                  )

          p.write_text(s)
          PY

          echo "===== SECURITY GUARDS ====="

          grep -n -E \
            'TargetConditionals|TARGET_OS_OSX|SecStaticCode|verify_with_system_impl' \
            source/ldid.cpp || true


      # ============================================================
      # Download prebuilt libarchive
      # ============================================================

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive
          mkdir -p third_party

          git clone \
            --depth 1 \
            "https://github.com/${LIBARCHIVE_REPOSITORY}.git" \
            third_party/libarchive

          test -d third_party/libarchive


      # ============================================================
      # Locate iOS arm64 libarchive
      # ============================================================

      - name: Locate libarchive
        shell: bash
        run: |
          set -euo pipefail

          XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name "libArchive.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${XCFRAMEWORK}" ]; then
            XCFRAMEWORK="$(
              find third_party/libarchive \
                -type d \
                -name "*.xcframework" \
                -print \
                -quit
            )"
          fi

          if [ -z "${XCFRAMEWORK}" ]; then
            echo "ERROR: libarchive XCFramework not found."

            find third_party/libarchive \
              -maxdepth 7 \
              -print

            exit 1
          fi

          SLICE="${XCFRAMEWORK}/ios-arm64"

          if [ ! -d "${SLICE}" ]; then
            echo "ERROR: ios-arm64 libarchive slice not found."

            find "${XCFRAMEWORK}" \
              -maxdepth 5 \
              -print

            exit 1
          fi

          LIBARCHIVE="$(
            find "${SLICE}" \
              -type f \
              -name "libarchive.a" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE}" ]; then
            echo "ERROR: libarchive.a not found."

            find "${SLICE}" \
              -print

            exit 1
          fi

          HEADERS="$(
            find "${SLICE}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          if [ -z "${HEADERS}" ]; then
            echo "ERROR: libarchive Headers not found."

            find "${SLICE}" \
              -maxdepth 5 \
              -print

            exit 1
          fi

          LIBARCHIVE="$(
            cd "$(dirname "${LIBARCHIVE}")" &&
            printf '%s/%s' "$PWD" "$(basename "${LIBARCHIVE}")"
          )"

          HEADERS="$(cd "${HEADERS}" && printf '%s' "$PWD")"

          echo "LIBARCHIVE=${LIBARCHIVE}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${HEADERS}" >> "${GITHUB_ENV}"

          echo "===== LIBARCHIVE ====="
          echo "Library: ${LIBARCHIVE}"
          echo "Headers: ${HEADERS}"


      # ============================================================
      # Validate libarchive
      # ============================================================

      - name: Validate libarchive
        shell: bash
        run: |
          set -euo pipefail

          test -f "${LIBARCHIVE}"
          test -d "${LIBARCHIVE_HEADERS}"

          file "${LIBARCHIVE}"

          lipo -info "${LIBARCHIVE}" || true

          nm -gU "${LIBARCHIVE}" 2>/dev/null |
            grep -E \
              'archive_read_new|archive_read_open|archive_write_new|archive_write_open' |
            head -20 || true


      # ============================================================
      # Download prebuilt OpenSSL + cURL release
      # ============================================================

      - name: Download prebuilt OpenSSL and cURL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          command -v gh >/dev/null 2>&1

          rm -rf third_party/openssl-curl

          mkdir -p \
            third_party/openssl-curl/download \
            third_party/openssl-curl/extracted

          echo "===== AVAILABLE RELEASES ====="

          gh release list \
            --repo "${OPENSSL_CURL_REPOSITORY}" \
            --limit 10

          RELEASE_TAG="$(
            gh release list \
              --repo "${OPENSSL_CURL_REPOSITORY}" \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )"

          if [ -z "${RELEASE_TAG}" ]; then
            echo "ERROR: no release found."

            exit 1
          fi

          echo "OPENSSL_CURL_RELEASE=${RELEASE_TAG}" \
            >> "${GITHUB_ENV}"

          echo "Selected release: ${RELEASE_TAG}"

          gh release download \
            "${RELEASE_TAG}" \
            --repo "${OPENSSL_CURL_REPOSITORY}" \
            --dir third_party/openssl-curl/download \
            --clobber

          echo "===== DOWNLOADED ASSETS ====="

          find \
            third_party/openssl-curl/download \
            -maxdepth 3 \
            -type f \
            -print


      # ============================================================
      # Extract release archives
      # ============================================================

      - name: Extract OpenSSL and cURL
        shell: bash
        run: |
          set -euo pipefail

          FOUND=0

          while IFS= read -r -d '' FILE; do

            case "${FILE}" in

              *.zip|*.ZIP)
                FOUND=1

                unzip \
                  -q \
                  -o \
                  "${FILE}" \
                  -d third_party/openssl-curl/extracted
                ;;

              *.tar.gz|*.tgz)
                FOUND=1

                tar \
                  -xzf \
                  "${FILE}" \
                  -C third_party/openssl-curl/extracted
                ;;

              *.tar.xz)
                FOUND=1

                tar \
                  -xJf \
                  "${FILE}" \
                  -C third_party/openssl-curl/extracted
                ;;

              *.tar.bz2|*.tbz2)
                FOUND=1

                tar \
                  -xjf \
                  "${FILE}" \
                  -C third_party/openssl-curl/extracted
                ;;

            esac

          done < <(
            find \
              third_party/openssl-curl/download \
              -type f \
              -print0
          )

          if [ "${FOUND}" -eq 0 ]; then
            echo "ERROR: no supported archive found."

            find \
              third_party/openssl-curl/download \
              -maxdepth 5 \
              -print

            exit 1
          fi

          echo "===== EXTRACTED TREE ====="

          find \
            third_party/openssl-curl/extracted \
            -maxdepth 7 \
            -print


      # ============================================================
      # Locate OpenSSL static libraries
      # ============================================================

      - name: Locate prebuilt OpenSSL libraries
        shell: bash
        run: |
          set -euo pipefail

          ROOT="third_party/openssl-curl/extracted"

          CRYPTO="$(
            find "${ROOT}" \
              -type f \
              -name "libcrypto.a" \
              -print \
              -quit
          )"

          SSL="$(
            find "${ROOT}" \
              -type f \
              -name "libssl.a" \
              -print \
              -quit
          )"

          if [ -z "${CRYPTO}" ]; then
            echo "ERROR: libcrypto.a not found."

            find "${ROOT}" \
              -type f \
              -print

            exit 1
          fi

          if [ -z "${SSL}" ]; then
            echo "ERROR: libssl.a not found."

            find "${ROOT}" \
              -type f \
              -print

            exit 1
          fi

          CRYPTO="$(
            cd "$(dirname "${CRYPTO}")" &&
            printf '%s/%s' "$PWD" "$(basename "${CRYPTO}")"
          )"

          SSL="$(
            cd "$(dirname "${SSL}")" &&
            printf '%s/%s' "$PWD" "$(basename "${SSL}")"
          )"

          echo "CRYPTO=${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${SSL}" >> "${GITHUB_ENV}"

          echo "===== OPENSSL LIBRARIES ====="
          echo "libcrypto: ${CRYPTO}"
          echo "libssl:    ${SSL}"

          file "${CRYPTO}"
          file "${SSL}"

          lipo -info "${CRYPTO}" || true
          lipo -info "${SSL}" || true


      # ============================================================
      # Locate OpenSSL headers
      #
      # IMPORTANT:
      # Do not assume:
      #
      #   <release>/include
      #
      # is exactly three dirname() calls away.
      #
      # We find:
      #
      #   */include/openssl/opensslv.h
      #
      # and derive the include directory from the actual file.
      # ============================================================

      - name: Locate OpenSSL headers
        shell: bash
        run: |
          set -euo pipefail

          ROOT="third_party/openssl-curl/extracted"

          OPENSSL_HEADER="$(
            find "${ROOT}" \
              -type f \
              -path "*/include/openssl/opensslv.h" \
              -print \
              -quit
          )"

          if [ -z "${OPENSSL_HEADER}" ]; then
            echo "ERROR: OpenSSL opensslv.h not found."

            echo "===== opensslv.h ====="

            find "${ROOT}" \
              -type f \
              -name "opensslv.h" \
              -print

            echo
            echo "===== RELEASE TREE ====="

            find "${ROOT}" \
              -maxdepth 8 \
              -print

            exit 1
          fi

          OPENSSL_HEADERS="$(
            cd "$(dirname "$(dirname "${OPENSSL_HEADER}")")" &&
            printf '%s' "$PWD"
          )"

          if [ ! -f \
            "${OPENSSL_HEADERS}/openssl/opensslv.h"
          ]; then

            echo "ERROR: calculated OpenSSL header directory is invalid:"
            echo "${OPENSSL_HEADERS}"

            exit 1
          fi

          if [ ! -f \
            "${OPENSSL_HEADERS}/openssl/ssl.h"
          ]; then

            echo "ERROR: OpenSSL ssl.h missing:"
            echo "${OPENSSL_HEADERS}/openssl/ssl.h"

            exit 1
          fi

          if [ ! -f \
            "${OPENSSL_HEADERS}/openssl/crypto.h"
          ]; then

            echo "ERROR: OpenSSL crypto.h missing:"
            echo "${OPENSSL_HEADERS}/openssl/crypto.h"

            exit 1
          fi

          echo "OPENSSL_HEADERS=${OPENSSL_HEADERS}" \
            >> "${GITHUB_ENV}"

          echo "===== OPENSSL HEADERS ====="
          echo "${OPENSSL_HEADERS}"

          echo
          echo "opensslv.h:"
          grep \
            -E \
            'OPENSSL_VERSION_TEXT|OPENSSL_VERSION_NUMBER' \
            "${OPENSSL_HEADERS}/openssl/opensslv.h" |
            head -10 || true


      # ============================================================
      # Locate libcurl
      #
      # Prefer the dedicated iOS static library.
      # ============================================================

      - name: Locate prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          ROOT="third_party/openssl-curl/extracted"

          CURL=""

          # Preferred exact name from Build-OpenSSL-cURL.
          CURL="$(
            find "${ROOT}" \
              -type f \
              -name "libcurl_iOS.a" \
              -print \
              -quit
          )"

          # Fallback for packages that rename it to libcurl.a.
          if [ -z "${CURL}" ]; then
            CURL="$(
              find "${ROOT}" \
                -type f \
                -name "libcurl.a" \
                -print \
                -quit
            )"
          fi

          if [ -z "${CURL}" ]; then
            echo "ERROR: iOS libcurl static library not found."

            find "${ROOT}" \
              -type f \
              \( \
                -name "*curl*.a" \
                -o \
                -name "*curl*.framework" \
              \) \
              -print

            exit 1
          fi

          CURL="$(
            cd "$(dirname "${CURL}")" &&
            printf '%s/%s' "$PWD" "$(basename "${CURL}")"
          )"

          echo "CURL=${CURL}" >> "${GITHUB_ENV}"

          echo "===== LIBCURL ====="
          echo "${CURL}"

          file "${CURL}"
          lipo -info "${CURL}" || true


      # ============================================================
      # Locate curl headers
      #
      # Again derive include root from the actual curl.h.
      # ============================================================

      - name: Locate libcurl headers
        shell: bash
        run: |
          set -euo pipefail

          ROOT="third_party/openssl-curl/extracted"

          CURL_HEADER="$(
            find "${ROOT}" \
              -type f \
              -path "*/include/curl/curl.h" \
              -print \
              -quit
          )"

          if [ -z "${CURL_HEADER}" ]; then
            echo "ERROR: curl.h not found."

            find "${ROOT}" \
              -type f \
              -name "curl.h" \
              -print

            exit 1
          fi

          # curl.h:
          #
          #   <root>/include/curl/curl.h
          #
          # therefore:
          #
          #   dirname(curl.h)          = <root>/include/curl
          #   dirname(dirname(curl.h)) = <root>/include

          CURL_HEADERS="$(
            cd "$(dirname "$(dirname "${CURL_HEADER}")")" &&
            printf '%s' "$PWD"
          )"

          if [ ! -f \
            "${CURL_HEADERS}/curl/curl.h"
          ]; then

            echo "ERROR: calculated curl header directory is invalid:"
            echo "${CURL_HEADERS}"

            exit 1
          fi

          echo "CURL_HEADERS=${CURL_HEADERS}" \
            >> "${GITHUB_ENV}"

          echo "===== CURL HEADERS ====="
          echo "${CURL_HEADERS}"

          grep \
            -E \
            'LIBCURL_VERSION' \
            "${CURL_HEADERS}/curl/curlver.h" 2>/dev/null |
            head -10 || true


      # ============================================================
      # Validate all prebuilt libraries are arm64
      # ============================================================

      - name: Validate arm64 libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "===== libcrypto ====="
          lipo -info "${CRYPTO}"

          echo "===== libssl ====="
          lipo -info "${SSL}"

          echo "===== libcurl ====="
          lipo -info "${CURL}"

          echo "===== libarchive ====="
          lipo -info "${LIBARCHIVE}"

          echo "===== libplist ====="
          lipo -info "${PLIST}" || true


      # ============================================================
      # Validate curl/OpenSSL ABI
      #
      # The previous failure:
      #
      #   SSL_CTX_set_srp_password
      #   SSL_CTX_set_srp_username
      #   UI_OpenSSL
      #
      # is caught here before the actual final link.
      # ============================================================

      - name: Validate curl OpenSSL ABI
        shell: bash
        run: |
          set -euo pipefail

          echo "===== UNDEFINED OPENSSL SYMBOLS IN CURL ====="

          CURL_OPENSSL_SYMBOLS="$(
            nm -u "${CURL}" 2>/dev/null |
              grep -E \
                '(^|[[:space:]])(_?SSL_|_?OPENSSL_|_?UI_OpenSSL)' |
              sort -u || true
          )"

          printf '%s\n' "${CURL_OPENSSL_SYMBOLS}"

          echo
          echo "===== CHECK REQUIRED OPENSSL SYMBOLS ====="

          for symbol in \
            SSL_CTX_set_srp_password \
            SSL_CTX_set_srp_username \
            UI_OpenSSL
          do
            if printf '%s\n' "${CURL_OPENSSL_SYMBOLS}" |
              grep -q "${symbol}"; then

              echo "CURL requires: ${symbol}"

              if ! nm -gU "${SSL}" "${CRYPTO}" 2>/dev/null |
                grep -q "${symbol}"; then

                echo
                echo "ERROR:"
                echo "libcurl references ${symbol},"
                echo "but the selected OpenSSL libraries do not export it."

                exit 1
              fi
            fi
          done

          echo
          echo "OpenSSL/libcurl ABI check passed."


      # ============================================================
      # Build ldid
      #
      # Final target:
      #
      #   arm64-apple-ios16.0
      #
      # This is the minimum supported runtime version.
      # ============================================================

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          echo "TARGET:"
          echo "  ${TARGET}"

          echo
          echo "SDK:"
          echo "  ${IOS_SDK_DIR}"

          echo
          echo "OpenSSL:"
          echo "  ${OPENSSL_HEADERS}"
          echo "  ${CRYPTO}"
          echo "  ${SSL}"

          echo
          echo "cURL:"
          echo "  ${CURL_HEADERS}"
          echo "  ${CURL}"

          echo
          echo "libarchive:"
          echo "  ${LIBARCHIVE_HEADERS}"
          echo "  ${LIBARCHIVE}"

          echo
          echo "libplist:"
          echo "  ${PLIST}"

          echo
          echo "Minimum iOS:"
          echo "  ${IOS_DEPLOYMENT_TARGET}"

          echo
          echo "=========================================="

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_HEADERS}" \
            -I"${CURL_HEADERS}" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -liconv \
            -lxml2 \
            -lc++ \
            -lz \
            -lbz2 \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid

          test -s build/ldid

          echo
          echo "===== BUILD SUCCESS ====="


      # ============================================================
      # Validate final Mach-O
      # ============================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          test -f build/ldid
          test -s build/ldid

          echo "===== FILE ====="

          file build/ldid

          echo
          echo "===== ARCHITECTURE ====="

          lipo -info build/ldid

          echo
          echo "===== MACH-O HEADER ====="

          otool -hv build/ldid

          echo
          echo "===== LOAD COMMANDS ====="

          otool -l build/ldid > build/load_commands.txt

          awk '
            /LC_BUILD_VERSION/ {
              print
              n=10
              next
            }
            n > 0 {
              print
              n--
            }
          ' build/load_commands.txt

          echo
          echo "===== LINKED LIBRARIES ====="

          otool -L build/ldid

          echo
          echo "===== MINIMUM IOS VERSION ====="

          if ! grep -A10 "LC_BUILD_VERSION" build/load_commands.txt |
            grep -q "minos 16.0"; then

            echo "ERROR: final Mach-O does not report minos 16.0."

            exit 1
          fi

          echo "iOS minimum version: 16.0"


      # ============================================================
      # Save unstripped binary
      # ============================================================

      - name: Save unstripped binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid \
            build/ldid.unstripped

          test -s build/ldid.unstripped


      # ============================================================
      # Strip final binary
      # ============================================================

      - name: Strip final binary
        shell: bash
        run: |
          set -euo pipefail

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid

          test -s build/ldid

          echo "===== FINAL STRIPPED BINARY ====="

          file build/ldid
          lipo -info build/ldid


      # ============================================================
      # Package corrected source
      # ============================================================

      - name: Package corrected source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/source

          cp \
            source/ldid.cpp \
            dist/source/ldid.cpp

          cp \
            source/ldid.hpp \
            dist/source/ldid.hpp

          test -f dist/source/ldid.cpp
          test -f dist/source/ldid.hpp

          tar \
            -C dist \
            -czf \
            ldid-ios-arm64-source.tar.gz \
            source

          shasum \
            -a 256 \
            ldid-ios-arm64-source.tar.gz \
            > ldid-ios-arm64-source.tar.gz.sha256

          echo "===== SOURCE PACKAGE ====="

          ls -lh \
            ldid-ios-arm64-source.tar.gz \
            ldid-ios-arm64-source.tar.gz.sha256


      # ============================================================
      # Package final iOS binary
      # ============================================================

      - name: Package final iOS binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== FINAL ARTIFACTS ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256 \
            ldid-ios-arm64-source.tar.gz \
            ldid-ios-arm64-source.tar.gz.sha256

          echo
          echo "===== SHA256 ====="

          cat ldid-ios-arm64.tar.gz.sha256
          cat ldid-ios-arm64-source.tar.gz.sha256


      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            dist/ldid-ios-arm64.tar.gz
            dist/ldid-ios-arm64.tar.gz.sha256
            dist/ldid-ios-arm64-source.tar.gz
            dist/ldid-ios-arm64-source.tar.gz.sha256
            build/ldid.unstripped
          if-no-files-found: error
          retention-days: 30
