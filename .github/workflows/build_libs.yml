name: Build iOS ldid

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Extract SDK
        run: |
          unzip -o ldid.zip -d sdk

      - name: Download iOS SDK
        run: |
          wget -q https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          mv iPhoneOS16.5.sdk ios_sdk

      - name: Build libarchive for iOS
        run: |
          wget -q https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.xz
          tar -xf libarchive-3.7.4.tar.xz
          cd libarchive-3.7.4
          cmake -B build -S . \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=${{ github.workspace }}/ios_sdk \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_ZLIB=ON \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_BZip2=OFF \
            -DENABLE_LIBXML2=OFF \
            -DENABLE_EXPAT=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_LZ4=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-O3 -fvisibility=hidden" \
            -DCMAKE_CXX_FLAGS="-O3 -fvisibility=hidden"
          cmake --build build -j$(sysctl -n hw.ncpu)
          cd ..

      - name: Build ldid
        run: |
          export SDKROOT=${{ github.workspace }}/ios_sdk
          clang++ -std=c++20 \
            -arch arm64 \
            -isysroot $SDKROOT \
            -miphoneos-version-min=15.0 \
            -O3 \
            -flto=full \
            -funroll-loops \
            -fomit-frame-pointer \
            -fdata-sections -ffunction-sections \
            -fvisibility=hidden \
            -DNDEBUG \
            -I sdk/openssl_include \
            -I sdk/libplist_include \
            -I libarchive-3.7.4/libarchive \
            -L sdk/openssl_lib \
            -L sdk/libplist_lib \
            -o ldid ldid.cpp \
            libarchive-3.7.4/build/libarchive/libarchive.a \
            -lplist-2.0 -lssl -lcrypto \
            -lz -ldl -lpthread \
            -Wl,-dead_strip \
            -Wl,-S

      - name: Verify
        run: |
          file ldid
          lipo -info ldid
          otool -l ldid | grep -A 5 LC_BUILD_VERSION || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: ldid
