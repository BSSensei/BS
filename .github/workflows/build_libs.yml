name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "16.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  CURL_URL: "https://github.com/XDcobra/libcurl-ios-prebuilt-and-buildscripts/releases/download/curl-8_17_0/libcurl_artifact.zip"

  CURL_VERSION: "8.17.0"

  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"


jobs:
  build-ios:
    name: Build ldid - iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Extract ldid
      # ============================================================

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          unzip -q ldid.zip -d source

          echo "=================================================="
          echo "Extracted source tree"
          echo "=================================================="

          find source \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo "=================================================="

          test -f source/ldid.cpp
          test -f source/ldid.hpp


      # ============================================================
      # Host tools
      # ============================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          brew install xz


      # ============================================================
      # iPhoneOS 16.5 SDK
      # ============================================================

      - name: Download iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party

          mkdir -p third_party/sdk

          echo "Downloading:"
          echo "${IOS_SDK_URL}"

          curl \
            -L \
            --fail \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/iPhoneOS16.5.sdk.tar.xz \
            "${IOS_SDK_URL}"

          test -s third_party/iPhoneOS16.5.sdk.tar.xz

          tar \
            -xJf \
            third_party/iPhoneOS16.5.sdk.tar.xz \
            -C third_party/sdk

          SDKROOT="$(
            find third_party/sdk \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          if [ -z "${SDKROOT}" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"
            echo
            echo "SDK tree:"
            find third_party/sdk -maxdepth 4 -print
            exit 1
          fi

          echo "SDKROOT=${SDKROOT}" >> "${GITHUB_ENV}"

          echo "SDKROOT=${SDKROOT}"


      # ============================================================
      # Locate OpenSSL
      # ============================================================

      - name: Locate OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB_DIR=""
          OPENSSL_INCLUDE_DIR=""

          if [ -d "source/openssl_lib" ]; then
            OPENSSL_LIB_DIR="source/openssl_lib"
          else
            OPENSSL_LIB_DIR="$(
              find source \
                -type d \
                -name "openssl_lib" \
                -print \
                -quit
            )"
          fi

          if [ -d "source/openssl_include" ]; then
            OPENSSL_INCLUDE_DIR="source/openssl_include"
          else
            OPENSSL_INCLUDE_DIR="$(
              find source \
                -type d \
                -name "openssl_include" \
                -print \
                -quit
            )"
          fi

          echo "OPENSSL_LIB_DIR=${OPENSSL_LIB_DIR}"
          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}"

          if [ -z "${OPENSSL_LIB_DIR}" ] ||
             [ ! -d "${OPENSSL_LIB_DIR}" ]; then
            echo "ERROR: openssl_lib directory not found"
            find source -maxdepth 4 -print
            exit 1
          fi

          if [ -z "${OPENSSL_INCLUDE_DIR}" ] ||
             [ ! -d "${OPENSSL_INCLUDE_DIR}" ]; then
            echo "ERROR: openssl_include directory not found"
            find source -maxdepth 4 -print
            exit 1
          fi

          CRYPTO_A="$(
            find "${OPENSSL_LIB_DIR}" \
              -type f \
              -name "libcrypto*.a" \
              -print \
              -quit
          )"

          SSL_A="$(
            find "${OPENSSL_LIB_DIR}" \
              -type f \
              -name "libssl*.a" \
              -print \
              -quit
          )"

          if [ -z "${CRYPTO_A}" ]; then
            echo "ERROR: libcrypto.a not found"
            find "${OPENSSL_LIB_DIR}" -maxdepth 3 -type f -print
            exit 1
          fi

          if [ -z "${SSL_A}" ]; then
            echo "ERROR: libssl.a not found"
            find "${OPENSSL_LIB_DIR}" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "CRYPTO_A=${CRYPTO_A}" >> "${GITHUB_ENV}"
          echo "SSL_A=${SSL_A}" >> "${GITHUB_ENV}"

          echo "OPENSSL_LIB_DIR=${OPENSSL_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}" >> "${GITHUB_ENV}"

          echo "CRYPTO_A=${CRYPTO_A}"
          echo "SSL_A=${SSL_A}"


      # ============================================================
      # Locate libplist
      #
      # Do not assume the zip extraction depth.
      # ============================================================

      - name: Locate libplist
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Searching for libplist"
          echo "=================================================="

          find source \
            -type d \
            \( \
              -name "libplist_include" \
              -o \
              -name "libplist_lib" \
            \) \
            -print

          PLIST_LIB_DIR=""
          PLIST_INCLUDE_DIR=""

          if [ -d "source/libplist_lib" ]; then
            PLIST_LIB_DIR="source/libplist_lib"
          else
            PLIST_LIB_DIR="$(
              find source \
                -type d \
                -name "libplist_lib" \
                -print \
                -quit
            )"
          fi

          if [ -d "source/libplist_include" ]; then
            PLIST_INCLUDE_DIR="source/libplist_include"
          else
            PLIST_INCLUDE_DIR="$(
              find source \
                -type d \
                -name "libplist_include" \
                -print \
                -quit
            )"
          fi

          echo
          echo "PLIST_LIB_DIR=${PLIST_LIB_DIR}"
          echo "PLIST_INCLUDE_DIR=${PLIST_INCLUDE_DIR}"

          if [ -z "${PLIST_LIB_DIR}" ] ||
             [ ! -d "${PLIST_LIB_DIR}" ]; then

            echo
            echo "ERROR: libplist_lib was not found."
            echo
            echo "Full source tree:"
            find source -maxdepth 6 -print | sort

            exit 1
          fi

          if [ -z "${PLIST_INCLUDE_DIR}" ] ||
             [ ! -d "${PLIST_INCLUDE_DIR}" ]; then

            echo
            echo "ERROR: libplist_include was not found."
            echo
            echo "Full source tree:"
            find source -maxdepth 6 -print | sort

            exit 1
          fi

          PLIST_A="$(
            find "${PLIST_LIB_DIR}" \
              -type f \
              -name "libplist*.a" \
              -print \
              -quit
          )"

          if [ -z "${PLIST_A}" ]; then
            echo
            echo "ERROR: libplist static library not found."

            find "${PLIST_LIB_DIR}" \
              -maxdepth 4 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          PLIST_H="$(
            find "${PLIST_INCLUDE_DIR}" \
              -type f \
              -path "*/plist/plist.h" \
              -print \
              -quit
          )"

          if [ -z "${PLIST_H}" ]; then
            echo
            echo "ERROR: plist.h not found."

            find "${PLIST_INCLUDE_DIR}" \
              -maxdepth 5 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "PLIST_A=${PLIST_A}"
          echo "PLIST_H=${PLIST_H}"

          echo "PLIST_LIB_DIR=${PLIST_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "PLIST_INCLUDE_DIR=${PLIST_INCLUDE_DIR}" >> "${GITHUB_ENV}"
          echo "PLIST_A=${PLIST_A}" >> "${GITHUB_ENV}"


      # ============================================================
      # Patch macOS-only Security API
      # ============================================================

      - name: Patch macOS-only Security API
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/ldid.cpp")
          text = path.read_text()

          if "#include <TargetConditionals.h>" not in text:
              text = "#include <TargetConditionals.h>\n" + text

          old = """#ifdef __APPLE__
          static bool verify_with_apple_system(const std::string &path) {
          """

          new = """#if defined(__APPLE__) && TARGET_OS_OSX
          static bool verify_with_apple_system(const std::string &path) {
          """

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          grep -n \
            -A4 \
            -B2 \
            "verify_with_apple_system" \
            source/ldid.cpp \
            || true


      # ============================================================
      # Prebuilt libcurl
      # ============================================================

      - name: Download prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl

          mkdir -p third_party/curl

          echo "Downloading prebuilt libcurl:"
          echo "${CURL_URL}"

          curl \
            -L \
            --fail \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/curl/libcurl_artifact.zip \
            "${CURL_URL}"

          test -s third_party/curl/libcurl_artifact.zip

          mkdir -p third_party/curl/extracted

          unzip \
            -q \
            third_party/curl/libcurl_artifact.zip \
            -d third_party/curl/extracted

          echo
          echo "libcurl artifact:"
          find third_party/curl/extracted \
            -maxdepth 8 \
            -type f \
            -print \
            | sort

          CURL_A="$(
            find third_party/curl/extracted \
              -type f \
              -path "*/ios-arm64/libcurl.a" \
              -print \
              -quit
          )"

          if [ -z "${CURL_A}" ]; then
            CURL_A="$(
              find third_party/curl/extracted \
                -type f \
                -name "libcurl.a" \
                -print \
                -quit
            )"
          fi

          if [ -z "${CURL_A}" ]; then
            echo
            echo "ERROR: libcurl.a not found."

            find third_party/curl/extracted \
              -maxdepth 10 \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "CURL_A=${CURL_A}"

          echo "CURL_A=${CURL_A}" >> "${GITHUB_ENV}"


      # ============================================================
      # Curl headers
      #
      # Header-only source package.
      # libcurl itself is NOT compiled.
      # ============================================================

      - name: Download curl headers
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl-source

          mkdir -p third_party/curl-source

          curl \
            -L \
            --fail \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/curl-${CURL_VERSION}.tar.xz \
            "https://curl.se/download/curl-${CURL_VERSION}.tar.xz"

          test -s third_party/curl-${CURL_VERSION}.tar.xz

          tar \
            -xJf \
            third_party/curl-${CURL_VERSION}.tar.xz \
            -C third_party/curl-source

          CURL_SOURCE="third_party/curl-source/curl-${CURL_VERSION}"

          if [ ! -f "${CURL_SOURCE}/include/curl/curl.h" ]; then
            echo "ERROR: curl.h not found"

            find third_party/curl-source \
              -maxdepth 5 \
              -print \
              | sort

            exit 1
          fi

          echo "CURL_SOURCE=${CURL_SOURCE}" >> "${GITHUB_ENV}"

          echo "CURL_SOURCE=${CURL_SOURCE}"


      # ============================================================
      # Prebuilt libarchive
      #
      # No source compilation.
      # ============================================================

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive

          git clone \
            --depth 1 \
            "${LIBARCHIVE_REPO}" \
            third_party/libarchive

          LIBARCHIVE_XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name "libArchive.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE_XCFRAMEWORK}" ]; then
            echo "ERROR: libArchive.xcframework not found"

            find third_party/libarchive \
              -maxdepth 6 \
              -print \
              | sort

            exit 1
          fi

          LIBARCHIVE_A="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type f \
              -path "*/ios-arm64/libarchive.a" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE_A}" ]; then
            echo "ERROR: ios-arm64/libarchive.a not found"

            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -maxdepth 6 \
              -print \
              | sort

            exit 1
          fi

          LIBARCHIVE_HEADERS="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type d \
              -path "*/ios-arm64/Headers" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE_HEADERS}" ]; then
            echo "ERROR: ios-arm64/Headers not found"

            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -maxdepth 6 \
              -print \
              | sort

            exit 1
          fi

          test -f "${LIBARCHIVE_A}"
          test -f "${LIBARCHIVE_HEADERS}/archive.h"

          echo "LIBARCHIVE_A=${LIBARCHIVE_A}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${LIBARCHIVE_HEADERS}" >> "${GITHUB_ENV}"

          echo "LIBARCHIVE_A=${LIBARCHIVE_A}"
          echo "LIBARCHIVE_HEADERS=${LIBARCHIVE_HEADERS}"


      # ============================================================
      # Validate all prebuilt libraries
      # ============================================================

      - name: Validate dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Dependency validation"
          echo "=================================================="

          test -f "${CRYPTO_A}"
          test -f "${SSL_A}"
          test -f "${PLIST_A}"
          test -f "${LIBARCHIVE_A}"
          test -f "${CURL_A}"

          echo
          echo "OpenSSL:"
          file "${CRYPTO_A}"
          file "${SSL_A}"

          echo
          echo "libplist:"
          file "${PLIST_A}"

          echo
          echo "libarchive:"
          file "${LIBARCHIVE_A}"

          echo
          echo "libcurl:"
          file "${CURL_A}"

          echo
          echo "=================================================="
          echo "Architectures"
          echo "=================================================="

          lipo -info "${CRYPTO_A}" || true
          lipo -info "${SSL_A}" || true
          lipo -info "${PLIST_A}" || true
          lipo -info "${LIBARCHIVE_A}" || true
          lipo -info "${CURL_A}" || true


      # ============================================================
      # Build iOS arm64
      # ============================================================

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          mkdir -p build

          echo "=================================================="
          echo "Compiler"
          echo "=================================================="

          "${CLANGXX}" --version

          echo
          echo "TARGET=${TARGET}"
          echo "SDKROOT=${SDKROOT}"
          echo "IOS_DEPLOYMENT_TARGET=${IOS_DEPLOYMENT_TARGET}"

          CXXFLAGS=(
            -std=c++20

            -O3
            -DNDEBUG

            -flto=thin

            -ffunction-sections
            -fdata-sections
            -fvisibility=hidden
            -fstrict-aliasing

            -Wall
            -Wextra
            -Wpedantic
            -Werror
          )

          INCLUDES=(
            "-I${OPENSSL_INCLUDE_DIR}"
            "-I${PLIST_INCLUDE_DIR}"
            "-I${LIBARCHIVE_HEADERS}"
            "-I${CURL_SOURCE}/include"
          )

          echo
          echo "=================================================="
          echo "Compile ldid.cpp"
          echo "=================================================="

          "${CLANGXX}" \
            -target "${TARGET}" \
            -isysroot "${SDKROOT}" \
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            "${CXXFLAGS[@]}" \
            "${INCLUDES[@]}" \
            -c source/ldid.cpp \
            -o build/ldid.o

          echo
          echo "=================================================="
          echo "Link ldid"
          echo "=================================================="

          "${CLANGXX}" \
            -target "${TARGET}" \
            -isysroot "${SDKROOT}" \
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -Wl,-dead_strip \
            build/ldid.o \
            "${PLIST_A}" \
            "${LIBARCHIVE_A}" \
            "${CURL_A}" \
            "${SSL_A}" \
            "${CRYPTO_A}" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -liconv \
            -lxml2 \
            -lc++ \
            -lz \
            -lbz2 \
            -o build/ldid

          chmod +x build/ldid

          echo
          echo "=================================================="
          echo "Build result"
          echo "=================================================="

          file build/ldid
          lipo -info build/ldid
          size build/ldid


      # ============================================================
      # Preserve unstripped binary
      # ============================================================

      - name: Preserve unstripped binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid \
            build/ldid.unstripped

          test -f build/ldid.unstripped


      # ============================================================
      # Strip release binary
      # ============================================================

      - name: Strip binary
        shell: bash
        run: |
          set -euo pipefail

          STRIP="$(xcrun --sdk iphoneos --find strip)"

          "${STRIP}" \
            -S \
            build/ldid

          chmod +x build/ldid

          file build/ldid
          lipo -info build/ldid
          size build/ldid


      # ============================================================
      # Validate final executable
      # ============================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          test -x build/ldid
          test -x build/ldid.unstripped

          echo "=================================================="
          echo "Final binary"
          echo "=================================================="

          file build/ldid
          lipo -info build/ldid

          echo
          echo "=================================================="
          echo "Mach-O header"
          echo "=================================================="

          xcrun \
            --sdk iphoneos \
            otool \
            -hv \
            build/ldid

          echo
          echo "=================================================="
          echo "Version"
          echo "=================================================="

          # The iOS executable cannot necessarily execute on the
          # macOS runner, so do not run ./build/ldid here.


      # ============================================================
      # Package source
      # ============================================================

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/source

          cp \
            source/ldid.cpp \
            source/ldid.hpp \
            release/source/

          tar \
            -czf release/ldid-source.tar.gz \
            -C source \
            ldid.cpp \
            ldid.hpp

          test -f release/ldid-source.tar.gz


      # ============================================================
      # Package release
      # ============================================================

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid \
            release/ldid-ios-arm64

          cp \
            build/ldid.unstripped \
            release/ldid-ios-arm64.unstripped

          shasum -a 256 \
            release/ldid-ios-arm64 \
            release/ldid-ios-arm64.unstripped \
            release/ldid-source.tar.gz \
            > release/SHA256SUMS

          echo
          echo "=================================================="
          echo "Release"
          echo "=================================================="

          ls -lh release

          echo
          cat release/SHA256SUMS


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64
            release/ldid-ios-arm64.unstripped
            release/ldid-source.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
