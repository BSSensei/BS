name: Build dylib

on:
  workflow_dispatch:
  push:
    
  pull_request:
    paths:
      - "dylib.zip"
      - ".github/workflows/build_dylib.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"
  SDK_VERSION: "16.5"

jobs:
  build:
    name: Build iOS dylibs
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -e

          test -f dylib.zip

          rm -rf source build package
          mkdir -p source build package

          unzip -q dylib.zip -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f -print

          MAIN_C="$(find source -type f -name 'main.c' -print -quit)"
          MOD_C="$(find source -type f -name 'Mod.c' -print -quit)"

          if [ -z "$MAIN_C" ]; then
            echo "ERROR: main.c not found inside dylib.zip"
            exit 1
          fi

          if [ -z "$MOD_C" ]; then
            echo "ERROR: Mod.c not found inside dylib.zip"
            exit 1
          fi

          echo "MAIN_C=$MAIN_C" >> "$GITHUB_ENV"
          echo "MOD_C=$MOD_C" >> "$GITHUB_ENV"

          echo "main.c: $MAIN_C"
          echo "Mod.c:  $MOD_C"

      - name: Download iOS 16.5 SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$RUNNER_TEMP/theos-sdk"

          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT"

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            "$SDK_ROOT"

          cd "$SDK_ROOT"

          git sparse-checkout set "iPhoneOS16.5.sdk"

          SDK_PATH="$SDK_ROOT/iPhoneOS16.5.sdk"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: iPhoneOS16.5.sdk was not found"
            find "$SDK_ROOT" -maxdepth 2 -print
            exit 1
          fi

          echo "SDK_PATH=$SDK_PATH" >> "$GITHUB_ENV"

          echo "Using SDK:"
          ls -ld "$SDK_PATH"

      - name: Prepare headers
        shell: bash
        run: |
          set -e

          mkdir -p source/include

          cat > source/include/substrate.h <<'EOF'
          #ifndef SUBSTRATE_H
          #define SUBSTRATE_H

          #ifdef __cplusplus
          extern "C" {
          #endif

          void MSHookFunction(
              void *symbol,
              void *replace,
              void **result
          );

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF

      - name: Syntax check main.c
        shell: bash
        run: |
          set -e

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror=return-type \
            -fsyntax-only \
            "$MAIN_C"

      - name: Syntax check Mod.c
        shell: bash
        run: |
          set -e

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror=return-type \
            -fsyntax-only \
            "$MOD_C"

      - name: Build HKPerformance.dylib
        shell: bash
        run: |
          set -e

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -O3 \
            -flto \
            -fvisibility=hidden \
            -ffunction-sections \
            -fdata-sections \
            -dynamiclib \
            -Wl,-dead_strip \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-no_adhoc_codesign \
            -install_name @rpath/HKPerformance.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreFoundation \
            "$MAIN_C" \
            -o build/HKPerformance.dylib

      - name: Build HKMod.dylib
        shell: bash
        run: |
          set -e

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -O3 \
            -flto \
            -fvisibility=hidden \
            -ffunction-sections \
            -fdata-sections \
            -dynamiclib \
            -Wl,-dead_strip \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-no_adhoc_codesign \
            -install_name @rpath/HKMod.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreFoundation \
            "$MOD_C" \
            -o build/HKMod.dylib

      - name: Verify binaries
        shell: bash
        run: |
          set -e

          test -f build/HKPerformance.dylib
          test -f build/HKMod.dylib

          echo "HKPerformance:"
          file build/HKPerformance.dylib
          xcrun lipo -info build/HKPerformance.dylib
          xcrun otool -hv build/HKPerformance.dylib

          echo
          echo "HKMod:"
          file build/HKMod.dylib
          xcrun lipo -info build/HKMod.dylib
          xcrun otool -hv build/HKMod.dylib

      - name: Verify MSHookFunction
        shell: bash
        run: |
          set -e

          echo "HKPerformance MSHookFunction:"
          xcrun nm -u build/HKPerformance.dylib | grep "_MSHookFunction"

          echo
          echo "HKMod MSHookFunction:"
          xcrun nm -u build/HKMod.dylib | grep "_MSHookFunction"

      - name: Strip binaries
        shell: bash
        run: |
          set -e

          strip -S build/HKPerformance.dylib
          strip -S build/HKMod.dylib

      - name: Create dylib.zip
        shell: bash
        run: |
          set -e

          rm -rf package
          mkdir -p package

          cp build/HKPerformance.dylib package/
          cp build/HKMod.dylib package/

          rm -f dylib.zip

          cd package

          zip -9 -q ../dylib.zip \
            HKPerformance.dylib \
            HKMod.dylib

          cd ..

          echo "Generated dylib.zip:"
          ls -lh dylib.zip

          echo
          echo "Archive contents:"
          unzip -l dylib.zip

      - name: Upload dylib.zip
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: dylib.zip
          if-no-files-found: error
          retention-days: 30
