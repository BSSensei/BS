name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_SDK_VERSION: "16.5"
  IOS_DEPLOYMENT_TARGET: "16.0"

  THEOS_REPO: "https://github.com/theos/theos.git"

  # iPhoneOS 16.5 patched SDK
  THEOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  # Prebuilt OpenSSL XCFramework.
  #
  # iOS device slice:
  #
  #   ios-arm64/OpenSSL.framework/
  #
  # The framework contains the static OpenSSL binary.
  OPENSSL_URL: "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip"

  # Prebuilt libcurl.
  CURL_URL: "https://github.com/XDcobra/libcurl-ios-prebuilt-and-buildscripts/releases/download/curl-8_17_0/libcurl_artifact.zip"

  # Only headers are taken from this source archive.
  # libcurl itself is NOT built.
  CURL_SOURCE_URL: "https://curl.se/download/curl-8.17.0.tar.xz"

  # Prebuilt libarchive XCFramework repository.
  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"

jobs:
  build-ios-arm64:
    name: iOS arm64 / Theos / iOS 16.5
    runs-on: macos-14

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Host information
      # ============================================================

      - name: Show host toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Host"
          echo "=================================================="

          sw_vers
          xcodebuild -version
          xcode-select -p
          clang --version

          echo
          make --version | head -n 1

          echo
          echo "CPU:"
          sysctl -n hw.logicalcpu_max

      # ============================================================
      # Extract ldid.zip
      # ============================================================

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          unzip \
            -q \
            ldid.zip \
            -d source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "=================================================="
          echo "Source"
          echo "=================================================="

          find \
            source \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

      # ============================================================
      # Theos
      # ============================================================

      - name: Setup Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="${GITHUB_WORKSPACE}/theos"

          rm -rf "${THEOS}"

          echo "=================================================="
          echo "Clone Theos"
          echo "=================================================="

          git clone \
            --depth 1 \
            "${THEOS_REPO}" \
            "${THEOS}"

          test -f "${THEOS}/makefiles/common.mk"
          test -x "${THEOS}/bin/update-theos"

          echo
          echo "=================================================="
          echo "Initialize Theos vendor"
          echo "=================================================="

          "${THEOS}/bin/update-theos"

          test -d "${THEOS}/vendor"
          test -d "${THEOS}/vendor/include"
          test -d "${THEOS}/vendor/lib"

          echo "THEOS=${THEOS}" >> "${GITHUB_ENV}"

          echo
          echo "Theos commit:"
          git -C "${THEOS}" rev-parse HEAD

      # ============================================================
      # iPhoneOS 16.5 SDK
      # ============================================================

      - name: Install iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${THEOS}/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"

          rm -rf "${SDK_DIR}"

          mkdir -p "${THEOS}/sdks"

          echo "=================================================="
          echo "Download iPhoneOS ${IOS_SDK_VERSION} SDK"
          echo "=================================================="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            "${THEOS_SDK_URL}" \
            --output /tmp/iPhoneOS16.5.sdk.tar.xz

          echo
          echo "SDK archive:"
          ls -lh /tmp/iPhoneOS16.5.sdk.tar.xz

          echo
          echo "Extract SDK:"

          tar \
            -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "${THEOS}/sdks"

          test -d "${SDK_DIR}"
          test -f "${SDK_DIR}/SDKSettings.plist"

          echo
          echo "SDK installed:"
          echo "${SDK_DIR}"

          echo
          echo "SDK settings:"

          /usr/libexec/PlistBuddy \
            -c "Print :Version" \
            "${SDK_DIR}/SDKSettings.plist" \
            || true

      # ============================================================
      # OpenSSL
      # ============================================================

      - name: Download prebuilt OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/openssl

          mkdir -p third_party/openssl

          echo "=================================================="
          echo "Download prebuilt OpenSSL"
          echo "=================================================="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            "${OPENSSL_URL}" \
            --output /tmp/OpenSSL.xcframework.zip

          unzip \
            -q \
            -o \
            /tmp/OpenSSL.xcframework.zip \
            -d third_party/openssl

          OPENSSL_XCFRAMEWORK="${GITHUB_WORKSPACE}/third_party/openssl/OpenSSL.xcframework"
          OPENSSL_SLICE="${OPENSSL_XCFRAMEWORK}/ios-arm64"
          OPENSSL_FRAMEWORK="${OPENSSL_SLICE}/OpenSSL.framework"

          test -d "${OPENSSL_XCFRAMEWORK}"
          test -d "${OPENSSL_SLICE}"
          test -d "${OPENSSL_FRAMEWORK}"

          test -f "${OPENSSL_FRAMEWORK}/OpenSSL"
          test -d "${OPENSSL_FRAMEWORK}/Headers"

          echo "=================================================="
          echo "OpenSSL layout"
          echo "=================================================="

          echo "XCFramework:"
          echo "${OPENSSL_XCFRAMEWORK}"

          echo
          echo "Slice:"
          echo "${OPENSSL_SLICE}"

          echo
          echo "Framework:"
          echo "${OPENSSL_FRAMEWORK}"

          echo
          echo "Binary:"
          file "${OPENSSL_FRAMEWORK}/OpenSSL"

          echo
          echo "Headers:"
          find \
            "${OPENSSL_FRAMEWORK}/Headers" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

      # ============================================================
      # Prepare OpenSSL
      # ============================================================

      - name: Prepare OpenSSL arm64
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_FRAMEWORK="${GITHUB_WORKSPACE}/third_party/openssl/OpenSSL.xcframework/ios-arm64/OpenSSL.framework"

          test -f "${OPENSSL_FRAMEWORK}/OpenSSL"
          test -d "${OPENSSL_FRAMEWORK}/Headers"

          rm -rf third_party/openssl-ios

          mkdir -p \
            third_party/openssl-ios/include \
            third_party/openssl-ios/framework

          # Headers for C/C++ compilation.
          cp -R \
            "${OPENSSL_FRAMEWORK}/Headers/." \
            third_party/openssl-ios/include/

          # Complete static framework.
          cp -R \
            "${OPENSSL_FRAMEWORK}/." \
            third_party/openssl-ios/framework/

          test -f \
            third_party/openssl-ios/framework/OpenSSL

          test -d \
            third_party/openssl-ios/framework/Headers

          test -f \
            third_party/openssl-ios/include/openssl/opensslv.h

          echo "=================================================="
          echo "Prepared OpenSSL"
          echo "=================================================="

          echo
          echo "OpenSSL binary:"
          file \
            third_party/openssl-ios/framework/OpenSSL

          echo
          echo "OpenSSL architecture:"
          lipo \
            -info \
            third_party/openssl-ios/framework/OpenSSL

          echo
          echo "OpenSSL version:"

          grep \
            -E \
            '#[[:space:]]*define[[:space:]]+OPENSSL_VERSION_TEXT' \
            third_party/openssl-ios/include/openssl/opensslv.h \
            || true

      # ============================================================
      # libcurl
      # ============================================================

      - name: Download prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl

          mkdir -p third_party/curl

          echo "=================================================="
          echo "Download prebuilt libcurl"
          echo "=================================================="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            "${CURL_URL}" \
            --output /tmp/libcurl_artifact.zip

          unzip \
            -q \
            -o \
            /tmp/libcurl_artifact.zip \
            -d third_party/curl

          echo
          echo "libcurl artifact:"
          find \
            third_party/curl \
            -maxdepth 8 \
            -type f \
            -print \
            | sort

      # ============================================================
      # libcurl headers
      #
      # Only headers are extracted.
      # NO libcurl compilation.
      # ============================================================

      - name: Download curl headers
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/curl-source

          mkdir -p /tmp/curl-source

          echo "=================================================="
          echo "Download curl 8.17.0 headers"
          echo "=================================================="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            "${CURL_SOURCE_URL}" \
            --output /tmp/curl-8.17.0.tar.xz

          tar \
            -xJf \
            /tmp/curl-8.17.0.tar.xz \
            -C /tmp/curl-source

          CURL_SOURCE_DIR="/tmp/curl-source/curl-8.17.0"

          test -d "${CURL_SOURCE_DIR}/include/curl"
          test -f "${CURL_SOURCE_DIR}/include/curl/curl.h"

          rm -rf third_party/curl-ios

          mkdir -p \
            third_party/curl-ios/include

          cp -R \
            "${CURL_SOURCE_DIR}/include/curl" \
            third_party/curl-ios/include/

          test -f \
            third_party/curl-ios/include/curl/curl.h

      # ============================================================
      # Prepare libcurl arm64
      # ============================================================

      - name: Prepare libcurl arm64
        shell: bash
        run: |
          set -euo pipefail

          CURL_ROOT="${GITHUB_WORKSPACE}/third_party/curl"

          mkdir -p \
            third_party/curl-ios/lib

          CURL_LIB="$(find \
            "${CURL_ROOT}" \
            -type f \
            -path "*/ios-arm64/*" \
            -name "libcurl.a" \
            -print \
            | head -n 1)"

          if [ -z "${CURL_LIB}" ]; then
            CURL_LIB="$(find \
              "${CURL_ROOT}" \
              -type f \
              -name "libcurl.a" \
              -print \
              | head -n 1)"
          fi

          if [ -z "${CURL_LIB}" ]; then
            echo "ERROR: prebuilt libcurl.a not found"
            exit 1
          fi

          cp \
            "${CURL_LIB}" \
            third_party/curl-ios/lib/libcurl.a

          test -f \
            third_party/curl-ios/lib/libcurl.a

          echo "=================================================="
          echo "libcurl"
          echo "=================================================="

          echo "Library:"
          echo "${CURL_LIB}"

          echo
          echo "Binary:"
          file \
            third_party/curl-ios/lib/libcurl.a

          echo
          echo "Architecture:"
          lipo \
            -info \
            third_party/curl-ios/lib/libcurl.a

          echo
          echo "Headers:"
          test -f \
            third_party/curl-ios/include/curl/curl.h

      # ============================================================
      # libarchive
      # ============================================================

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive

          echo "=================================================="
          echo "Get prebuilt libarchive"
          echo "=================================================="

          git clone \
            --depth 1 \
            "${LIBARCHIVE_REPO}" \
            third_party/libarchive

          ARCHIVE_ROOT="${GITHUB_WORKSPACE}/third_party/libarchive/libarchive-apple-build/libArchive.xcframework/ios-arm64"

          test -f \
            "${ARCHIVE_ROOT}/libarchive.a"

          test -d \
            "${ARCHIVE_ROOT}/Headers"

          rm -rf third_party/libarchive-ios

          mkdir -p \
            third_party/libarchive-ios/lib \
            third_party/libarchive-ios/include

          cp \
            "${ARCHIVE_ROOT}/libarchive.a" \
            third_party/libarchive-ios/lib/libarchive.a

          cp -R \
            "${ARCHIVE_ROOT}/Headers/." \
            third_party/libarchive-ios/include/

          test -f \
            third_party/libarchive-ios/lib/libarchive.a

          echo "=================================================="
          echo "libarchive"
          echo "=================================================="

          file \
            third_party/libarchive-ios/lib/libarchive.a

          lipo \
            -info \
            third_party/libarchive-ios/lib/libarchive.a

      # ============================================================
      # Dependency verification
      # ============================================================

      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Dependency verification"
          echo "=================================================="

          echo
          echo "OpenSSL:"
          file \
            third_party/openssl-ios/framework/OpenSSL

          lipo \
            -info \
            third_party/openssl-ios/framework/OpenSSL

          echo
          echo "libcurl:"
          file \
            third_party/curl-ios/lib/libcurl.a

          lipo \
            -info \
            third_party/curl-ios/lib/libcurl.a

          echo
          echo "libarchive:"
          file \
            third_party/libarchive-ios/lib/libarchive.a

          lipo \
            -info \
            third_party/libarchive-ios/lib/libarchive.a

          echo
          echo "libplist:"

          find \
            source/libplist_lib \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          test -n "$(find \
            source/libplist_lib \
            -type f \
            -name 'libplist*.a' \
            -print \
            -quit)"

      # ============================================================
      # Inspect curl -> OpenSSL references
      # ============================================================

      - name: Verify curl OpenSSL references
        shell: bash
        run: |
          set -euo pipefail

          CURL_LIB="third_party/curl-ios/lib/libcurl.a"
          OPENSSL_LIB="third_party/openssl-ios/framework/OpenSSL"

          test -f "${CURL_LIB}"
          test -f "${OPENSSL_LIB}"

          echo "=================================================="
          echo "libcurl -> OpenSSL"
          echo "=================================================="

          echo
          echo "OpenSSL exported symbols of interest:"

          nm \
            "${OPENSSL_LIB}" \
            2>/dev/null \
            | grep -E \
              'SSL_CTX_set_srp_password|SSL_CTX_set_srp_username|UI_OpenSSL' \
            | sort -u \
            || true

          echo
          echo "libcurl unresolved symbols of interest:"

          nm -u \
            "${CURL_LIB}" \
            2>/dev/null \
            | grep -E \
              'SSL_CTX_set_srp_password|SSL_CTX_set_srp_username|UI_OpenSSL' \
            | sort -u \
            || true

      # ============================================================
      # Create Theos project
      # ============================================================

      - name: Prepare Theos project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf theos-build

          mkdir -p theos-build

          cp \
            source/ldid.cpp \
            theos-build/ldid.cpp

          cp \
            source/ldid.hpp \
            theos-build/ldid.hpp

          cp -R \
            source/libplist_include \
            theos-build/libplist_include

          cp -R \
            source/libplist_lib \
            theos-build/libplist_lib

          cat > theos-build/Makefile <<'EOF'
          THEOS ?= $(CURDIR)/../theos

          TARGET := iphone:clang:16.5:16.0
          ARCHS := arm64

          TOOL_NAME := ldid

          ldid_FILES := ldid.cpp

          ldid_CXXFLAGS := \
              -std=c++20 \
              -O3 \
              -DNDEBUG \
              -flto=thin \
              -ffunction-sections \
              -fdata-sections \
              -fvisibility=hidden \
              -fstrict-aliasing \
              -Wall \
              -Wextra \
              -Wpedantic \
              -Werror

          ldid_CPPFLAGS := \
              -I$(CURDIR)/libplist_include \
              -I$(CURDIR)/../third_party/openssl-ios/include \
              -I$(CURDIR)/../third_party/curl-ios/include \
              -I$(CURDIR)/../third_party/libarchive-ios/include

          ldid_LDFLAGS := \
              -L$(CURDIR)/../third_party/curl-ios/lib \
              -L$(CURDIR)/../third_party/libarchive-ios/lib \
              -L$(CURDIR)/libplist_lib \
              -F$(CURDIR)/../third_party/openssl-ios/framework \
              -Wl,-dead_strip \
              -Wl,-no_warn_duplicate_libraries

          ldid_LDLIBS := \
              -lcurl \
              -larchive \
              -lplist \
              -framework OpenSSL \
              -framework Security \
              -framework CoreFoundation \
              -framework SystemConfiguration \
              -framework CFNetwork \
              -liconv \
              -lxml2 \
              -lz \
              -lbz2 \
              -lc++

          include $(THEOS)/makefiles/common.mk
          include $(THEOS_MAKE_PATH)/tool.mk
          EOF

          echo "=================================================="
          echo "Theos Makefile"
          echo "=================================================="

          cat theos-build/Makefile

      # ============================================================
      # Build
      # ============================================================

      - name: Build with Theos
        shell: bash
        run: |
          set -euo pipefail

          cd theos-build

          echo "=================================================="
          echo "Theos build"
          echo "=================================================="

          make \
            THEOS="${THEOS}" \
            TARGET="iphone:clang:16.5:16.0" \
            ARCHS="arm64" \
            -j"$(sysctl -n hw.logicalcpu_max)"

          test -f obj/ldid

          mkdir -p "${GITHUB_WORKSPACE}/build"

          cp \
            obj/ldid \
            "${GITHUB_WORKSPACE}/build/ldid"

          chmod 755 \
            "${GITHUB_WORKSPACE}/build/ldid"

      # ============================================================
      # Final Mach-O validation
      # ============================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="${GITHUB_WORKSPACE}/build/ldid"

          test -x "${BINARY}"

          echo "=================================================="
          echo "Final binary"
          echo "=================================================="

          file "${BINARY}"

          echo
          echo "Architecture:"
          lipo \
            -info \
            "${BINARY}"

          echo
          echo "Mach-O header:"
          xcrun \
            otool \
            -hv \
            "${BINARY}"

          echo
          echo "Load commands:"
          xcrun \
            otool \
            -l \
            "${BINARY}" \
            | grep -E \
              'LC_BUILD_VERSION|platform|minos|sdk' \
            || true

          echo
          echo "Undefined symbols:"
          xcrun \
            nm \
            -u \
            "${BINARY}" \
            || true

          echo
          echo "Version:"
          "${BINARY}" --version

      # ============================================================
      # Check that OpenSSL is statically incorporated
      # ============================================================

      - name: Check final OpenSSL linkage
        shell: bash
        run: |
          set -euo pipefail

          BINARY="${GITHUB_WORKSPACE}/build/ldid"

          echo "=================================================="
          echo "Final OpenSSL linkage"
          echo "=================================================="

          echo
          echo "OpenSSL-related symbols in final binary:"

          xcrun \
            nm \
            "${BINARY}" \
            2>/dev/null \
            | grep -E \
              '(_SSL_|_EVP_|_PKCS7_|_X509_|_BIO_)' \
            | head -n 80 \
            || true

          echo
          echo "Dynamic dependencies:"

          xcrun \
            otool \
            -L \
            "${BINARY}"

          echo
          echo "Checking for OpenSSL dynamic dependency:"

          if xcrun otool -L "${BINARY}" | grep -qi "OpenSSL.framework"; then
            echo "ERROR: final ldid unexpectedly contains a dynamic OpenSSL framework dependency"
            exit 1
          fi

          echo "OK: no OpenSSL.framework dynamic dependency."

      # ============================================================
      # Basic functional test
      # ============================================================

      - name: Functional smoke test
        shell: bash
        run: |
          set -euo pipefail

          BINARY="${GITHUB_WORKSPACE}/build/ldid"

          echo "=================================================="
          echo "Functional smoke test"
          echo "=================================================="

          "${BINARY}" --version

          "${BINARY}" --help \
            > /tmp/ldid-help.txt

          test -s /tmp/ldid-help.txt

          echo
          echo "Help output:"
          head -n 40 /tmp/ldid-help.txt

      # ============================================================
      # Package
      # ============================================================

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist

          cp \
            build/ldid \
            dist/ldid

          chmod 755 \
            dist/ldid

          cd dist

          zip \
            -9 \
            -q \
            ldid-ios-arm64.zip \
            ldid

          echo "=================================================="
          echo "Package"
          echo "=================================================="

          echo
          echo "Binary:"
          file ldid

          echo
          echo "Architecture:"
          lipo -info ldid

          echo
          echo "SHA256:"
          shasum -a 256 ldid
          shasum -a 256 ldid-ios-arm64.zip

          echo
          echo "Size:"
          ls -lh \
            ldid \
            ldid-ios-arm64.zip

      # ============================================================
      # Upload
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            dist/ldid
            dist/ldid-ios-arm64.zip
          if-no-files-found: error
          retention-days: 14
