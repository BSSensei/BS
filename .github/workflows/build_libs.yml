name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  # ==============================================================
  # FINAL iOS MINIMUM VERSION
  # ==============================================================
  IOS_DEPLOYMENT_TARGET: "16.0"

  # Exact SDK requested
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  # ==============================================================
  # Prebuilt libarchive
  # ==============================================================
  LIBARCHIVE_REPOSITORY: "okferret/libarchive"

  # ==============================================================
  # Prebuilt OpenSSL + libcurl
  #
  # IMPORTANT:
  # Do NOT mix this libcurl with the old OpenSSL from ldid.zip.
  #
  # The jasonacox project provides matching prebuilt iOS:
  #
  #   libcrypto.a
  #   libssl.a
  #   libcurl_iOS.a
  #
  # so all three come from the same build family.
  # ==============================================================
  OPENSSL_CURL_REPOSITORY: "jasonacox/Build-OpenSSL-cURL"

jobs:
  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # Extract ldid source
      #
      # We intentionally DO NOT use the bundled OpenSSL anymore.
      # It was built for iOS 16.0 but its ABI does not match the
      # previously selected prebuilt libcurl.
      # ============================================================

      - name: Extract ldid
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== EXTRACTED SOURCE ====="
          find source -maxdepth 2 -print


      # ============================================================
      # Download exact iPhoneOS 16.5 SDK
      # ============================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -e

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf \
            "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          if [ -z "${IOS_SDK_DIR}" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found."
            exit 1
          fi

          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== IOS SDK ====="
          echo "${IOS_SDK_DIR}"


      # ============================================================
      # Configure compiler
      # ============================================================

      - name: Configure compiler
        shell: bash
        run: |
          set -e

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== COMPILER ====="
          "${IOS_CLANGXX}" --version


      # ============================================================
      # Locate bundled libplist
      # ============================================================

      - name: Locate libplist
        shell: bash
        run: |
          set -e

          PLIST="$(
            find source/libplist_lib \
              -type f \
              -name "libplist*.a" \
              -print \
              -quit
          )"

          if [ -z "${PLIST}" ]; then
            echo "ERROR: libplist.a not found."
            find source/libplist_lib -print
            exit 1
          fi

          PLIST="$(cd "$(dirname "${PLIST}")" && pwd)/$(basename "${PLIST}")"

          echo "PLIST=${PLIST}" >> "${GITHUB_ENV}"

          echo "===== LIBPLIST ====="
          echo "PLIST=${PLIST}"


      # ============================================================
      # Fix macOS-only SecStaticCode APIs for iOS
      # ============================================================

      - name: Patch ldid for iOS Security APIs
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("source/ldid.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # Security/CoreFoundation include guard
          # --------------------------------------------------------

          old = """#ifdef __APPLE__
          #include <Security/Security.h>
          #include <CoreFoundation/CoreFoundation.h>
          #endif"""

          new = """#if defined(__APPLE__)
          #include <TargetConditionals.h>
          #if TARGET_OS_OSX
          #include <Security/Security.h>
          #include <CoreFoundation/CoreFoundation.h>
          #endif
          #endif"""

          if old in s:
              s = s.replace(old, new, 1)

          # --------------------------------------------------------
          # macOS SecStaticCode implementation
          # --------------------------------------------------------

          s = s.replace(
              "#ifdef __APPLE__\ninline bool verify_with_apple_system",
              "#if defined(__APPLE__) && TARGET_OS_OSX\n"
              "inline bool verify_with_apple_system",
              1
          )

          s = s.replace(
              "#ifdef __APPLE__\r\ninline bool verify_with_apple_system",
              "#if defined(__APPLE__) && TARGET_OS_OSX\r\n"
              "inline bool verify_with_apple_system",
              1
          )

          # --------------------------------------------------------
          # verify_with_system_impl()
          # --------------------------------------------------------

          old = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\n"
              "#ifdef __APPLE__"
          )

          new = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\n"
              "#if defined(__APPLE__) && TARGET_OS_OSX"
          )

          if old in s:
              s = s.replace(old, new, 1)

          old = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\r\n"
              "#ifdef __APPLE__"
          )

          new = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\r\n"
              "#if defined(__APPLE__) && TARGET_OS_OSX"
          )

          if old in s:
              s = s.replace(old, new, 1)

          # --------------------------------------------------------
          # Ensure the source contains the required guard.
          # --------------------------------------------------------

          if "SecStaticCodeRef" in s and "TARGET_OS_OSX" not in s:
              raise SystemExit(
                  "ERROR: SecStaticCodeRef exists but "
                  "TARGET_OS_OSX guard was not installed."
              )

          p.write_text(s)
          PY

          echo "===== SECURITY API GUARD ====="

          grep -n -E \
            'TargetConditionals|TARGET_OS_OSX|SecStaticCode|verify_with_system_impl' \
            source/ldid.cpp || true

          test -f source/ldid.cpp
          test -f source/ldid.hpp


      # ============================================================
      # Download prebuilt libarchive
      # ============================================================

      - name: Download libarchive
        shell: bash
        run: |
          set -e

          rm -rf third_party/libarchive
          mkdir -p third_party

          git clone \
            --depth 1 \
            "https://github.com/${LIBARCHIVE_REPOSITORY}.git" \
            third_party/libarchive

          test -d third_party/libarchive


      # ============================================================
      # Locate libarchive iOS arm64
      # ============================================================

      - name: Locate libarchive
        shell: bash
        run: |
          set -e

          XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name "libArchive.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${XCFRAMEWORK}" ]; then
            XCFRAMEWORK="$(
              find third_party/libarchive \
                -type d \
                -name "*.xcframework" \
                -print \
                -quit
            )"
          fi

          if [ -z "${XCFRAMEWORK}" ]; then
            echo "ERROR: libarchive XCFramework not found."
            find third_party/libarchive -maxdepth 6 -print
            exit 1
          fi

          SLICE="${XCFRAMEWORK}/ios-arm64"

          if [ ! -d "${SLICE}" ]; then
            echo "ERROR: iOS arm64 libarchive slice not found."
            find "${XCFRAMEWORK}" -maxdepth 5 -print
            exit 1
          fi

          LIBARCHIVE="$(
            find "${SLICE}" \
              -type f \
              -name "libarchive.a" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE}" ]; then
            echo "ERROR: libarchive.a not found."
            find "${SLICE}" -print
            exit 1
          fi

          HEADERS="$(
            find "${SLICE}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          if [ -z "${HEADERS}" ]; then
            echo "ERROR: libarchive Headers not found."
            find "${SLICE}" -maxdepth 5 -print
            exit 1
          fi

          LIBARCHIVE="$(cd "$(dirname "${LIBARCHIVE}")" && pwd)/$(basename "${LIBARCHIVE}")"
          HEADERS="$(cd "${HEADERS}" && pwd)"

          echo "LIBARCHIVE=${LIBARCHIVE}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${HEADERS}" >> "${GITHUB_ENV}"

          echo "===== LIBARCHIVE ====="
          echo "LIBARCHIVE=${LIBARCHIVE}"
          echo "HEADERS=${HEADERS}"


      # ============================================================
      # Validate libarchive
      # ============================================================

      - name: Validate libarchive
        shell: bash
        run: |
          set -e

          test -f "${LIBARCHIVE}"
          test -d "${LIBARCHIVE_HEADERS}"

          file "${LIBARCHIVE}"
          lipo -info "${LIBARCHIVE}" || true

          echo "===== LIBARCHIVE SYMBOLS ====="

          nm -gU "${LIBARCHIVE}" 2>/dev/null |
            grep -E \
              "archive_read_new|archive_read_open|archive_write_new|archive_write_open" |
            head -20 || true


      # ============================================================
      # Download prebuilt OpenSSL + libcurl bundle
      #
      # We use the GitHub Release archives from the same project.
      #
      # This is IMPORTANT:
      #
      #   libcurl
      #       +
      #   libssl
      #       +
      #   libcrypto
      #
      # come from the same build family.
      # ============================================================

      - name: Download prebuilt OpenSSL and libcurl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

          gh --version

          rm -rf third_party/openssl-curl

          mkdir -p \
            third_party/openssl-curl/download \
            third_party/openssl-curl/extracted

          echo "===== RELEASES ====="

          gh release list \
            --repo "${OPENSSL_CURL_REPOSITORY}" \
            --limit 5

          RELEASE_TAG="$(
            gh release list \
              --repo "${OPENSSL_CURL_REPOSITORY}" \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )"

          if [ -z "${RELEASE_TAG}" ]; then
            echo "ERROR: no release found for:"
            echo "${OPENSSL_CURL_REPOSITORY}"
            exit 1
          fi

          echo "OPENSSL_CURL_RELEASE=${RELEASE_TAG}" >> "${GITHUB_ENV}"

          echo "Using release:"
          echo "${RELEASE_TAG}"

          gh release download \
            "${RELEASE_TAG}" \
            --repo "${OPENSSL_CURL_REPOSITORY}" \
            --dir third_party/openssl-curl/download \
            --clobber

          echo "===== DOWNLOADED ASSETS ====="

          find \
            third_party/openssl-curl/download \
            -maxdepth 3 \
            -type f \
            -print


      # ============================================================
      # Extract OpenSSL/cURL release
      # ============================================================

      - name: Extract prebuilt OpenSSL and libcurl
        shell: bash
        run: |
          set -e

          FOUND=0

          while IFS= read -r -d '' FILE; do
            case "${FILE}" in

              *.zip|*.ZIP)
                FOUND=1

                unzip \
                  -q \
                  -o \
                  "${FILE}" \
                  -d third_party/openssl-curl/extracted
                ;;

              *.tar.gz|*.tgz)
                FOUND=1

                tar \
                  -xzf \
                  "${FILE}" \
                  -C third_party/openssl-curl/extracted
                ;;

              *.tar.xz)
                FOUND=1

                tar \
                  -xJf \
                  "${FILE}" \
                  -C third_party/openssl-curl/extracted
                ;;

              *.tar.bz2|*.tbz2)
                FOUND=1

                tar \
                  -xjf \
                  "${FILE}" \
                  -C third_party/openssl-curl/extracted
                ;;

            esac
          done < <(
            find \
              third_party/openssl-curl/download \
              -type f \
              -print0
          )

          if [ "${FOUND}" -eq 0 ]; then
            echo "ERROR: no supported OpenSSL/cURL release archive found."

            find \
              third_party/openssl-curl/download \
              -maxdepth 5 \
              -print

            exit 1
          fi

          echo "===== EXTRACTED OPENSSL/CURL ====="

          find \
            third_party/openssl-curl/extracted \
            -maxdepth 10 \
            -print


      # ============================================================
      # Locate matching OpenSSL
      # ============================================================

      - name: Locate prebuilt OpenSSL
        shell: bash
        run: |
          set -e

          ROOT="third_party/openssl-curl/extracted"

          echo "===== SEARCHING OPENSSL ====="

          CRYPTO="$(
            find "${ROOT}" \
              -type f \
              -name "libcrypto.a" \
              -print \
              -quit
          )"

          SSL="$(
            find "${ROOT}" \
              -type f \
              -name "libssl.a" \
              -print \
              -quit
          )"

          if [ -z "${CRYPTO}" ]; then
            echo "ERROR: prebuilt libcrypto.a not found."

            find "${ROOT}" \
              -type f \
              -print

            exit 1
          fi

          if [ -z "${SSL}" ]; then
            echo "ERROR: prebuilt libssl.a not found."

            find "${ROOT}" \
              -type f \
              -print

            exit 1
          fi

          CRYPTO="$(cd "$(dirname "${CRYPTO}")" && pwd)/$(basename "${CRYPTO}")"
          SSL="$(cd "$(dirname "${SSL}")" && pwd)/$(basename "${SSL}")"

          echo "CRYPTO=${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${SSL}" >> "${GITHUB_ENV}"

          echo "===== OPENSSL ====="
          echo "CRYPTO=${CRYPTO}"
          echo "SSL=${SSL}"

          file "${CRYPTO}"
          file "${SSL}"

          lipo -info "${CRYPTO}" || true
          lipo -info "${SSL}" || true


      # ============================================================
      # Locate matching libcurl
      # ============================================================

      - name: Locate prebuilt libcurl
        shell: bash
        run: |
          set -e

          ROOT="third_party/openssl-curl/extracted"

          echo "===== SEARCHING CURL ====="

          CURL="$(
            find "${ROOT}" \
              -type f \
              \( \
                -name "libcurl_iOS.a" \
                -o \
                -name "libcurl.a" \
              \) \
              -print \
              -quit
          )"

          if [ -z "${CURL}" ]; then
            echo "ERROR: matching prebuilt iOS libcurl not found."

            find "${ROOT}" \
              -type f \
              -print

            exit 1
          fi

          CURL="$(cd "$(dirname "${CURL}")" && pwd)/$(basename "${CURL}")"

          echo "CURL=${CURL}" >> "${GITHUB_ENV}"

          echo "===== LIBCURL ====="
          echo "CURL=${CURL}"

          file "${CURL}"
          lipo -info "${CURL}" || true


      # ============================================================
      # Locate matching OpenSSL headers
      # ============================================================

      - name: Locate OpenSSL headers
        shell: bash
        run: |
          set -e

          ROOT="third_party/openssl-curl/extracted"

          OPENSSL_HEADERS="$(
            find "${ROOT}" \
              -type f \
              -path "*/include/openssl/opensslv.h" \
              -print \
              -quit
          )"

          if [ -z "${OPENSSL_HEADERS}" ]; then
            OPENSSL_HEADERS="$(
              find "${ROOT}" \
                -type f \
                -path "*/Headers/openssl/opensslv.h" \
                -print \
                -quit
            )"
          fi

          if [ -z "${OPENSSL_HEADERS}" ]; then
            echo "ERROR: matching OpenSSL headers not found."

            find "${ROOT}" \
              -type f \
              -name "opensslv.h" \
              -print

            exit 1
          fi

          OPENSSL_HEADERS="$(dirname "$(dirname "$(dirname "${OPENSSL_HEADERS}")")")"

          if [ ! -f "${OPENSSL_HEADERS}/openssl/opensslv.h" ]; then
            echo "ERROR: calculated OpenSSL header directory is invalid:"
            echo "${OPENSSL_HEADERS}"
            exit 1
          fi

          echo "OPENSSL_HEADERS=${OPENSSL_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== OPENSSL HEADERS ====="
          echo "${OPENSSL_HEADERS}"


      # ============================================================
      # Locate matching curl headers
      # ============================================================

      - name: Locate libcurl headers
        shell: bash
        run: |
          set -e

          ROOT="third_party/openssl-curl/extracted"

          CURL_HEADER="$(
            find "${ROOT}" \
              -type f \
              -path "*/include/curl/curl.h" \
              -print \
              -quit
          )"

          if [ -z "${CURL_HEADER}" ]; then
            CURL_HEADER="$(
              find "${ROOT}" \
                -type f \
                -path "*/Headers/curl/curl.h" \
                -print \
                -quit
            )"
          fi

          if [ -z "${CURL_HEADER}" ]; then
            echo "ERROR: matching curl headers not found."

            find "${ROOT}" \
              -type f \
              -name "curl.h" \
              -print

            exit 1
          fi

          CURL_HEADERS="$(
            dirname \
              "$(dirname \
                "$(dirname "${CURL_HEADER}")")"
          )"

          if [ ! -f "${CURL_HEADERS}/curl/curl.h" ]; then
            echo "ERROR: calculated curl header directory is invalid:"
            echo "${CURL_HEADERS}"
            exit 1
          fi

          echo "CURL_HEADERS=${CURL_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== CURL HEADERS ====="
          echo "${CURL_HEADERS}"


      # ============================================================
      # Validate OpenSSL ABI
      #
      # This specifically catches the previous problem before linking.
      # ============================================================

      - name: Validate OpenSSL ABI
        shell: bash
        run: |
          set -e

          echo "===== OPENSSL VERSION ====="

          grep \
            -E \
            'OPENSSL_VERSION_TEXT|OPENSSL_VERSION_NUMBER' \
            "${OPENSSL_HEADERS}/openssl/opensslv.h" |
            head -10 || true

          echo "===== OPENSSL ARCHITECTURE ====="

          file "${CRYPTO}"
          file "${SSL}"

          lipo -info "${CRYPTO}" || true
          lipo -info "${SSL}" || true

          echo "===== OPENSSL COMPATIBILITY SYMBOLS ====="

          echo "libcrypto:"
          nm -gU "${CRYPTO}" 2>/dev/null |
            grep -E \
              'UI_OpenSSL|SSL_CTX_set_srp_username|SSL_CTX_set_srp_password' |
            head -20 || true

          echo "libssl:"
          nm -gU "${SSL}" 2>/dev/null |
            grep -E \
              'SSL_CTX_set_srp_username|SSL_CTX_set_srp_password' |
            head -20 || true


      # ============================================================
      # Validate libcurl dependency symbols
      # ============================================================

      - name: Validate libcurl ABI
        shell: bash
        run: |
          set -e

          echo "===== LIBCURL ARCHITECTURE ====="

          file "${CURL}"
          lipo -info "${CURL}" || true

          echo "===== CURL SSL SYMBOL REFERENCES ====="

          nm -u "${CURL}" 2>/dev/null |
            grep -E \
              'SSL_CTX_|UI_OpenSSL|OPENSSL|curl_easy_' |
            head -100 || true


      # ============================================================
      # Build iOS arm64
      #
      # Minimum iOS = 16.0
      # ============================================================

      - name: Build ldid
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          echo "TARGET=${TARGET}"
          echo "SDK=${IOS_SDK_DIR}"

          echo
          echo "OpenSSL:"
          echo "  headers=${OPENSSL_HEADERS}"
          echo "  libcrypto=${CRYPTO}"
          echo "  libssl=${SSL}"

          echo
          echo "libcurl:"
          echo "  headers=${CURL_HEADERS}"
          echo "  library=${CURL}"

          echo
          echo "libarchive:"
          echo "  headers=${LIBARCHIVE_HEADERS}"
          echo "  library=${LIBARCHIVE}"

          echo
          echo "libplist:"
          echo "  library=${PLIST}"

          echo
          echo "Minimum iOS:"
          echo "${IOS_DEPLOYMENT_TARGET}"

          echo
          echo "=========================================="

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_HEADERS}" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${CURL_HEADERS}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -liconv \
            -lxml2 \
            -lc++ \
            -lz \
            -lbz2 \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid

          test -s build/ldid

          echo
          echo "===== BUILD SUCCESS ====="


      # ============================================================
      # Validate final binary
      # ============================================================

      - name: Validate binary
        shell: bash
        run: |
          set -e

          test -f build/ldid

          echo "===== FILE ====="
          file build/ldid

          echo "===== ARCHITECTURE ====="
          lipo -info build/ldid

          echo "===== MACH-O HEADER ====="
          otool -hv build/ldid

          echo "===== BUILD VERSION ====="

          otool -l build/ldid > build/load_commands.txt

          awk '
            /LC_BUILD_VERSION/ {
              print
              n=8
              next
            }
            n > 0 {
              print
              n--
            }
          ' build/load_commands.txt

          echo "===== LINKED FRAMEWORKS ====="

          otool -L build/ldid

          echo "===== MINIMUM IOS CHECK ====="

          if ! grep -A8 "LC_BUILD_VERSION" build/load_commands.txt |
               grep -q "minos 16.0"; then
            echo "ERROR: final binary does not report iOS 16.0 minimum."
            exit 1
          fi


      # ============================================================
      # Strip final binary
      # ============================================================

      - name: Strip binary
        shell: bash
        run: |
          set -e

          cp \
            build/ldid \
            build/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid

          test -s build/ldid

          echo "===== STRIPPED BINARY ====="

          file build/ldid
          lipo -info build/ldid


      # ============================================================
      # Package corrected source
      # ============================================================

      - name: Package corrected source
        shell: bash
        run: |
          set -e

          rm -rf dist

          mkdir -p dist/source

          cp \
            source/ldid.cpp \
            dist/source/ldid.cpp

          cp \
            source/ldid.hpp \
            dist/source/ldid.hpp

          test -f dist/source/ldid.cpp
          test -f dist/source/ldid.hpp

          tar \
            -C dist \
            -czf \
            ldid-ios-arm64-source.tar.gz \
            source

          shasum \
            -a 256 \
            ldid-ios-arm64-source.tar.gz \
            > ldid-ios-arm64-source.tar.gz.sha256

          echo "===== CORRECTED SOURCE ====="

          grep -n -E \
            'TargetConditionals|TARGET_OS_OSX|SecStaticCode' \
            dist/source/ldid.cpp || true


      # ============================================================
      # Package final iOS ldid
      # ============================================================

      - name: Package iOS ldid
        shell: bash
        run: |
          set -e

          cp \
            build/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== FINAL ARTIFACTS ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256 \
            ldid-ios-arm64-source.tar.gz \
            ldid-ios-arm64-source.tar.gz.sha256

          echo
          echo "===== SHA256 ====="

          cat ldid-ios-arm64.tar.gz.sha256
          cat ldid-ios-arm64-source.tar.gz.sha256


      # ============================================================
      # Upload
      # ============================================================

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
            ldid-ios-arm64-source.tar.gz
            ldid-ios-arm64-source.tar.gz.sha256
            build/ldid.unstripped
          if-no-files-found: error
          retention-days: 30
