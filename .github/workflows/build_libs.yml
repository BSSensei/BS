name: 库

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # 保留凭据，避免后续克隆失败

      - name: 安装编译工具和依赖
        run: |
          # 安装 autotools（libplist 必需）和基础工具
          brew install cmake make git autoconf automake libtool pkg-config

      - name: 配置 Git 认证（解决克隆失败）
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: 编译所有静态库
        run: |
          chmod +x scripts/build_all.sh
          bash scripts/build_all.sh

      - name: 上传静态库
        uses: actions/upload-artifact@v4
        with:
          name: ios-static-libs
          path: Frameworks/  # 与脚本输出路径一致

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt.gz  # 脚本生成的压缩日志
