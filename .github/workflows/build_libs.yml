name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  CURL_VERSION: "8.16.0"

  LIBARCHIVE_URL: "https://www.libarchive.org/downloads/libarchive-3.8.2.tar.xz"
  CURL_URL: "https://github.com/curl/curl/releases/download/curl-8_16_0/curl-8.16.0.tar.xz"

jobs:

  # ============================================================
  # macOS
  # ============================================================

  macos:
    name: macOS build
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew update

          brew install \
            openssl@3 \
            libplist \
            libarchive \
            curl

      - name: Extract ldid
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "===== ldid source ====="
          find source -maxdepth 2 -type f -print

      - name: Build macOS ldid
        run: |
          set -euo pipefail

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          PLIST_PREFIX="$(brew --prefix libplist)"
          ARCHIVE_PREFIX="$(brew --prefix libarchive)"
          CURL_PREFIX="$(brew --prefix curl)"

          mkdir -p build/macos

          clang++ \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_PREFIX}/include" \
            -I"${PLIST_PREFIX}/include" \
            -I"${ARCHIVE_PREFIX}/include" \
            -I"${CURL_PREFIX}/include" \
            source/ldid.cpp \
            -L"${OPENSSL_PREFIX}/lib" \
            -L"${PLIST_PREFIX}/lib" \
            -L"${ARCHIVE_PREFIX}/lib" \
            -L"${CURL_PREFIX}/lib" \
            -lcrypto \
            -lssl \
            -lplist-2.0 \
            -larchive \
            -lcurl \
            -framework Security \
            -framework CoreFoundation \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/macos/ldid

      - name: macOS smoke test
        run: |
          set -euo pipefail

          echo "===== version ====="
          ./build/macos/ldid --version

          echo "===== binary ====="
          file build/macos/ldid

          echo "===== dependencies ====="
          otool -L build/macos/ldid


  # ============================================================
  # iOS arm64
  # ============================================================

  ios:
    name: iOS arm64 build
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Extract user's ldid.zip
      # --------------------------------------------------------

      - name: Extract ldid source
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "===== extracted source ====="
          find source -maxdepth 2 -type f -print

      # --------------------------------------------------------
      # Validate bundled dependencies
      # --------------------------------------------------------

      - name: Validate bundled OpenSSL and libplist
        run: |
          set -euo pipefail

          test -d source/openssl_lib
          test -d source/openssl_include

          test -d source/libplist_lib
          test -d source/libplist_include

          echo "===== OpenSSL libraries ====="
          find source/openssl_lib \
            -maxdepth 2 \
            -type f \
            -print

          echo "===== libplist libraries ====="
          find source/libplist_lib \
            -maxdepth 2 \
            -type f \
            -print

          echo "===== OpenSSL headers ====="
          find source/openssl_include \
            -maxdepth 2 \
            -type f \
            | head -50

          echo "===== libplist headers ====="
          find source/libplist_include \
            -maxdepth 2 \
            -type f \
            | head -50

      # --------------------------------------------------------
      # Download exact iOS SDK requested by user
      # --------------------------------------------------------

      - name: Download iPhoneOS 16.5 SDK
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/ios-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== SDK ====="
          echo "${IOS_SDK_DIR}"

          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

      # --------------------------------------------------------
      # Apple toolchain
      # --------------------------------------------------------

      - name: Configure iOS toolchain
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          IOS_AR="$(xcrun --sdk iphoneos --find ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos --find ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos --find strip)"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "CC=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "CXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"

          echo "===== clang ====="
          "${IOS_CLANG}" --version

          echo "===== clang++ ====="
          "${IOS_CLANGXX}" --version

      # --------------------------------------------------------
      # Download libarchive source
      # --------------------------------------------------------

      - name: Download libarchive 3.8.2
        run: |
          set -euo pipefail

          rm -rf \
            third_party \
            libarchive-3.8.2 \
            libarchive-3.8.2.tar.xz

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o libarchive-3.8.2.tar.xz \
            "${LIBARCHIVE_URL}"

          test -s libarchive-3.8.2.tar.xz

          tar \
            -xJf libarchive-3.8.2.tar.xz

          test -d libarchive-3.8.2

          mv \
            libarchive-3.8.2 \
            third_party/libarchive-src

          test -f third_party/libarchive-src/CMakeLists.txt

          echo "===== libarchive source ====="
          find third_party/libarchive-src \
            -maxdepth 2 \
            -type f \
            | head -100

      # --------------------------------------------------------
      # Download curl source
      # --------------------------------------------------------

      - name: Download curl 8.16.0
        run: |
          set -euo pipefail

          rm -rf \
            curl-8.16.0 \
            curl-8.16.0.tar.xz

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o curl-8.16.0.tar.xz \
            "${CURL_URL}"

          test -s curl-8.16.0.tar.xz

          tar \
            -xJf curl-8.16.0.tar.xz

          test -d curl-8.16.0

          mv \
            curl-8.16.0 \
            third_party/curl-src

          test -f third_party/curl-src/CMakeLists.txt

          echo "===== curl source ====="
          find third_party/curl-src \
            -maxdepth 2 \
            -type f \
            | head -100

      # --------------------------------------------------------
      # Build libarchive
      # --------------------------------------------------------

      - name: Configure libarchive
        run: |
          set -euo pipefail

          rm -rf \
            third_party/libarchive-build \
            third_party/libarchive-install

          mkdir -p \
            third_party/libarchive-build \
            third_party/libarchive-install

          cmake \
            -S third_party/libarchive-src \
            -B third_party/libarchive-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${IOS_CLANG}" \
            -DCMAKE_CXX_COMPILER="${IOS_CLANGXX}" \
            -DCMAKE_AR="${IOS_AR}" \
            -DCMAKE_RANLIB="${IOS_RANLIB}" \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_INSTALL=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ACL=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_CNG=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_LIBB2=OFF \
            -DENABLE_LZ4=OFF \
            -DENABLE_LZO=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_BZip2=OFF \
            -DENABLE_LIBXML2=OFF \
            -DENABLE_EXPAT=OFF \
            -DENABLE_PCREPOSIX=OFF \
            -DENABLE_PCRE2POSIX=OFF \
            -DENABLE_LIBGCC=OFF

      - name: Build libarchive
        run: |
          set -euo pipefail

          if ! cmake \
            --build third_party/libarchive-build \
            --parallel \
            --verbose
          then
            echo "::error::libarchive build failed"

            echo "===== libarchive CMake errors ====="

            find third_party/libarchive-build \
              -type f \
              \( \
                -name CMakeError.log \
                -o \
                -name CMakeOutput.log \
              \) \
              -print \
              -exec tail -n 500 {} \; \
              || true

            echo "===== libarchive CMake cache ====="

            grep -E \
              'ENABLE_|CMAKE_OSX|CMAKE_SYSTEM|CMAKE_C_COMPILER' \
              third_party/libarchive-build/CMakeCache.txt \
              || true

            exit 1
          fi

      - name: Locate libarchive
        run: |
          set -euo pipefail

          LIBARCHIVE_STATIC="$(
            find third_party/libarchive-build \
              -type f \
              \( \
                -name 'libarchive.a' \
                -o \
                -name 'libarchive_static.a' \
              \) \
              -print \
              | head -1
          )"

          test -n "${LIBARCHIVE_STATIC}"
          test -f "${LIBARCHIVE_STATIC}"

          echo "LIBARCHIVE_STATIC=${LIBARCHIVE_STATIC}" >> "${GITHUB_ENV}"

          echo "===== libarchive ====="
          file "${LIBARCHIVE_STATIC}"

      # --------------------------------------------------------
      # Configure curl
      #
      # Important:
      #   NO -C curl-ios-cache.cmake
      #
      # _CURL_PREFILL=ON is curl's own feature-prefill mechanism.
      # --------------------------------------------------------

      - name: Configure curl 8.16.0
        run: |
          set -euo pipefail

          rm -rf \
            third_party/curl-build \
            third_party/curl-install

          mkdir -p \
            third_party/curl-build \
            third_party/curl-install

          OPENSSL_ROOT="${GITHUB_WORKSPACE}/source"

          test -d "${OPENSSL_ROOT}/openssl_include"
          test -d "${OPENSSL_ROOT}/openssl_lib"

          test -f "${OPENSSL_ROOT}/openssl_lib/libcrypto.a"
          test -f "${OPENSSL_ROOT}/openssl_lib/libssl.a"

          cmake \
            -S third_party/curl-src \
            -B third_party/curl-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${IOS_CLANG}" \
            -DCMAKE_CXX_COMPILER="${IOS_CLANGXX}" \
            -DCMAKE_AR="${IOS_AR}" \
            -DCMAKE_RANLIB="${IOS_RANLIB}" \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=EXECUTABLE \
            -D_CURL_PREFILL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_LIBCURL_DOCS=OFF \
            -DBUILD_MISC_DOCS=OFF \
            -DENABLE_CURL_MANUAL=OFF \
            -DCURL_BUILD_EVERYTHING=OFF \
            -DCURL_DISABLE_INSTALL=ON \
            -DCURL_DISABLE_NTLM=ON \
            -DENABLE_THREADED_RESOLVER=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}" \
            -DOPENSSL_INCLUDE_DIR="${OPENSSL_ROOT}/openssl_include" \
            -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_ROOT}/openssl_lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="${OPENSSL_ROOT}/openssl_lib/libssl.a" \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_FILE=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_IMAPS=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_POP3S=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_SMB=ON \
            -DCURL_DISABLE_SMBS=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_SMTPS=ON \
            -DCURL_DISABLE_TFTP=ON \
            -DCURL_DISABLE_WS=ON \
            -DCURL_DISABLE_WSS=ON

      - name: Build curl
        run: |
          set -euo pipefail

          if ! cmake \
            --build third_party/curl-build \
            --parallel \
            --verbose
          then
            echo "::error::curl 8.16.0 build failed"

            echo "===== curl CMake errors ====="

            find third_party/curl-build \
              -type f \
              \( \
                -name CMakeError.log \
                -o \
                -name CMakeOutput.log \
              \) \
              -print \
              -exec tail -n 600 {} \; \
              || true

            echo "===== curl cache ====="

            grep -E \
              'HAVE_ATOMIC|HAVE_GETHOST|CURL_DISABLE_NTLM|_CURL_PREFILL|THREADED_RESOLVER' \
              third_party/curl-build/CMakeCache.txt \
              || true

            echo "===== curl CMake files ====="

            find third_party/curl-build/CMakeFiles \
              -maxdepth 3 \
              -type f \
              -print \
              | sort \
              | tail -150 \
              || true

            exit 1
          fi

      - name: Locate curl
        run: |
          set -euo pipefail

          CURL_STATIC="$(
            find third_party/curl-build \
              -type f \
              -name 'libcurl.a' \
              -print \
              | head -1
          )"

          test -n "${CURL_STATIC}"
          test -f "${CURL_STATIC}"

          echo "CURL_STATIC=${CURL_STATIC}" >> "${GITHUB_ENV}"

          echo "===== curl ====="
          file "${CURL_STATIC}"

      # --------------------------------------------------------
      # Final ldid
      # --------------------------------------------------------

      - name: Build ldid iOS arm64
        run: |
          set -euo pipefail

          rm -rf build/ios
          mkdir -p build/ios

          OPENSSL_INCLUDE="${GITHUB_WORKSPACE}/source/openssl_include"
          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"

          PLIST_INCLUDE="${GITHUB_WORKSPACE}/source/libplist_include"
          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"

          test -d "${OPENSSL_INCLUDE}"
          test -d "${OPENSSL_LIB}"
          test -d "${PLIST_INCLUDE}"
          test -d "${PLIST_LIB}"

          test -f "${OPENSSL_LIB}/libcrypto.a"
          test -f "${OPENSSL_LIB}/libssl.a"

          test -f "${PLIST_LIB}/libplist-2.0.a"
          test -f "${LIBARCHIVE_STATIC}"
          test -f "${CURL_STATIC}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -arch arm64 \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_INCLUDE}" \
            -I"${PLIST_INCLUDE}" \
            source/ldid.cpp \
            "${LIBARCHIVE_STATIC}" \
            "${CURL_STATIC}" \
            "${PLIST_LIB}/libplist-2.0.a" \
            "${OPENSSL_LIB}/libssl.a" \
            "${OPENSSL_LIB}/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -lz \
            -lc++ \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ios/ldid

      # --------------------------------------------------------
      # Validate final binary
      # --------------------------------------------------------

      - name: Validate iOS binary
        run: |
          set -euo pipefail

          test -f build/ios/ldid

          echo "===== file ====="
          file build/ios/ldid

          echo "===== architecture ====="
          xcrun lipo -info build/ios/ldid

          echo "===== load commands ====="
          xcrun otool \
            -arch arm64 \
            -l \
            build/ios/ldid \
            | grep -E \
                'LC_BUILD_VERSION|platform|minos|sdk' \
            || true

          echo "===== linked libraries ====="
          xcrun otool \
            -arch arm64 \
            -L \
            build/ios/ldid

      # --------------------------------------------------------
      # Strip
      # --------------------------------------------------------

      - name: Strip final binary
        run: |
          set -euo pipefail

          cp \
            build/ios/ldid \
            build/ios/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ios/ldid

          echo "===== stripped binary ====="
          file build/ios/ldid
          xcrun lipo -info build/ios/ldid

      # --------------------------------------------------------
      # Package ONLY iOS artifact
      # --------------------------------------------------------

      - name: Package iOS artifact
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          tar \
            -C build/ios \
            -czf release/ldid-ios-arm64.tar.gz \
            ldid

          shasum \
            -a 256 \
            release/ldid-ios-arm64.tar.gz \
            > release/ldid-ios-arm64.tar.gz.sha256

          echo "===== release ====="
          ls -lh release

          echo "===== SHA256 ====="
          cat release/ldid-ios-arm64.tar.gz.sha256

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64.tar.gz
            release/ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
