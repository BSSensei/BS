name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "16.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  CURL_URL: "https://github.com/XDcobra/libcurl-ios-prebuilt-and-buildscripts/releases/download/curl-8_17_0/libcurl_artifact.zip"
  CURL_VERSION: "8.17.0"

  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"


jobs:
  build-ios:
    name: Build ldid - iOS arm64
    runs-on: macos-14

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Extract ldid source
      # ------------------------------------------------------------

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q ldid.zip -d source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "Source:"
          find source -maxdepth 2 -type f | sort


      # ------------------------------------------------------------
      # Host tools
      # ------------------------------------------------------------

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          brew install xz


      # ------------------------------------------------------------
      # iPhoneOS SDK
      # ------------------------------------------------------------

      - name: Download iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/sdk
          mkdir -p third_party/sdk

          curl \
            -L \
            --fail \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/iPhoneOS16.5.sdk.tar.xz \
            "${IOS_SDK_URL}"

          tar \
            -xJf \
            third_party/iPhoneOS16.5.sdk.tar.xz \
            -C third_party/sdk

          SDKROOT="$(
            find third_party/sdk \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          if [ -z "${SDKROOT}" ]; then
            echo "ERROR: iPhoneOS16.5.sdk was not found"
            exit 1
          fi

          echo "SDKROOT=${SDKROOT}" >> "${GITHUB_ENV}"

          echo "SDKROOT=${SDKROOT}"


      # ------------------------------------------------------------
      # Locate bundled OpenSSL
      # ------------------------------------------------------------

      - name: Locate bundled OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB_DIR="source/openssl_lib"
          OPENSSL_INCLUDE_DIR="source/openssl_include"

          if [ ! -d "${OPENSSL_LIB_DIR}" ]; then
            OPENSSL_LIB_DIR="$(
              find source \
                -type d \
                -name "openssl_lib" \
                -print \
                -quit
            )"
          fi

          if [ ! -d "${OPENSSL_INCLUDE_DIR}" ]; then
            OPENSSL_INCLUDE_DIR="$(
              find source \
                -type d \
                -name "openssl_include" \
                -print \
                -quit
            )"
          fi

          if [ -z "${OPENSSL_LIB_DIR}" ] ||
             [ ! -d "${OPENSSL_LIB_DIR}" ]; then
            echo "ERROR: openssl_lib not found"
            exit 1
          fi

          if [ -z "${OPENSSL_INCLUDE_DIR}" ] ||
             [ ! -d "${OPENSSL_INCLUDE_DIR}" ]; then
            echo "ERROR: openssl_include not found"
            exit 1
          fi

          test -f "${OPENSSL_LIB_DIR}/libssl.a"
          test -f "${OPENSSL_LIB_DIR}/libcrypto.a"

          echo "OPENSSL_LIB_DIR=${OPENSSL_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}" >> "${GITHUB_ENV}"

          echo "OPENSSL_LIB_DIR=${OPENSSL_LIB_DIR}"
          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}"


      # ------------------------------------------------------------
      # Locate bundled libplist
      # ------------------------------------------------------------

      - name: Locate bundled libplist
        shell: bash
        run: |
          set -euo pipefail

          PLIST_LIB_DIR="source/libplist_lib"
          PLIST_INCLUDE_DIR="source/libplist_include"

          if [ ! -d "${PLIST_LIB_DIR}" ]; then
            PLIST_LIB_DIR="$(
              find source \
                -type d \
                -name "libplist_lib" \
                -print \
                -quit
            )"
          fi

          if [ ! -d "${PLIST_INCLUDE_DIR}" ]; then
            PLIST_INCLUDE_DIR="$(
              find source \
                -type d \
                -name "libplist_include" \
                -print \
                -quit
            )"
          fi

          if [ -z "${PLIST_LIB_DIR}" ] ||
             [ ! -d "${PLIST_LIB_DIR}" ]; then
            echo "ERROR: libplist_lib not found"
            exit 1
          fi

          if [ -z "${PLIST_INCLUDE_DIR}" ] ||
             [ ! -d "${PLIST_INCLUDE_DIR}" ]; then
            echo "ERROR: libplist_include not found"
            exit 1
          fi

          test -f "${PLIST_LIB_DIR}/libplist.a"
          test -f "${PLIST_INCLUDE_DIR}/plist/plist.h"

          echo "PLIST_LIB_DIR=${PLIST_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "PLIST_INCLUDE_DIR=${PLIST_INCLUDE_DIR}" >> "${GITHUB_ENV}"

          echo "PLIST_LIB_DIR=${PLIST_LIB_DIR}"
          echo "PLIST_INCLUDE_DIR=${PLIST_INCLUDE_DIR}"


      # ------------------------------------------------------------
      # iOS compatibility patch
      #
      # verify_with_apple_system() uses macOS Security.framework.
      # It must not be compiled as an active implementation on iOS.
      # ------------------------------------------------------------

      - name: Patch macOS-only Security API
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/ldid.cpp")
          text = path.read_text()

          # Add TargetConditionals.h if it is not already included.
          if "#include <TargetConditionals.h>" not in text:
              text = "#include <TargetConditionals.h>\n" + text

          old = """#ifdef __APPLE__
          static bool verify_with_apple_system(const std::string &path) {
          """

          new = """#if defined(__APPLE__) && TARGET_OS_OSX
          static bool verify_with_apple_system(const std::string &path) {
          """

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          grep -n \
            -A3 \
            -B2 \
            "verify_with_apple_system" \
            source/ldid.cpp || true


      # ------------------------------------------------------------
      # Prebuilt libcurl
      #
      # IMPORTANT:
      # Do NOT use gh release download.
      # Do NOT build curl.
      # Do NOT assume the artifact contains headers.
      # ------------------------------------------------------------

      - name: Download prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl
          mkdir -p third_party/curl

          curl \
            -L \
            --fail \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/curl/libcurl_artifact.zip \
            "${CURL_URL}"

          mkdir -p third_party/curl/extracted

          unzip \
            -q \
            third_party/curl/libcurl_artifact.zip \
            -d third_party/curl/extracted

          echo "libcurl artifact contents:"
          find third_party/curl/extracted \
            -maxdepth 6 \
            -type f \
            -print | sort

          CURL_A="$(
            find third_party/curl/extracted \
              -type f \
              -path "*/ios-arm64/libcurl.a" \
              -print \
              -quit
          )"

          if [ -z "${CURL_A}" ]; then
            CURL_A="$(
              find third_party/curl/extracted \
                -type f \
                -name "libcurl.a" \
                -print \
                -quit
            )"
          fi

          if [ -z "${CURL_A}" ]; then
            echo "ERROR: prebuilt libcurl.a not found"
            exit 1
          fi

          test -f "${CURL_A}"

          echo "CURL_A=${CURL_A}" >> "${GITHUB_ENV}"

          echo "CURL_A=${CURL_A}"


      # ------------------------------------------------------------
      # Curl headers only
      #
      # libcurl itself is NOT compiled here.
      # Headers come from the official curl source tarball.
      # ------------------------------------------------------------

      - name: Download curl headers
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl-source
          mkdir -p third_party/curl-source

          curl \
            -L \
            --fail \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/curl-${CURL_VERSION}.tar.xz \
            "https://curl.se/download/curl-${CURL_VERSION}.tar.xz"

          tar \
            -xJf \
            third_party/curl-${CURL_VERSION}.tar.xz \
            -C third_party/curl-source

          CURL_SOURCE="third_party/curl-source/curl-${CURL_VERSION}"

          if [ ! -d "${CURL_SOURCE}/include/curl" ]; then
            echo "ERROR: curl headers not found"
            exit 1
          fi

          test -f "${CURL_SOURCE}/include/curl/curl.h"

          echo "CURL_SOURCE=${CURL_SOURCE}" >> "${GITHUB_ENV}"

          echo "CURL_SOURCE=${CURL_SOURCE}"


      # ------------------------------------------------------------
      # Prebuilt libarchive
      #
      # okferret/libarchive contains a committed prebuilt
      # libArchive.xcframework.
      #
      # No libarchive source compilation.
      # ------------------------------------------------------------

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive

          git clone \
            --depth 1 \
            "${LIBARCHIVE_REPO}" \
            third_party/libarchive

          LIBARCHIVE_XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -path "*/libArchive.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE_XCFRAMEWORK}" ]; then
            echo "ERROR: libArchive.xcframework not found"
            exit 1
          fi

          LIBARCHIVE_A="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type f \
              -path "*/ios-arm64/libarchive.a" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE_A}" ]; then
            echo "ERROR: iOS arm64 libarchive.a not found"
            exit 1
          fi

          LIBARCHIVE_HEADERS="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type d \
              -path "*/ios-arm64/Headers" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE_HEADERS}" ]; then
            echo "ERROR: iOS arm64 libarchive Headers not found"
            exit 1
          fi

          test -f "${LIBARCHIVE_A}"
          test -f "${LIBARCHIVE_HEADERS}/archive.h"

          echo "LIBARCHIVE_XCFRAMEWORK=${LIBARCHIVE_XCFRAMEWORK}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_A=${LIBARCHIVE_A}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${LIBARCHIVE_HEADERS}" >> "${GITHUB_ENV}"

          echo "LIBARCHIVE_XCFRAMEWORK=${LIBARCHIVE_XCFRAMEWORK}"
          echo "LIBARCHIVE_A=${LIBARCHIVE_A}"
          echo "LIBARCHIVE_HEADERS=${LIBARCHIVE_HEADERS}"


      # ------------------------------------------------------------
      # Validate architecture of prebuilt libraries
      # ------------------------------------------------------------

      - name: Validate prebuilt libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "=== libcurl ==="
          file "${CURL_A}"
          lipo -info "${CURL_A}" || true

          echo
          echo "=== libarchive ==="
          file "${LIBARCHIVE_A}"
          lipo -info "${LIBARCHIVE_A}" || true

          echo
          echo "=== libplist ==="
          file "${PLIST_LIB_DIR}/libplist.a"
          lipo -info "${PLIST_LIB_DIR}/libplist.a" || true

          echo
          echo "=== libssl ==="
          file "${OPENSSL_LIB_DIR}/libssl.a"
          lipo -info "${OPENSSL_LIB_DIR}/libssl.a" || true

          echo
          echo "=== libcrypto ==="
          file "${OPENSSL_LIB_DIR}/libcrypto.a"
          lipo -info "${OPENSSL_LIB_DIR}/libcrypto.a" || true


      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          STRIP="$(xcrun --sdk iphoneos --find strip)"

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          mkdir -p build

          echo "Compiler: ${CLANGXX}"
          "${CLANGXX}" --version

          echo
          echo "Target: ${TARGET}"
          echo "SDKROOT: ${SDKROOT}"
          echo "Deployment target: ${IOS_DEPLOYMENT_TARGET}"

          CXXFLAGS=(
            -std=c++20

            -O3
            -DNDEBUG

            -flto=thin

            -ffunction-sections
            -fdata-sections
            -fvisibility=hidden
            -fstrict-aliasing

            -Wall
            -Wextra
            -Wpedantic
            -Werror
          )

          INCLUDES=(
            "-I${OPENSSL_INCLUDE_DIR}"
            "-I${PLIST_INCLUDE_DIR}"
            "-I${LIBARCHIVE_HEADERS}"
            "-I${CURL_SOURCE}/include"
          )

          echo
          echo "=== Compile ==="

          "${CLANGXX}" \
            -target "${TARGET}" \
            -isysroot "${SDKROOT}" \
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            "${CXXFLAGS[@]}" \
            "${INCLUDES[@]}" \
            -c source/ldid.cpp \
            -o build/ldid.o

          echo
          echo "=== Link ==="

          "${CLANGXX}" \
            -target "${TARGET}" \
            -isysroot "${SDKROOT}" \
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            -std=c++20 \
            -flto=thin \
            -Wl,-dead_strip \
            build/ldid.o \
            "${PLIST_LIB_DIR}/libplist.a" \
            "${LIBARCHIVE_A}" \
            "${CURL_A}" \
            "${OPENSSL_LIB_DIR}/libssl.a" \
            "${OPENSSL_LIB_DIR}/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -liconv \
            -lxml2 \
            -lc++ \
            -lz \
            -lbz2 \
            -o build/ldid

          chmod +x build/ldid

          echo
          echo "=== Built binary ==="
          file build/ldid
          lipo -info build/ldid
          size build/ldid


      # ------------------------------------------------------------
      # Preserve unstripped binary
      # ------------------------------------------------------------

      - name: Preserve unstripped binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid \
            build/ldid.unstripped

          test -f build/ldid.unstripped


      # ------------------------------------------------------------
      # Strip release binary
      # ------------------------------------------------------------

      - name: Strip binary
        shell: bash
        run: |
          set -euo pipefail

          STRIP="$(xcrun --sdk iphoneos --find strip)"

          "${STRIP}" \
            -S \
            build/ldid

          chmod +x build/ldid

          echo "=== Stripped binary ==="
          file build/ldid
          lipo -info build/ldid
          size build/ldid


      # ------------------------------------------------------------
      # Basic binary validation
      # ------------------------------------------------------------

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          test -x build/ldid
          test -x build/ldid.unstripped

          file build/ldid
          file build/ldid.unstripped

          lipo -info build/ldid
          lipo -info build/ldid.unstripped

          echo
          echo "=== Mach-O header ==="
          xcrun --sdk iphoneos \
            otool -hv \
            build/ldid

          echo
          echo "=== Load commands ==="
          xcrun --sdk iphoneos \
            otool -l \
            build/ldid \
            | grep -E \
              "LC_BUILD_VERSION|platform IOS|minos|sdk" \
              || true


      # ------------------------------------------------------------
      # Package source
      # ------------------------------------------------------------

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release/source

          cp \
            source/ldid.cpp \
            source/ldid.hpp \
            release/source/

          tar \
            -czf release/ldid-source.tar.gz \
            -C source \
            ldid.cpp \
            ldid.hpp

          test -f release/ldid-source.tar.gz


      # ------------------------------------------------------------
      # Package release
      # ------------------------------------------------------------

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid \
            release/ldid-ios-arm64

          cp \
            build/ldid.unstripped \
            release/ldid-ios-arm64.unstripped

          shasum -a 256 \
            release/ldid-ios-arm64 \
            release/ldid-ios-arm64.unstripped \
            release/ldid-source.tar.gz \
            > release/SHA256SUMS

          echo
          echo "=== Release files ==="
          ls -lh release

          echo
          echo "=== SHA256 ==="
          cat release/SHA256SUMS


      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64
            release/ldid-ios-arm64.unstripped
            release/ldid-source.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
