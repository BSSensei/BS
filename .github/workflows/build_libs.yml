name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  # Prebuilt libcurl XCFramework release.
  CURL_REPOSITORY: "XDcobra/libcurl-ios-prebuilt-and-buildscripts"
  CURL_RELEASE: "curl-8_17_0"

  # Prebuilt libarchive repository.
  LIBARCHIVE_REPOSITORY: "okferret/libarchive"

jobs:
  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # Extract ldid.zip
      # ============================================================

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== SOURCE TREE ====="

          find source \
            -maxdepth 2 \
            -print


      # ============================================================
      # Download exact iPhoneOS 16.5 SDK
      # ============================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== IOS SDK ====="
          echo "${IOS_SDK_DIR}"


      # ============================================================
      # Configure Apple compiler
      # ============================================================

      - name: Configure iOS compiler
        shell: bash
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== clang ====="
          "${IOS_CLANG}" --version

          echo "===== clang++ ====="
          "${IOS_CLANGXX}" --version


      # ============================================================
      # Validate bundled OpenSSL / libplist
      # ============================================================

      - name: Locate bundled libraries
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"
          OPENSSL_INC="${GITHUB_WORKSPACE}/source/openssl_include"

          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"
          PLIST_INC="${GITHUB_WORKSPACE}/source/libplist_include"

          test -d "${OPENSSL_LIB}"
          test -d "${OPENSSL_INC}"
          test -d "${PLIST_LIB}"
          test -d "${PLIST_INC}"

          CRYPTO="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libcrypto*.a' \
              -print \
              -quit
          )"

          SSL="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libssl*.a' \
              -print \
              -quit
          )"

          PLIST="$(
            find "${PLIST_LIB}" \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${CRYPTO}"
          test -n "${SSL}"
          test -n "${PLIST}"

          test -f "${CRYPTO}"
          test -f "${SSL}"
          test -f "${PLIST}"

          echo "CRYPTO=${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${SSL}" >> "${GITHUB_ENV}"
          echo "PLIST=${PLIST}" >> "${GITHUB_ENV}"

          echo "===== libcrypto ====="
          file "${CRYPTO}"

          echo "===== libssl ====="
          file "${SSL}"

          echo "===== libplist ====="
          file "${PLIST}"


      # ============================================================
      # Download PREBUILT libarchive
      #
      # Repository contains:
      #
      # libarchive-apple-build/
      #   libArchive.xcframework/
      #     ios-arm64/
      #       libarchive.a
      #
      # No libarchive compilation.
      # ============================================================

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive

          git clone \
            --depth 1 \
            "https://github.com/${LIBARCHIVE_REPOSITORY}.git" \
            third_party/libarchive

          test -d third_party/libarchive

          echo "===== LIBARCHIVE TREE ====="

          find third_party/libarchive \
            -maxdepth 5 \
            -print


      # ============================================================
      # Locate libarchive XCFramework
      # ============================================================

      - name: Select libarchive iOS arm64
        shell: bash
        run: |
          set -euo pipefail

          LIBARCHIVE_XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name 'libArchive.xcframework' \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE_XCFRAMEWORK}" ]; then
            LIBARCHIVE_XCFRAMEWORK="$(
              find third_party/libarchive \
                -type d \
                -name '*.xcframework' \
                -print \
                -quit
            )"
          fi

          test -n "${LIBARCHIVE_XCFRAMEWORK}"
          test -d "${LIBARCHIVE_XCFRAMEWORK}"

          LIBARCHIVE_SLICE="${LIBARCHIVE_XCFRAMEWORK}/ios-arm64"

          test -d "${LIBARCHIVE_SLICE}"

          LIBARCHIVE="$(
            find "${LIBARCHIVE_SLICE}" \
              -maxdepth 2 \
              -type f \
              -name 'libarchive.a' \
              -print \
              -quit
          )"

          test -n "${LIBARCHIVE}"
          test -f "${LIBARCHIVE}"

          LIBARCHIVE_HEADERS="$(
            find "${LIBARCHIVE_SLICE}" \
              -type d \
              -name 'Headers' \
              -print \
              -quit
          )"

          test -n "${LIBARCHIVE_HEADERS}"
          test -d "${LIBARCHIVE_HEADERS}"

          echo "LIBARCHIVE=${GITHUB_WORKSPACE}/${LIBARCHIVE}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${GITHUB_WORKSPACE}/${LIBARCHIVE_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== LIBARCHIVE ====="
          echo "${LIBARCHIVE}"

          echo "===== LIBARCHIVE HEADERS ====="
          echo "${LIBARCHIVE_HEADERS}"


      # ============================================================
      # Validate libarchive
      # ============================================================

      - name: Validate libarchive
        shell: bash
        run: |
          set -euo pipefail

          test -f "${LIBARCHIVE}"
          test -d "${LIBARCHIVE_HEADERS}"

          echo "===== file ====="
          file "${LIBARCHIVE}"

          echo "===== lipo ====="
          lipo -info "${LIBARCHIVE}"

          lipo -info "${LIBARCHIVE}" \
            | grep -E 'arm64|Architectures in the fat file'

          echo "===== archive symbols ====="

          nm -gU "${LIBARCHIVE}" \
            | grep -E \
              'archive_read_new|archive_read_open|archive_write_new|archive_write_open' \
            | head -20


      # ============================================================
      # Download PREBUILT libcurl
      #
      # IMPORTANT:
      #
      # We use gh release download instead of guessing the asset
      # filename.
      #
      # Release:
      #   curl-8_17_0
      #
      # Default project configuration:
      #   static
      #   Secure Transport
      #   OpenSSL disabled
      #
      # Therefore it does NOT conflict with the bundled OpenSSL.
      # ============================================================

      - name: Download prebuilt libcurl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf third_party/curl
          mkdir -p third_party/curl/download
          mkdir -p third_party/curl/extracted

          command -v gh >/dev/null 2>&1

          gh --version

          echo "===== CURL RELEASE ====="

          gh release view \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}"

          echo "===== DOWNLOAD RELEASE ASSETS ====="

          gh release download \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}" \
            --dir third_party/curl/download \
            --clobber

          echo "===== DOWNLOADED ASSETS ====="

          find third_party/curl/download \
            -maxdepth 2 \
            -type f \
            -print


      # ============================================================
      # Extract curl release assets
      # ============================================================

      - name: Extract libcurl XCFramework
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          ZIP_FOUND=0

          for archive in \
            third_party/curl/download/*.zip \
            third_party/curl/download/*.ZIP
          do
            [ -f "${archive}" ] || continue

            ZIP_FOUND=1

            echo "Extracting:"
            echo "${archive}"

            unzip \
              -q \
              -o \
              "${archive}" \
              -d third_party/curl/extracted
          done

          if [ "${ZIP_FOUND}" -eq 0 ]; then
            echo "ERROR: curl release contains no ZIP asset."
            echo
            echo "Downloaded assets:"
            find third_party/curl/download \
              -maxdepth 2 \
              -type f \
              -print
            exit 1
          fi

          echo "===== EXTRACTED CURL ====="

          find third_party/curl/extracted \
            -maxdepth 6 \
            -print


      # ============================================================
      # Locate libcurl XCFramework
      # ============================================================

      - name: Select libcurl iOS arm64
        shell: bash
        run: |
          set -euo pipefail

          CURL_XCFRAMEWORK="$(
            find third_party/curl/extracted \
              -type d \
              -name 'libcurl.xcframework' \
              -print \
              -quit
          )"

          if [ -z "${CURL_XCFRAMEWORK}" ]; then
            CURL_XCFRAMEWORK="$(
              find third_party/curl/extracted \
                -type d \
                -name '*.xcframework' \
                -print \
                -quit
            )"
          fi

          test -n "${CURL_XCFRAMEWORK}"
          test -d "${CURL_XCFRAMEWORK}"

          echo "CURL_XCFRAMEWORK=${CURL_XCFRAMEWORK}"

          CURL_SLICE="${CURL_XCFRAMEWORK}/ios-arm64"

          if [ ! -d "${CURL_SLICE}" ]; then
            echo "ERROR: no ios-arm64 slice."
            echo
            echo "Available slices:"
            find "${CURL_XCFRAMEWORK}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print
            exit 1
          fi

          CURL="$(
            find "${CURL_SLICE}" \
              -maxdepth 3 \
              -type f \
              -name 'libcurl*.a' \
              -print \
              -quit
          )"

          test -n "${CURL}"
          test -f "${CURL}"

          CURL_HEADERS="$(
            find "${CURL_SLICE}" \
              -type d \
              -name 'Headers' \
              -print \
              -quit
          )"

          test -n "${CURL_HEADERS}"
          test -d "${CURL_HEADERS}"

          echo "CURL=${GITHUB_WORKSPACE}/${CURL}" >> "${GITHUB_ENV}"
          echo "CURL_HEADERS=${GITHUB_WORKSPACE}/${CURL_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== CURL ====="
          echo "${CURL}"

          echo "===== CURL HEADERS ====="
          echo "${CURL_HEADERS}"


      # ============================================================
      # Validate libcurl
      #
      # Also reject an OpenSSL-based libcurl.
      # ============================================================

      - name: Validate libcurl
        shell: bash
        run: |
          set -euo pipefail

          test -f "${CURL}"
          test -d "${CURL_HEADERS}"

          echo "===== file ====="

          file "${CURL}"

          echo "===== architecture ====="

          lipo -info "${CURL}"

          lipo -info "${CURL}" \
            | grep -E 'arm64|Architectures in the fat file'

          echo "===== curl symbols ====="

          nm -gU "${CURL}" \
            | grep -E \
              'curl_easy_init|curl_easy_cleanup|curl_easy_perform' \
            | head -20

          echo "===== check TLS backend ====="

          if nm -gU "${CURL}" 2>/dev/null \
              | grep -E \
                '(_SSL_|_OPENSSL_|_X509_|_EVP_|_TLS_)' \
              | head -20
          then
            echo
            echo "ERROR: selected libcurl references OpenSSL."
            echo "This workflow requires the Secure Transport build."
            exit 1
          fi

          echo "Secure Transport-compatible libcurl selected."


      # ============================================================
      # Build ldid
      # ============================================================

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ldid
          mkdir -p build/ldid

          IOS_TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${IOS_TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${CURL_HEADERS}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lc++ \
            -lz \
            -lbz2 \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid/ldid

          test -s build/ldid/ldid


      # ============================================================
      # Validate final Mach-O
      # ============================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILE ====="

          file build/ldid/ldid

          echo "===== ARCHITECTURE ====="

          lipo -info build/ldid/ldid

          echo "===== MACH-O HEADER ====="

          otool -hv build/ldid/ldid

          echo "===== LOAD COMMANDS ====="

          otool -l build/ldid/ldid \
            > build/ldid/load-commands.txt

          grep -A6 \
            LC_BUILD_VERSION \
            build/ldid/load-commands.txt

          echo "===== LINKED LIBRARIES ====="

          otool -L build/ldid/ldid

          echo "===== SYMBOL CHECK ====="

          nm -gU build/ldid/ldid \
            | grep -E \
              'main|openssl|curl_easy|archive_' \
            | head -50 \
            || true


      # ============================================================
      # Strip
      # ============================================================

      - name: Strip final binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid/ldid \
            build/ldid/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid/ldid

          test -s build/ldid/ldid

          echo "===== STRIPPED BINARY ====="

          file build/ldid/ldid

          lipo -info build/ldid/ldid


      # ============================================================
      # Package
      # ============================================================

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp \
            build/ldid/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== ARTIFACT ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256

          cat \
            ldid-ios-arm64.tar.gz.sha256


      # ============================================================
      # Upload ONLY final iOS artifact
      # ============================================================

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
