name: Build Full TrollStore Rust v3.0 (Localized)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Extract and Auto-Fix Project Structure
        run: |
          mkdir -p extracted
          unzip -o TrollStore.zip -d extracted
          CARGO_FILE=$(find extracted -name "Cargo.toml" -maxdepth 3 | head -n 1)
          PROJECT_DIR=$(dirname "$CARGO_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          if [ ! -d "src" ]; then
            mkdir -p src/core
            for file in main.rs ui.rs error.rs; do [ -f "$file" ] && mv "$file" src/; done
            for file in mod.rs ipa.rs cert.rs dylib.rs fs.rs plist.rs; do [ -f "$file" ] && mv "$file" src/core/; done
          fi
          mkdir -p resources
          for bin in ldid RootHelper TrollHelper fastPathSign; do [ -f "$bin" ] && mv "$bin" resources/; done
          if [ -d "Resources" ]; then 
            mv Resources resources/
          elif [ -f "Resources.zip" ]; then 
            mv Resources.zip resources/ && cd resources && unzip -o Resources.zip && rm Resources.zip && cd ..
          fi

      - name: Setup iOS Environment Variables
        run: |
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "IPHONEOS_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV

      - name: Build for iOS (arm64)
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo build --release --target aarch64-apple-ios

      - name: Package Full IPA v3.0 with Tools and Localization
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # 1. 生成汉化包 (修复 Python 警告，使用标准 open)
          python3 << 'PYTHON_SCRIPT'
          import os
          def write_strings(filepath, content_dict):
              with open(filepath, 'w', encoding='utf-16') as f:
                  for k, v in content_dict.items():
                      f.write(f'"{k}" = "{v}";\n')
          os.makedirs('zh-Hans.lproj', exist_ok=True)
          write_strings('zh-Hans.lproj/Localizable.strings', {
              'Apps': '应用', 'Certs': '证书', 'Dylibs': '动态库', 
              'Files': '文件', 'Settings': '设置', 'Signed': '已签名', 
              'Unsigned': '未签名', 'Installing...': 'Installing...'
          })
          PYTHON_SCRIPT
          
          # 2. 创建 .app 容器并复制主程序
          mkdir -p Payload/TrollStore.app
          cp target/aarch64-apple-ios/release/trollstore-rs Payload/TrollStore.app/TrollStore
          
          # 3. 【核心修复】无死角复制所有 UI 资源 (排除源码和 entitlements)
          # 这会确保所有的 AppIcon 和 Info.plist 被强制放入 .app 根目录
          find resources -type f \
            ! -name "*.rs" \
            ! -name "Cargo.toml" \
            ! -name "Cargo.lock" \
            ! -name "entitlements.plist" \
            -exec cp {} Payload/TrollStore.app/ \;
            
          # 4. 复制汉化包
          cp -R zh-Hans.lproj Payload/TrollStore.app/
          
          # 5. 【关键】恢复核心工具链 (这是体积从 300KB 涨到 10MB+ 的原因)
          # TrollStore 真机安装后，需要这些工具来执行伪签名和安装其他 IPA
          mkdir -p Payload/TrollStore.app/Binaries
          for bin in ldid RootHelper TrollHelper fastPathSign; do
            if [ -f "resources/$bin" ]; then
              cp "resources/$bin" Payload/TrollStore.app/Binaries/
            fi
          done
          
          # 6. 强制修改版本号为 3.0 并确保名字为 TrollStore
          if [ -f "Payload/TrollStore.app/Info.plist" ]; then
            plutil -replace CFBundleShortVersionString -string "3.0" Payload/TrollStore.app/Info.plist
            plutil -replace CFBundleVersion -string "3.0" Payload/TrollStore.app/Info.plist
            plutil -replace CFBundleName -string "TrollStore" Payload/TrollStore.app/Info.plist
            plutil -replace CFBundleDisplayName -string "TrollStore" Payload/TrollStore.app/Info.plist
          else
            echo "Fatal Error: Info.plist missing after exhaustive search."
            exit 1
          fi
          
          # 7. 赋予执行权限并打包
          chmod +x Payload/TrollStore.app/TrollStore
          chmod +x Payload/TrollStore.app/Binaries/* 2>/dev/null || true
          zip -r TrollStore-Rust-v3.0-Full.ipa Payload

      - name: Upload Full IPA v3.0 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-Rust-v3.0-Full-IPA
          path: ${{ env.PROJECT_DIR }}/TrollStore-Rust-v3.0-Full.ipa
