name: Build TrollStore Rust for iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Cargo config for iOS cross-compilation
        run: |
          mkdir -p .cargo
          cat << 'EOF' > .cargo/config.toml
          [target.aarch64-apple-ios]
          linker = "cc"
          rustflags = ["-C", "link-args=-arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=14.0"]
          EOF

      - name: Extract resources from TrollStore.zip
        run: |
          mkdir -p resources
          if [ -f "TrollStore.zip" ]; then
            unzip -o TrollStore.zip -d resources/
            chmod +x resources/ldid resources/RootHelper resources/TrollHelper resources/fastPathSign 2>/dev/null || true
          else
            echo "Error: TrollStore.zip not found in repository root."
            exit 1
          fi

      - name: Build for iOS (arm64)
        run: cargo build --release --target aarch64-apple-ios

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: trollstore-rs-ios-binary
          path: target/aarch64-apple-ios/release/trollstore-rs
