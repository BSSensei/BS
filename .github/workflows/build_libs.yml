name: Build ldid

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build ldid (iOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ldid.zip
        run: |
          if [ -f "ldid.zip" ]; then
            unzip -q ldid.zip
            if [ -d "ldid" ] && [ -f "ldid/Makefile" ]; then
              mv ldid/* . 2>/dev/null || true
              rm -rf ldid
            fi
            rm -f ldid.zip
          fi
          ls -la

      - name: Fix libplist directory name
        run: |
          if [ -d "libpist_lib" ] && [ ! -d "libplist_lib" ]; then
            mv libpist_lib libplist_lib
          fi

      - name: Prepare main.swift
        run: |
          echo "=== Before ==="
          ls -la *.swift || true

          rm -f main.swift

          if [ ! -f "ldid.swift" ]; then
            echo "ERROR: ldid.swift not found after checkout/extract"
            ls -la
            exit 1
          fi

          mv ldid.swift main.swift

          cat > fix_main.py <<'PYEOF'
          from pathlib import Path
          import re

          p = Path("main.swift")
          src = p.read_text()

          pattern = re.compile(
              r'\nif\s+CommandLine\.arguments\.count\s*>\s*1\s*&&\s*\(.*?\)\s*\{\s*'
              r'exit\(ldid_cs_main\(\)\)\s*\}\s*$',
              re.DOTALL
          )
          new_src, n = pattern.subn("\n", src)
          if n == 0:
              print("WARN: top-level ldid_cs_main block not found, skip removal")
          else:
              print("Removed %d top-level ldid_cs_main block(s)" % n)

          anchor = "func main() {\n"
          if anchor not in new_src:
              raise SystemExit("ERROR: 'func main() {' not found in main.swift")

          inject = """func main() {
              let __cs_args = CommandLine.arguments
              if __cs_args.contains("--verify")
                  || __cs_args.contains("--display")
                  || __cs_args.contains("--display-certificates")
                  || __cs_args.contains("--display-resource-rules")
                  || __cs_args.contains("--display-requirements")
                  || __cs_args.contains("--extract-certificates")
                  || __cs_args.contains("--extract-signature")
                  || __cs_args.contains("--detached")
                  || __cs_args.contains("--embed-signature")
                  || __cs_args.contains("--unsign")
                  || __cs_args.contains("--super-deep")
                  || __cs_args.contains("--deep")
                  || __cs_args.contains("--keychain")
              {
                  exit(ldid_cs_main())
              }
          """

          new_src = new_src.replace(anchor, inject, 1)
          p.write_text(new_src)
          print("Injected ldid_cs_main routing into main()")
          PYEOF

          python3 fix_main.py
          rm -f fix_main.py

          echo "=== After ==="
          ls -la *.swift
          echo "=== main.swift head ==="
          head -20 main.swift
          echo "=== main.swift tail ==="
          tail -20 main.swift

          if grep -q "UIApplicationMain" main.swift; then
            echo "ERROR: main.swift still contains UIApplicationMain (GUI entry)"
            exit 1
          fi

      - name: Generate Makefile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = r'''SDK ?= ./sdks/iPhoneOS16.5.sdk
          TARGET = arm64-apple-ios16.5
          SWIFT_OPT = -O -whole-module-optimization
          CLANG_OPT = -O3
          PWD := $(shell pwd)

          all: ldid

          ldid-Bridging-Header.h:
          \t@echo '#include "ldidbridge.h"' > ldid-Bridging-Header.h

          deps:
          \t@if [ ! -d "$(SDK)" ]; then \
          \t\techo "=== Downloading iPhoneOS16.5 SDK ==="; \
          \t\tmkdir -p sdks && \
          \t\tcurl -sL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C sdks; \
          \tfi

          codesign.o: codesign.m ldidbridge.h deps
          \tclang -c codesign.m -o codesign.o -isysroot $(SDK) -target $(TARGET) $(CLANG_OPT) -fobjc-arc -I. -I./openssl_include -I./libplist_include

          ldid: main.swift codesign.swift codesign.o ldid-Bridging-Header.h deps
          \tswiftc $(SWIFT_OPT) -target $(TARGET) -sdk $(SDK) -import-objc-header ldid-Bridging-Header.h main.swift codesign.swift codesign.o -o ldid -L./openssl_lib -L./libplist_lib -I./openssl_include -I./libplist_include -lcrypto -lssl -lplist-2.0 -framework Foundation -framework Security

          clean:
          \t@rm -f ldid codesign.o ldid-Bridging-Header.h

          .PHONY: all clean deps
          '''
          Path("Makefile").write_text(makefile.replace("\\t", "\t"))
          PY

      - name: Download iOS SDK
        run: make deps

      - name: Build ldid
        run: make ldid

      - name: Inspect binary (size & symbols)
        run: |
          echo "=== file ==="
          file ldid
          echo "=== lipo ==="
          lipo -info ldid || true
          echo "=== size ==="
          size ldid || true
          echo "=== ls ==="
          ls -la ldid
          echo "=== symbols: codesign.swift entries ==="
          nm -gU ldid 2>/dev/null | grep -iE "ldid_cs_main|CSVerifier|CSSuperDeepSigner|CSAdhocSigner|CSExtractor|CSDisplayer" || echo "NOT FOUND: codesign.swift symbols missing!"
          echo "=== symbols: main.swift entries ==="
          nm -gU ldid 2>/dev/null | grep -iE "printCDHash|printEntitlements|main" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: ldid
