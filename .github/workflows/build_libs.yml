name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_SDK_VERSION: "16.5"
  IOS_DEPLOYMENT_TARGET: "16.0"
  THEOS_REPO: "https://github.com/theos/theos.git"
  THEOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
  OPENSSL_URL: "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip"
  CURL_URL: "https://github.com/XDcobra/libcurl-ios-prebuilt-and-buildscripts/releases/download/curl-8_17_0/libcurl_artifact.zip"
  CURL_SOURCE_URL: "https://curl.se/download/curl-8.17.0.tar.xz"
  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"

jobs:
  build-ios-arm64:
    name: iOS arm64 / Theos / iOS 16.5
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          clang --version
          make --version | head -n 1
          sysctl -n hw.logicalcpu_max

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q ldid.zip -d source
          test -f source/ldid.cpp
          test -f source/ldid.hpp
          test -d source/libplist_include
          test -d source/libplist_lib
          find source -maxdepth 3 -type f -print | sort

      - name: Setup Theos
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="${GITHUB_WORKSPACE}/theos"
          rm -rf "${THEOS}"
          git clone --depth 1 "${THEOS_REPO}" "${THEOS}"
          test -f "${THEOS}/makefiles/common.mk"
          if [ -x "${THEOS}/bin/update-theos" ]; then
            "${THEOS}/bin/update-theos"
          else
            git -C "${THEOS}" submodule update --init --recursive || true
          fi
          mkdir -p "${THEOS}/vendor"
          echo "THEOS=${THEOS}" >> "${GITHUB_ENV}"
          git -C "${THEOS}" rev-parse HEAD

      - name: Install iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${THEOS}/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"
          rm -rf "${SDK_DIR}"
          mkdir -p "${THEOS}/sdks"
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "${THEOS_SDK_URL}" -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "${THEOS}/sdks"
          test -d "${SDK_DIR}"
          test -f "${SDK_DIR}/SDKSettings.plist"

      # ============================================================
      # OpenSSL：只下载 + 检查，不 prepare
      # ============================================================
      - name: Download prebuilt OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/openssl
          mkdir -p third_party/openssl
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "${OPENSSL_URL}" -o /tmp/OpenSSL.xcframework.zip
          unzip -q -o /tmp/OpenSSL.xcframework.zip -d third_party/openssl

          OPENSSL_FRAMEWORK="${GITHUB_WORKSPACE}/third_party/openssl/OpenSSL.xcframework/ios-arm64/OpenSSL.framework"

          if [ ! -d "${OPENSSL_FRAMEWORK}" ]; then
            echo "ERROR: OpenSSL framework layout unexpected"
            find third_party/openssl -maxdepth 4 -type d -print
            exit 1
          fi
          if [ ! -f "${OPENSSL_FRAMEWORK}/OpenSSL" ]; then
            echo "ERROR: OpenSSL binary missing"
            ls -la "${OPENSSL_FRAMEWORK}"
            exit 1
          fi
          if [ ! -d "${OPENSSL_FRAMEWORK}/Headers" ]; then
            echo "ERROR: OpenSSL Headers missing"
            ls -la "${OPENSSL_FRAMEWORK}"
            exit 1
          fi

          file "${OPENSSL_FRAMEWORK}/OpenSSL"
          lipo -info "${OPENSSL_FRAMEWORK}/OpenSSL"
          echo "OpenSSL framework: ${OPENSSL_FRAMEWORK}"

      - name: Download prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/curl
          mkdir -p third_party/curl
          HTTP_CODE="$(curl -sSL -w '%{http_code}' -o /tmp/libcurl_artifact.zip "${CURL_URL}" || echo '000')"
          echo "HTTP code: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: libcurl download failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
          unzip -q -o /tmp/libcurl_artifact.zip -d third_party/curl
          find third_party/curl -maxdepth 8 -type f -print | sort

      - name: Download curl headers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/curl-source
          mkdir -p /tmp/curl-source
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "${CURL_SOURCE_URL}" -o /tmp/curl-8.17.0.tar.xz
          tar -xJf /tmp/curl-8.17.0.tar.xz -C /tmp/curl-source
          CURL_SOURCE_DIR="/tmp/curl-source/curl-8.17.0"
          test -f "${CURL_SOURCE_DIR}/include/curl/curl.h"
          rm -rf third_party/curl-ios
          mkdir -p third_party/curl-ios/include
          cp -R "${CURL_SOURCE_DIR}/include/curl" third_party/curl-ios/include/
          test -f third_party/curl-ios/include/curl/curl.h

      - name: Prepare libcurl arm64
        shell: bash
        run: |
          set -euo pipefail
          CURL_ROOT="${GITHUB_WORKSPACE}/third_party/curl"
          mkdir -p third_party/curl-ios/lib
          CURL_LIB="$(find "${CURL_ROOT}" -type f -path '*/ios-arm64/*' -name 'libcurl.a' -print | head -n 1)"
          if [ -z "${CURL_LIB}" ]; then
            CURL_LIB="$(find "${CURL_ROOT}" -type f -name 'libcurl.a' -print | head -n 1)"
          fi
          if [ -z "${CURL_LIB}" ]; then
            echo "ERROR: libcurl.a not found"
            find "${CURL_ROOT}" -maxdepth 8 -type f -print
            exit 1
          fi
          cp "${CURL_LIB}" third_party/curl-ios/lib/libcurl.a
          file third_party/curl-ios/lib/libcurl.a
          lipo -info third_party/curl-ios/lib/libcurl.a

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/libarchive
          git clone --depth 1 "${LIBARCHIVE_REPO}" third_party/libarchive
          ARCHIVE_XCFRAMEWORK="$(find "${GITHUB_WORKSPACE}/third_party/libarchive" \
            -type d -iname 'libarchive*.xcframework' -print -quit)"
          if [ -z "${ARCHIVE_XCFRAMEWORK}" ]; then
            echo "ERROR: libarchive xcframework not found"
            find "${GITHUB_WORKSPACE}/third_party/libarchive" -maxdepth 6 -type d -print
            exit 1
          fi
          ARCHIVE_ROOT="$(find "${ARCHIVE_XCFRAMEWORK}" -type d -name 'ios-arm64' -print -quit)"
          if [ -z "${ARCHIVE_ROOT}" ]; then
            echo "ERROR: ios-arm64 slice not found"
            find "${ARCHIVE_XCFRAMEWORK}" -maxdepth 3 -type d -print
            exit 1
          fi
          test -f "${ARCHIVE_ROOT}/libarchive.a"
          test -d "${ARCHIVE_ROOT}/Headers"
          rm -rf third_party/libarchive-ios
          mkdir -p third_party/libarchive-ios/lib third_party/libarchive-ios/include
          cp "${ARCHIVE_ROOT}/libarchive.a" third_party/libarchive-ios/lib/libarchive.a
          cp -R "${ARCHIVE_ROOT}/Headers/." third_party/libarchive-ios/include/
          file third_party/libarchive-ios/lib/libarchive.a
          lipo -info third_party/libarchive-ios/lib/libarchive.a

      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_FRAMEWORK="${GITHUB_WORKSPACE}/third_party/openssl/OpenSSL.xcframework/ios-arm64/OpenSSL.framework"
          file "${OPENSSL_FRAMEWORK}/OpenSSL"
          lipo -info "${OPENSSL_FRAMEWORK}/OpenSSL"
          file third_party/curl-ios/lib/libcurl.a
          lipo -info third_party/curl-ios/lib/libcurl.a
          file third_party/libarchive-ios/lib/libarchive.a
          lipo -info third_party/libarchive-ios/lib/libarchive.a
          find source/libplist_lib -maxdepth 2 -type f -print | sort
          test -n "$(find source/libplist_lib -type f -name 'libplist*.a' -print -quit)"

      - name: Verify curl OpenSSL references
        shell: bash
        run: |
          set -euo pipefail
          CURL_LIB="third_party/curl-ios/lib/libcurl.a"
          OPENSSL_LIB="${GITHUB_WORKSPACE}/third_party/openssl/OpenSSL.xcframework/ios-arm64/OpenSSL.framework/OpenSSL"
          test -f "${CURL_LIB}"
          test -f "${OPENSSL_LIB}"
          nm "${OPENSSL_LIB}" 2>/dev/null | grep -E \
            'SSL_CTX_set_srp_password|SSL_CTX_set_srp_username|UI_OpenSSL' \
            | sort -u || true
          nm -u "${CURL_LIB}" 2>/dev/null | grep -E \
            'SSL_CTX_set_srp_password|SSL_CTX_set_srp_username|UI_OpenSSL' \
            | sort -u || true

      - name: Prepare Theos project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf theos-build
          mkdir -p theos-build
          cp source/ldid.cpp           theos-build/ldid.cpp
          cp source/ldid.hpp           theos-build/ldid.hpp
          cp -R source/libplist_include theos-build/libplist_include
          cp -R source/libplist_lib     theos-build/libplist_lib

          cat > theos-build/Makefile <<'EOF'
          THEOS ?= $(CURDIR)/../theos
          TARGET := iphone:clang:16.5:16.0
          ARCHS := arm64
          TOOL_NAME := ldid
          ldid_FILES := ldid.cpp

          OPENSSL_FRAMEWORK_DIR := $(CURDIR)/../third_party/openssl/OpenSSL.xcframework/ios-arm64

          ldid_CXXFLAGS := -std=c++20 -O3 -DNDEBUG -flto=thin \
              -ffunction-sections -fdata-sections -fvisibility=hidden \
              -fstrict-aliasing -Wall -Wextra

          ldid_CPPFLAGS := -I$(CURDIR)/libplist_include \
              -I$(OPENSSL_FRAMEWORK_DIR)/OpenSSL.framework/Headers \
              -I$(CURDIR)/../third_party/curl-ios/include \
              -I$(CURDIR)/../third_party/libarchive-ios/include

          ldid_LDFLAGS := -L$(CURDIR)/../third_party/curl-ios/lib \
              -L$(CURDIR)/../third_party/libarchive-ios/lib \
              -L$(CURDIR)/libplist_lib \
              -F$(OPENSSL_FRAMEWORK_DIR) \
              -Wl,-dead_strip -Wl,-no_warn_duplicate_libraries

          ldid_LDLIBS := -lcurl -larchive -lplist \
              -framework OpenSSL -framework Security \
              -framework CoreFoundation -framework SystemConfiguration \
              -framework CFNetwork -framework Foundation \
              -liconv -lxml2 -lz -llzma -lbz2 -lc++

          include $(THEOS)/makefiles/common.mk
          include $(THEOS_MAKE_PATH)/tool.mk
          EOF

          cat theos-build/Makefile

      - name: Build with Theos
        shell: bash
        run: |
          set -euo pipefail
          cd theos-build
          make \
            THEOS="${THEOS}" \
            TARGET="iphone:clang:16.5:16.0" \
            ARCHS="arm64" \
            -j"$(sysctl -n hw.logicalcpu_max)"
          test -f obj/ldid
          mkdir -p "${GITHUB_WORKSPACE}/build"
          cp obj/ldid "${GITHUB_WORKSPACE}/build/ldid"
          chmod 755 "${GITHUB_WORKSPACE}/build/ldid"

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail
          BINARY="${GITHUB_WORKSPACE}/build/ldid"
          test -x "${BINARY}"
          file "${BINARY}"
          lipo -info "${BINARY}"
          xcrun otool -hv "${BINARY}"
          xcrun otool -l "${BINARY}" | grep -E 'LC_BUILD_VERSION|platform|minos|sdk' || true
          xcrun nm -u "${BINARY}" || true

      - name: Check final OpenSSL linkage
        shell: bash
        run: |
          set -euo pipefail
          BINARY="${GITHUB_WORKSPACE}/build/ldid"
          xcrun nm "${BINARY}" 2>/dev/null | grep -E '(_SSL_|_EVP_|_PKCS7_|_X509_|_BIO_)' | head -n 80 || true
          xcrun otool -L "${BINARY}"
          if xcrun otool -L "${BINARY}" | grep -qi "OpenSSL.framework"; then
            echo "ERROR: dynamic OpenSSL dependency present"
            exit 1
          fi
          echo "OK: no OpenSSL.framework dynamic dependency."

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp build/ldid dist/ldid
          chmod 755 dist/ldid
          cd dist
          zip -9 -q ldid-ios-arm64.zip ldid
          file ldid
          lipo -info ldid
          shasum -a 256 ldid
          shasum -a 256 ldid-ios-arm64.zip
          ls -lh ldid ldid-ios-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            dist/ldid
            dist/ldid-ios-arm64.zip
          if-no-files-found: error
          retention-days: 14
