name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "16.0"
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"

  CURL_REPO: "https://github.com/XDcobra/libcurl-ios-prebuilt-and-buildscripts.git"
  CURL_VERSION: "8.17.0"

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q ldid.zip -d source

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja \
            xz

      - name: Download iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/sdk
          mkdir -p third_party/sdk

          curl \
            --location \
            --fail \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/iPhoneOS16.5.sdk.tar.xz \
            "${IOS_SDK_URL}"

          tar \
            -xJf \
            third_party/iPhoneOS16.5.sdk.tar.xz \
            -C third_party/sdk

          SDKROOT="$(
            find third_party/sdk \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          echo "SDKROOT=${SDKROOT}" >> "${GITHUB_ENV}"

      - name: Locate bundled OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB_DIR="source/openssl_lib"
          OPENSSL_INCLUDE_DIR="source/openssl_include"

          if [ ! -d "${OPENSSL_LIB_DIR}" ]; then
            OPENSSL_LIB_DIR="$(
              find source \
                -type d \
                -name "openssl_lib" \
                -print \
                -quit
            )"
          fi

          if [ ! -d "${OPENSSL_INCLUDE_DIR}" ]; then
            OPENSSL_INCLUDE_DIR="$(
              find source \
                -type d \
                -name "openssl_include" \
                -print \
                -quit
            )"
          fi

          echo "OPENSSL_LIB_DIR=${OPENSSL_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}" >> "${GITHUB_ENV}"

      - name: Locate bundled libplist
        shell: bash
        run: |
          set -euo pipefail

          PLIST_LIB_DIR="source/libplist_lib"
          PLIST_INCLUDE_DIR="source/libplist_include"

          if [ ! -d "${PLIST_LIB_DIR}" ]; then
            PLIST_LIB_DIR="$(
              find source \
                -type d \
                -name "libplist_lib" \
                -print \
                -quit
            )"
          fi

          if [ ! -d "${PLIST_INCLUDE_DIR}" ]; then
            PLIST_INCLUDE_DIR="$(
              find source \
                -type d \
                -name "libplist_include" \
                -print \
                -quit
            )"
          fi

          echo "PLIST_LIB_DIR=${PLIST_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "PLIST_INCLUDE_DIR=${PLIST_INCLUDE_DIR}" >> "${GITHUB_ENV}"

      - name: Patch macOS-only Security API
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/ldid.cpp")
          text = path.read_text()

          if "#include <TargetConditionals.h>" not in text:
              text = "#include <TargetConditionals.h>\n" + text

          old = """#ifdef __APPLE__
          static bool verify_with_apple_system(const std::string &path) {
          """

          new = """#if defined(__APPLE__) && TARGET_OS_OSX
          static bool verify_with_apple_system(const std::string &path) {
          """

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive

          git clone \
            --depth 1 \
            "${LIBARCHIVE_REPO}" \
            third_party/libarchive

          LIBARCHIVE_XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -path "*/libArchive.xcframework" \
              -print \
              -quit
          )"

          LIBARCHIVE_A="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type f \
              -path "*/ios-arm64/libarchive.a" \
              -print \
              -quit
          )"

          LIBARCHIVE_HEADERS="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          echo "LIBARCHIVE_A=${LIBARCHIVE_A}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${LIBARCHIVE_HEADERS}" >> "${GITHUB_ENV}"

      - name: Clone libcurl builder
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libcurl-builder

          git clone \
            --depth 1 \
            "${CURL_REPO}" \
            third_party/libcurl-builder

      - name: Build libcurl for iOS
        shell: bash
        run: |
          set -euo pipefail

          cd third_party/libcurl-builder

          chmod +x scripts/build_xcframework.sh

          export SDKROOT="${SDKROOT}"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

          ./scripts/build_xcframework.sh \
            --disable-shared \
            --enable-static

      - name: Locate built libcurl
        shell: bash
        run: |
          set -euo pipefail

          CURL_XCFRAMEWORK="$(
            find third_party/libcurl-builder \
              -type d \
              -name "libcurl.xcframework" \
              -print \
              -quit
          )"

          CURL_A="$(
            find "${CURL_XCFRAMEWORK}" \
              -type f \
              -path "*/ios-arm64/libcurl.a" \
              -print \
              -quit
          )"

          CURL_HEADERS="$(
            find "${CURL_XCFRAMEWORK}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          if [ -z "${CURL_HEADERS}" ]; then
            CURL_HEADERS="$(
              find third_party/libcurl-builder \
                -type d \
                -path "*/curl/include/curl" \
                -print \
                -quit |
                xargs -I{} dirname {}
            )"
          fi

          echo "CURL_XCFRAMEWORK=${CURL_XCFRAMEWORK}" >> "${GITHUB_ENV}"
          echo "CURL_A=${CURL_A}" >> "${GITHUB_ENV}"
          echo "CURL_HEADERS=${CURL_HEADERS}" >> "${GITHUB_ENV}"

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          mkdir -p build

          "${CLANGXX}" \
            -target "${TARGET}" \
            -isysroot "${SDKROOT}" \
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            "-I${OPENSSL_INCLUDE_DIR}" \
            "-I${PLIST_INCLUDE_DIR}" \
            "-I${LIBARCHIVE_HEADERS}" \
            "-I${CURL_HEADERS}" \
            -c \
            source/ldid.cpp \
            -o build/ldid.o

          "${CLANGXX}" \
            -target "${TARGET}" \
            -isysroot "${SDKROOT}" \
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            -flto=thin \
            -Wl,-dead_strip \
            build/ldid.o \
            "${PLIST_LIB_DIR}/libplist.a" \
            "${LIBARCHIVE_A}" \
            "${CURL_A}" \
            "${OPENSSL_LIB_DIR}/libssl.a" \
            "${OPENSSL_LIB_DIR}/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -liconv \
            -lxml2 \
            -lc++ \
            -lz \
            -lbz2 \
            -o build/ldid

      - name: Preserve unstripped binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid \
            build/ldid.unstripped

      - name: Strip
        shell: bash
        run: |
          set -euo pipefail

          STRIP="$(xcrun --sdk iphoneos --find strip)"

          "${STRIP}" \
            -S \
            build/ldid

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/source

          cp \
            source/ldid.cpp \
            source/ldid.hpp \
            release/source/

          tar \
            -czf \
            release/ldid-source.tar.gz \
            -C source \
            ldid.cpp \
            ldid.hpp

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            build/ldid \
            release/ldid-ios-arm64

          cp \
            build/ldid.unstripped \
            release/ldid-ios-arm64.unstripped

          shasum -a 256 \
            release/ldid-ios-arm64 \
            release/ldid-ios-arm64.unstripped \
            release/ldid-source.tar.gz \
            > release/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64
            release/ldid-ios-arm64.unstripped
            release/ldid-source.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
