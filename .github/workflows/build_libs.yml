name: Build ldid

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build ldid (iOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ldid.zip
        run: |
          if [ -f "ldid.zip" ]; then
            echo "Extracting ldid.zip..."
            unzip -q ldid.zip
            if [ -d "ldid" ] && [ -f "ldid/Makefile" ]; then
              mv ldid/* . 2>/dev/null || true
              rm -rf ldid
            fi
            rm -f ldid.zip
          fi
          ls -la

      - name: Fix libplist directory name
        run: |
          if [ -d "libpist_lib" ] && [ ! -d "libplist_lib" ]; then
            echo "Renaming libpist_lib to libplist_lib..."
            mv libpist_lib libplist_lib
          fi

      - name: Patch Makefile directly
        run: |
          echo "Patching Makefile to include codesign.swift and static libraries..."
          sed -i '' 's|ldid: ldid.swift codesign.o|ldid: ldid.swift codesign.swift codesign.o|' Makefile
          sed -i '' 's|ldid.swift codesign.o -o ldid|ldid.swift codesign.swift codesign.o -o ldid|' Makefile
          sed -i '' 's|-L. -L./libs|-L./openssl_lib -L./libplist_lib|' Makefile
          
          echo "Patched Makefile content:"
          cat Makefile

      - name: Download iOS SDK
        run: make deps

      - name: Build ldid
        run: make ldid

      - name: Verify binary architecture
        run: |
          file ldid
          lipo -info ldid || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: ldid
