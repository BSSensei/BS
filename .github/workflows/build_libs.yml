name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "16.0"
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  OPENSSL_VERSION: "3.6.2"
  OPENSSL_URL: "https://www.openssl.org/source/openssl-3.6.2.tar.xz"

  CURL_VERSION: "8.17.0"
  CURL_URL: "https://curl.se/download/curl-8.17.0.tar.xz"

  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"

  SDKROOT: "third_party/sdk/iPhoneOS16.5.sdk"

jobs:
  build-ios-arm64:
    name: iOS arm64 build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Compiler"
          echo "=================================================="

          xcodebuild -version
          clang --version

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q ldid.zip -d source

          test -f source/ldid.cpp
          test -f source/ldid.hpp
          test -d source/libplist_include
          test -d source/libplist_lib

          echo "=================================================="
          echo "Source"
          echo "=================================================="

          find source -maxdepth 2 -type f -print | sort

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party/sdk

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            "${IOS_SDK_URL}" \
            --output /tmp/iPhoneOS16.5.sdk.tar.xz

          tar \
            -xJf /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C third_party/sdk

          test -d "${SDKROOT}"

          echo "SDKROOT=${SDKROOT}"

      - name: Download OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            "${OPENSSL_URL}" \
            --output /tmp/openssl.tar.xz

          tar \
            -xJf /tmp/openssl.tar.xz \
            -C third_party

          test -d "third_party/openssl-${OPENSSL_VERSION}"

      - name: Build OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_SRC="${GITHUB_WORKSPACE}/third_party/openssl-${OPENSSL_VERSION}"
          OPENSSL_PREFIX="${GITHUB_WORKSPACE}/third_party/openssl-ios"
          SDK="${GITHUB_WORKSPACE}/${SDKROOT}"

          export CROSS_TOP="${DEVELOPER_DIR}/Platforms/iPhoneOS.platform/Developer"
          export CROSS_SDK="iPhoneOS16.5.sdk"

          export CC="$(xcrun --find clang)"
          export CXX="$(xcrun --find clang++)"

          export CFLAGS="-arch arm64 -isysroot ${SDK} -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET} -O3 -DNDEBUG -fvisibility=hidden"
          export LDFLAGS="-arch arm64 -isysroot ${SDK} -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"

          rm -rf "${OPENSSL_PREFIX}"
          mkdir -p "${OPENSSL_PREFIX}"

          cd "${OPENSSL_SRC}"

          echo "=================================================="
          echo "Build OpenSSL ${OPENSSL_VERSION}"
          echo "=================================================="

          ./Configure \
            ios64-cross \
            no-shared \
            no-tests \
            no-apps \
            no-docs \
            no-module \
            no-dso \
            no-engine \
            no-async \
            --prefix="${OPENSSL_PREFIX}" \
            --openssldir="${OPENSSL_PREFIX}/ssl"

          make -j"$(sysctl -n hw.logicalcpu_max)" build_sw
          make install_sw

          test -f "${OPENSSL_PREFIX}/lib/libssl.a"
          test -f "${OPENSSL_PREFIX}/lib/libcrypto.a"
          test -d "${OPENSSL_PREFIX}/include/openssl"

          file \
            "${OPENSSL_PREFIX}/lib/libssl.a" \
            "${OPENSSL_PREFIX}/lib/libcrypto.a"

      - name: Download libcurl
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            "${CURL_URL}" \
            --output /tmp/curl.tar.xz

          tar \
            -xJf /tmp/curl.tar.xz \
            -C third_party

          test -d "third_party/curl-${CURL_VERSION}"

      - name: Build libcurl
        shell: bash
        run: |
          set -euo pipefail

          CURL_SRC="${GITHUB_WORKSPACE}/third_party/curl-${CURL_VERSION}"
          CURL_PREFIX="${GITHUB_WORKSPACE}/third_party/curl-ios"
          OPENSSL_PREFIX="${GITHUB_WORKSPACE}/third_party/openssl-ios"
          SDK="${GITHUB_WORKSPACE}/${SDKROOT}"

          export CC="$(xcrun --find clang)"
          export CXX="$(xcrun --find clang++)"

          export CPPFLAGS="-I${OPENSSL_PREFIX}/include -isysroot ${SDK} -arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export CFLAGS="-O3 -DNDEBUG -fvisibility=hidden -ffunction-sections -fdata-sections -isysroot ${SDK} -arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export LDFLAGS="-L${OPENSSL_PREFIX}/lib -isysroot ${SDK} -arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"

          rm -rf "${CURL_PREFIX}"
          mkdir -p "${CURL_PREFIX}"

          cd "${CURL_SRC}"

          echo "=================================================="
          echo "Build libcurl ${CURL_VERSION}"
          echo "=================================================="

          ./configure \
            --host=arm-apple-darwin \
            --prefix="${CURL_PREFIX}" \
            --disable-shared \
            --enable-static \
            --disable-debug \
            --disable-curldebug \
            --disable-manual \
            --disable-docs \
            --disable-libcurl-option \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smb \
            --disable-gopher \
            --disable-mqtt \
            --disable-file \
            --disable-ipfs \
            --disable-ftp \
            --disable-socketpair \
            --enable-http \
            --enable-proxy \
            --enable-ipv6 \
            --enable-unix-sockets \
            --enable-threaded-resolver \
            --with-openssl="${OPENSSL_PREFIX}" \
            --with-ca-fallback \
            --with-apple-sectrust \
            --without-libpsl \
            --without-zstd \
            --without-brotli \
            --without-nghttp2 \
            --without-ngtcp2 \
            --without-nghttp3 \
            --without-libidn2

          make -j"$(sysctl -n hw.logicalcpu_max)"
          make install

          test -f "${CURL_PREFIX}/lib/libcurl.a"
          test -f "${CURL_PREFIX}/include/curl/curl.h"

          file "${CURL_PREFIX}/lib/libcurl.a"

      - name: Get prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive

          git clone \
            --depth 1 \
            "${LIBARCHIVE_REPO}" \
            third_party/libarchive

          ARCHIVE_ROOT="third_party/libarchive/libarchive-apple-build/libArchive.xcframework/ios-arm64"
          ARCHIVE_LIB="${ARCHIVE_ROOT}/libarchive.a"
          ARCHIVE_HEADERS="${ARCHIVE_ROOT}/Headers"

          test -f "${ARCHIVE_LIB}"
          test -d "${ARCHIVE_HEADERS}"

          mkdir -p third_party/libarchive-ios/lib

          cp \
            "${ARCHIVE_LIB}" \
            third_party/libarchive-ios/lib/libarchive.a

          cp -R \
            "${ARCHIVE_HEADERS}" \
            third_party/libarchive-ios/

          file third_party/libarchive-ios/lib/libarchive.a

      - name: Compile ldid.cpp
        shell: bash
        run: |
          set -euo pipefail

          SDK="${GITHUB_WORKSPACE}/${SDKROOT}"
          OPENSSL_PREFIX="${GITHUB_WORKSPACE}/third_party/openssl-ios"
          CURL_PREFIX="${GITHUB_WORKSPACE}/third_party/curl-ios"
          LIBARCHIVE_PREFIX="${GITHUB_WORKSPACE}/third_party/libarchive-ios"

          CXX="$(xcrun --find clang++)"

          mkdir -p build

          echo "=================================================="
          echo "Compiler"
          echo "=================================================="

          "${CXX}" --version

          echo
          echo "TARGET=arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"
          echo "SDKROOT=${SDKROOT}"
          echo "IOS_DEPLOYMENT_TARGET=${IOS_DEPLOYMENT_TARGET}"

          echo
          echo "=================================================="
          echo "Compile ldid.cpp"
          echo "=================================================="

          "${CXX}" \
            -std=c++20 \
            -target arm64-apple-ios${IOS_DEPLOYMENT_TARGET} \
            -arch arm64 \
            -isysroot "${SDK}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_PREFIX}/include" \
            -I"${CURL_PREFIX}/include" \
            -I"${LIBARCHIVE_PREFIX}/Headers" \
            -Isource/libplist_include \
            -c source/ldid.cpp \
            -o build/ldid.o

      - name: Link ldid
        shell: bash
        run: |
          set -euo pipefail

          SDK="${GITHUB_WORKSPACE}/${SDKROOT}"
          OPENSSL_PREFIX="${GITHUB_WORKSPACE}/third_party/openssl-ios"
          CURL_PREFIX="${GITHUB_WORKSPACE}/third_party/curl-ios"
          LIBARCHIVE_PREFIX="${GITHUB_WORKSPACE}/third_party/libarchive-ios"

          CXX="$(xcrun --find clang++)"

          echo "=================================================="
          echo "Link ldid"
          echo "=================================================="

          "${CXX}" \
            -std=c++20 \
            -target arm64-apple-ios${IOS_DEPLOYMENT_TARGET} \
            -arch arm64 \
            -isysroot "${SDK}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -fvisibility=hidden \
            -Wl,-dead_strip \
            -Wl,-no_warn_duplicate_libraries \
            build/ldid.o \
            "${CURL_PREFIX}/lib/libcurl.a" \
            "${LIBARCHIVE_PREFIX}/lib/libarchive.a" \
            source/libplist_lib/libplist.a \
            "${OPENSSL_PREFIX}/lib/libssl.a" \
            "${OPENSSL_PREFIX}/lib/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -liconv \
            -lxml2 \
            -lz \
            -lbz2 \
            -lc++ \
            -o build/ldid

          echo
          echo "=================================================="
          echo "ldid result"
          echo "=================================================="

          file build/ldid
          lipo -info build/ldid

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Validate"
          echo "=================================================="

          test -x build/ldid

          build/ldid --version

          echo
          echo "Architecture:"
          lipo -info build/ldid

          echo
          echo "Undefined symbols:"
          xcrun --sdk iphoneos nm -u build/ldid || true

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp build/ldid dist/ldid
          chmod 755 dist/ldid

          cd dist

          zip -9 -q ldid-ios-arm64.zip ldid

          echo "=================================================="
          echo "Artifacts"
          echo "=================================================="

          file ldid
          lipo -info ldid

          shasum -a 256 ldid
          shasum -a 256 ldid-ios-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            dist/ldid
            dist/ldid-ios-arm64.zip
          if-no-files-found: error
          retention-days: 14
