name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  CURL_VERSION: "8.16.0"

  LIBARCHIVE_URL: "https://www.libarchive.org/downloads/libarchive-3.8.2.tar.xz"
  CURL_URL: "https://curl.se/download/curl-8.16.0.tar.xz"

jobs:

  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================================
      # Extract ldid.zip
      # ==========================================================

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== extracted source ====="
          find source -maxdepth 2 -type f -print


      # ==========================================================
      # Download exact iPhoneOS 16.5 SDK
      # ==========================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"

          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== SDK ====="
          echo "${IOS_SDK_DIR}"

          echo "===== SDK Settings ====="

          /usr/libexec/PlistBuddy \
            -c "Print:Version" \
            "${IOS_SDK_DIR}/SDKSettings.plist" \
            || true


      # ==========================================================
      # Apple compiler
      # ==========================================================

      - name: Configure iOS compiler
        shell: bash
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_AR="$(xcrun --sdk iphoneos -f ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_AR}"
          test -x "${IOS_RANLIB}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== clang ====="
          "${IOS_CLANG}" --version

          echo "===== clang++ ====="
          "${IOS_CLANGXX}" --version


      # ==========================================================
      # Validate bundled OpenSSL / libplist
      # ==========================================================

      - name: Validate bundled libraries
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"
          OPENSSL_INC="${GITHUB_WORKSPACE}/source/openssl_include"

          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"
          PLIST_INC="${GITHUB_WORKSPACE}/source/libplist_include"

          test -d "${OPENSSL_LIB}"
          test -d "${OPENSSL_INC}"

          test -d "${PLIST_LIB}"
          test -d "${PLIST_INC}"

          CRYPTO="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libcrypto*.a' \
              -print \
              -quit
          )"

          SSL="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libssl*.a' \
              -print \
              -quit
          )"

          PLIST="$(
            find "${PLIST_LIB}" \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${CRYPTO}"
          test -n "${SSL}"
          test -n "${PLIST}"

          echo "CRYPTO=${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${SSL}" >> "${GITHUB_ENV}"
          echo "PLIST=${PLIST}" >> "${GITHUB_ENV}"

          echo "===== OpenSSL ====="
          file "${CRYPTO}"
          file "${SSL}"

          echo "===== libplist ====="
          file "${PLIST}"


      # ==========================================================
      # Download libarchive
      # ==========================================================

      - name: Download libarchive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o third_party/libarchive.tar.xz \
            "${LIBARCHIVE_URL}"

          test -s third_party/libarchive.tar.xz

          rm -rf third_party/libarchive

          mkdir -p third_party/libarchive

          tar \
            -xJf third_party/libarchive.tar.xz \
            -C third_party/libarchive \
            --strip-components=1

          test -f third_party/libarchive/CMakeLists.txt

          echo "===== libarchive version ====="

          cat \
            third_party/libarchive/build/version


      # ==========================================================
      # Create one explicit iOS CMake toolchain
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT use:
      #
      #   -G Xcode
      #   -G Ninja
      #
      # Only Unix Makefiles.
      #
      # Therefore CMake never creates an Xcode project and never
      # creates ProcessInfoPlistFile / .app targets.
      # ==========================================================

      - name: Create iOS CMake toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/toolchain

          cat > build/toolchain/ios-arm64.cmake <<EOF
          set(CMAKE_SYSTEM_NAME iOS)

          set(CMAKE_SYSTEM_PROCESSOR arm64)

          set(CMAKE_OSX_SYSROOT "${IOS_SDK_DIR}" CACHE PATH "" FORCE)

          set(CMAKE_OSX_ARCHITECTURES "arm64" CACHE STRING "" FORCE)

          set(CMAKE_OSX_DEPLOYMENT_TARGET "${IOS_DEPLOYMENT_TARGET}" CACHE STRING "" FORCE)

          set(CMAKE_C_COMPILER "${IOS_CLANG}" CACHE FILEPATH "" FORCE)

          set(CMAKE_CXX_COMPILER "${IOS_CLANGXX}" CACHE FILEPATH "" FORCE)

          set(CMAKE_AR "${IOS_AR}" CACHE FILEPATH "" FORCE)

          set(CMAKE_RANLIB "${IOS_RANLIB}" CACHE FILEPATH "" FORCE)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          set(CMAKE_C_FLAGS_INIT
              "-target arm64-apple-ios${IOS_DEPLOYMENT_TARGET} -isysroot ${IOS_SDK_DIR}"
          )

          set(CMAKE_CXX_FLAGS_INIT
              "-target arm64-apple-ios${IOS_DEPLOYMENT_TARGET} -isysroot ${IOS_SDK_DIR}"
          )

          set(CMAKE_EXE_LINKER_FLAGS_INIT
              "-target arm64-apple-ios${IOS_DEPLOYMENT_TARGET} -isysroot ${IOS_SDK_DIR}"
          )

          set(CMAKE_SHARED_LINKER_FLAGS_INIT
              "-target arm64-apple-ios${IOS_DEPLOYMENT_TARGET} -isysroot ${IOS_SDK_DIR}"
          )

          set(CMAKE_MODULE_LINKER_FLAGS_INIT
              "-target arm64-apple-ios${IOS_DEPLOYMENT_TARGET} -isysroot ${IOS_SDK_DIR}"
          )

          set(CMAKE_FIND_ROOT_PATH
              "${IOS_SDK_DIR}"
          )

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

          cat build/toolchain/ios-arm64.cmake


      # ==========================================================
      # Download / build libarchive
      # ==========================================================

      - name: Configure libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/libarchive

          cmake \
            -S third_party/libarchive \
            -B build/libarchive \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/build/toolchain/ios-arm64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_INSTALL=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_COVERAGE=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            -DENABLE_TAR_SHARED=OFF \
            -DENABLE_CPIO_SHARED=OFF \
            -DENABLE_CAT_SHARED=OFF \
            -DENABLE_UNZIP_SHARED=OFF \
            -DENABLE_ACL=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_LIBB2=OFF \
            -DENABLE_LZ4=OFF \
            -DENABLE_LZO=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_BZip2=OFF \
            -DENABLE_LIBXML2=OFF \
            -DENABLE_EXPAT=OFF \
            -DENABLE_PCREPOSIX=OFF \
            -DENABLE_PCRE2POSIX=OFF \
            -DENABLE_CNG=OFF \
            -DENABLE_ZLIB=ON \
            -DZLIB_LIBRARY=/usr/lib/libz.tbd \
            -DZLIB_INCLUDE_DIR="${IOS_SDK_DIR}/usr/include"

      - name: Build libarchive
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/libarchive \
            --parallel "$(sysctl -n hw.ncpu)" \
            --target archive_static

          LIBARCHIVE="$(
            find build/libarchive \
              -type f \
              -name 'libarchive*.a' \
              -print \
              | head -1
          )"

          test -n "${LIBARCHIVE}"
          test -f "${LIBARCHIVE}"

          echo "LIBARCHIVE=${GITHUB_WORKSPACE}/${LIBARCHIVE}" \
            >> "${GITHUB_ENV}"

          echo "===== libarchive ====="
          file "${LIBARCHIVE}"


      # ==========================================================
      # Download curl
      # ==========================================================

      - name: Download curl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl

          mkdir -p third_party/curl

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o third_party/curl.tar.xz \
            "${CURL_URL}"

          test -s third_party/curl.tar.xz

          tar \
            -xJf third_party/curl.tar.xz \
            -C third_party/curl \
            --strip-components=1

          test -f third_party/curl/CMakeLists.txt


      # ==========================================================
      # Configure curl
      #
      # NTLM explicitly OFF.
      #
      # This fixes:
      #
      #   cannot compile NTLM support without a crypto library
      #   with DES
      #
      # because your bundled OpenSSL doesn't provide the DES
      # capability curl's NTLM implementation requires.
      # ==========================================================

      - name: Configure curl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/curl

          cmake \
            -S third_party/curl \
            -B build/curl \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/build/toolchain/ios-arm64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_STATIC_CURL=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_LIBCURL_DOCS=OFF \
            -DBUILD_MISC_DOCS=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_ENABLE_NTLM=OFF \
            -DENABLE_THREADED_RESOLVER=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="${GITHUB_WORKSPACE}/source" \
            -DOPENSSL_INCLUDE_DIR="${GITHUB_WORKSPACE}/source/openssl_include" \
            -DOPENSSL_CRYPTO_LIBRARY="${CRYPTO}" \
            -DOPENSSL_SSL_LIBRARY="${SSL}" \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_LIBSSH2=OFF \
            -DCURL_USE_GSSAPI=OFF \
            -DCURL_USE_MBEDTLS=OFF \
            -DCURL_USE_WOLFSSL=OFF \
            -DCURL_USE_GNUTLS=OFF \
            -DCURL_USE_RUSTLS=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_SMB=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_TFTP=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_DISABLE_SRP=ON \
            -DCURL_DISABLE_WEBSOCKETS=OFF \
            -DCURL_DISABLE_BROTLI=ON \
            -DCURL_DISABLE_ZSTD=ON \
            -DCURL_DISABLE_LIBPSL=ON \
            -DCURL_DISABLE_HSTS=OFF \
            -DCURL_DISABLE_COOKIES=OFF \
            -DCURL_DISABLE_HTTP=OFF \
            -DCURL_DISABLE_HTTP_AUTH=OFF \
            -DCURL_DISABLE_BASIC_AUTH=OFF \
            -DCURL_DISABLE_DIGEST_AUTH=OFF \
            -DCURL_DISABLE_BEARER_AUTH=OFF \
            -DCURL_DISABLE_NEGOTIATE_AUTH=ON \
            -DCURL_DISABLE_KERBEROS_AUTH=ON \
            -DCURL_CA_BUNDLE=none \
            -DCURL_CA_PATH=none \
            -DCURL_CA_FALLBACK=ON

      - name: Build curl
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/curl \
            --parallel "$(sysctl -n hw.ncpu)" \
            --target libcurl_static

          CURL_LIB="$(
            find build/curl \
              -type f \
              -name 'libcurl*.a' \
              -print \
              | head -1
          )"

          test -n "${CURL_LIB}"
          test -f "${CURL_LIB}"

          echo "CURL=${GITHUB_WORKSPACE}/${CURL_LIB}" \
            >> "${GITHUB_ENV}"

          echo "===== libcurl ====="
          file "${CURL_LIB}"


      # ==========================================================
      # Validate dependencies
      # ==========================================================

      - name: Validate dependency architectures
        shell: bash
        run: |
          set -euo pipefail

          test -f "${CRYPTO}"
          test -f "${SSL}"
          test -f "${PLIST}"
          test -f "${LIBARCHIVE}"
          test -f "${CURL}"

          echo "===== crypto ====="
          file "${CRYPTO}"

          echo "===== ssl ====="
          file "${SSL}"

          echo "===== plist ====="
          file "${PLIST}"

          echo "===== libarchive ====="
          file "${LIBARCHIVE}"

          echo "===== curl ====="
          file "${CURL}"


      # ==========================================================
      # Build ldid
      # ==========================================================

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ldid

          mkdir -p build/ldid

          IOS_TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${IOS_TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${GITHUB_WORKSPACE}/third_party/libarchive/libarchive" \
            -I"${GITHUB_WORKSPACE}/third_party/curl/include" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lc++ \
            -lz \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid/ldid

          test -s build/ldid/ldid


      # ==========================================================
      # Validate final Mach-O
      # ==========================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          echo "===== file ====="

          file build/ldid/ldid

          echo "===== architecture ====="

          lipo -info build/ldid/ldid

          echo "===== Mach-O ====="

          otool \
            -hv \
            build/ldid/ldid

          echo "===== build version ====="

          otool \
            -l \
            build/ldid/ldid \
            | grep -A5 LC_BUILD_VERSION

          echo "===== linked libraries ====="

          otool \
            -L \
            build/ldid/ldid


      # ==========================================================
      # Run version
      #
      # An iOS binary cannot normally execute on the macOS runner.
      #
      # Therefore this is intentionally a Mach-O validation,
      # NOT ./ldid --version.
      # ==========================================================

      - name: Validate iOS deployment target
        shell: bash
        run: |
          set -euo pipefail

          otool \
            -l \
            build/ldid/ldid \
            > build/ldid/load-commands.txt

          grep \
            -A5 \
            LC_BUILD_VERSION \
            build/ldid/load-commands.txt

          grep \
            -A5 \
            LC_BUILD_VERSION \
            build/ldid/load-commands.txt \
            | grep \
              "platform 2"


      # ==========================================================
      # Strip
      # ==========================================================

      - name: Strip final binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid/ldid \
            build/ldid/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid/ldid

          test -s build/ldid/ldid

          echo "===== final binary ====="

          file build/ldid/ldid

          lipo -info build/ldid/ldid


      # ==========================================================
      # Package
      # ==========================================================

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist

          cp \
            build/ldid/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== artifact ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256

          cat \
            ldid-ios-arm64.tar.gz.sha256


      # ==========================================================
      # Upload ONLY final iOS artifact
      # ==========================================================

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
