name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "16.0"
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"
  CURL_REPO: "XDcobra/libcurl-ios-prebuilt-and-buildscripts"
  CURL_RELEASE_TAG: "curl-8_17_0"
  CURL_VERSION: "8.17.0"

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q ldid.zip -d source

          echo "===== SOURCE TREE ====="
          find source -maxdepth 2 -print | sort

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            xz

      - name: Download iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party/sdk

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -o third_party/iPhoneOS16.5.sdk.tar.xz \
            "${IOS_SDK_URL}"

          tar -xJf \
            third_party/iPhoneOS16.5.sdk.tar.xz \
            -C third_party/sdk

          SDK="$(find third_party/sdk -type d -name 'iPhoneOS16.5.sdk' -print -quit)"

          echo "SDK=${SDK}" >> "${GITHUB_ENV}"
          echo "SDKROOT=${SDK}" >> "${GITHUB_ENV}"

          echo "Using SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Locate bundled OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB_DIR="source/openssl_lib"
          OPENSSL_INCLUDE_DIR="source/openssl_include"

          if [ ! -d "${OPENSSL_LIB_DIR}" ]; then
            OPENSSL_LIB_DIR="$(find source -type d -name 'openssl_lib' -print -quit)"
          fi

          if [ ! -d "${OPENSSL_INCLUDE_DIR}" ]; then
            OPENSSL_INCLUDE_DIR="$(find source -type d -name 'openssl_include' -print -quit)"
          fi

          echo "OPENSSL_LIB_DIR=${OPENSSL_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}" >> "${GITHUB_ENV}"

          echo "OpenSSL libraries:"
          find "${OPENSSL_LIB_DIR}" -maxdepth 1 -type f -print | sort

      - name: Locate bundled libplist
        shell: bash
        run: |
          set -euo pipefail

          PLIST_LIB_DIR="source/libplist_lib"
          PLIST_INCLUDE_DIR="source/libplist_include"

          if [ ! -d "${PLIST_LIB_DIR}" ]; then
            PLIST_LIB_DIR="$(find source -type d -name 'libplist_lib' -print -quit)"
          fi

          if [ ! -d "${PLIST_INCLUDE_DIR}" ]; then
            PLIST_INCLUDE_DIR="$(find source -type d -name 'libplist_include' -print -quit)"
          fi

          echo "PLIST_LIB_DIR=${PLIST_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "PLIST_INCLUDE_DIR=${PLIST_INCLUDE_DIR}" >> "${GITHUB_ENV}"

      - name: Patch Apple Security availability
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("source/ldid.cpp")
          s = p.read_text()

          if "#include <TargetConditionals.h>" not in s:
              marker = "#ifdef __APPLE__"
              pos = s.find(marker)

              if pos >= 0:
                  s = s[:pos] + "#include <TargetConditionals.h>\n\n" + s[pos:]
              else:
                  s = "#include <TargetConditionals.h>\n" + s

          old = """#ifdef __APPLE__
          static bool verify_with_apple_system(const std::string &path) {
          """

          new = """#if defined(__APPLE__) && TARGET_OS_OSX
          static bool verify_with_apple_system(const std::string &path) {
          """

          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          grep -n \
            -E 'TargetConditionals|TARGET_OS_OSX|verify_with_apple_system' \
            source/ldid.cpp || true

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive
          git clone \
            --depth 1 \
            "${LIBARCHIVE_REPO}" \
            third_party/libarchive

          LIBARCHIVE_XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -path '*/libArchive.xcframework' \
              -print -quit
          )"

          LIBARCHIVE_A="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type f \
              -path '*/ios-arm64/libarchive.a' \
              -print -quit
          )"

          LIBARCHIVE_HEADERS="$(
            find "${LIBARCHIVE_XCFRAMEWORK}" \
              -type d \
              -name Headers \
              -print -quit
          )"

          echo "LIBARCHIVE_XCFRAMEWORK=${LIBARCHIVE_XCFRAMEWORK}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_A=${LIBARCHIVE_A}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${LIBARCHIVE_HEADERS}" >> "${GITHUB_ENV}"

          echo "libarchive:"
          echo "${LIBARCHIVE_A}"

          echo "headers:"
          echo "${LIBARCHIVE_HEADERS}"

      - name: Download prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl
          mkdir -p third_party/curl/release
          mkdir -p third_party/curl/extracted

          gh release download \
            "${CURL_RELEASE_TAG}" \
            --repo "${CURL_REPO}" \
            --dir third_party/curl/release

          for archive in third_party/curl/release/*; do
            case "${archive}" in
              *.zip)
                unzip -q "${archive}" -d third_party/curl/extracted
                ;;
              *.tar.gz|*.tgz)
                tar -xzf "${archive}" -C third_party/curl/extracted
                ;;
              *.tar.xz)
                tar -xJf "${archive}" -C third_party/curl/extracted
                ;;
              *.tar.bz2)
                tar -xjf "${archive}" -C third_party/curl/extracted
                ;;
              *)
                ;;
            esac
          done

          CURL_A="$(
            find third_party/curl/extracted \
              -type f \
              -path '*/ios-arm64/libcurl.a' \
              -print -quit
          )"

          if [ -z "${CURL_A}" ]; then
            CURL_A="$(
              find third_party/curl/extracted \
                -type f \
                -name 'libcurl.a' \
                -print -quit
            )"
          fi

          echo "CURL_A=${CURL_A}" >> "${GITHUB_ENV}"

          echo "libcurl:"
          echo "${CURL_A}"

      - name: Download curl headers
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party/curl-source

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -o third_party/curl-${CURL_VERSION}.tar.xz \
            "https://curl.se/download/curl-${CURL_VERSION}.tar.xz"

          tar -xJf \
            third_party/curl-${CURL_VERSION}.tar.xz \
            -C third_party/curl-source

          CURL_SOURCE="$(
            find third_party/curl-source \
              -maxdepth 1 \
              -type d \
              -name "curl-${CURL_VERSION}" \
              -print -quit
          )"

          echo "CURL_SOURCE=${CURL_SOURCE}" >> "${GITHUB_ENV}"

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          SDK="${SDKROOT}"

          export PATH="$(xcrun --sdk iphoneos --find clang | xargs dirname):${PATH}"

          CLANG="$(xcrun --sdk iphoneos --find clang)"
          CXX="$(xcrun --sdk iphoneos --find clang++)"

          SYSROOT="${SDK}"

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          mkdir -p build

          COMMON_FLAGS=(
            "-target" "${TARGET}"
            "-isysroot" "${SYSROOT}"
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"

            "-O3"
            "-DNDEBUG"

            "-flto=thin"
            "-ffunction-sections"
            "-fdata-sections"
            "-fvisibility=hidden"
            "-fstrict-aliasing"

            "-Wall"
            "-Wextra"
            "-Wpedantic"
            "-Werror"

            "-I${OPENSSL_INCLUDE_DIR}"
            "-I${PLIST_INCLUDE_DIR}"
            "-I${LIBARCHIVE_HEADERS}"
            "-I${CURL_SOURCE}/include"

            "-I${SDK}/usr/include"
          )

          LINK_FLAGS=(
            "-target" "${TARGET}"
            "-isysroot" "${SYSROOT}"
            "-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"

            "-flto=thin"

            "-Wl,-dead_strip"
            "-Wl,-no_compact_unwind"
          )

          "${CXX}" \
            "${COMMON_FLAGS[@]}" \
            -c \
            source/ldid.cpp \
            -o build/ldid.o

          "${CXX}" \
            "${LINK_FLAGS[@]}" \
            build/ldid.o \
            "${PLIST_LIB_DIR}/libplist.a" \
            "${LIBARCHIVE_A}" \
            "${CURL_A}" \
            "${OPENSSL_LIB_DIR}/libssl.a" \
            "${OPENSSL_LIB_DIR}/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -liconv \
            -lxml2 \
            -lc++ \
            -lz \
            -lbz2 \
            -o build/ldid

          chmod +x build/ldid

      - name: Strip binary
        shell: bash
        run: |
          set -euo pipefail

          cp build/ldid build/ldid.unstripped

          STRIP="$(xcrun --sdk iphoneos --find strip)"

          "${STRIP}" \
            -S \
            build/ldid

      - name: Inspect binary
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILE ====="
          file build/ldid

          echo "===== SIZE ====="
          ls -lh \
            build/ldid \
            build/ldid.unstripped

          echo "===== ARCH ====="
          xcrun --sdk iphoneos lipo -info build/ldid

          echo "===== LOAD COMMANDS ====="
          xcrun --sdk iphoneos otool \
            -l \
            build/ldid |
            grep -A5 \
              -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true

          echo "===== VERSION ====="
          build/ldid --version

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/source

          cp \
            source/ldid.cpp \
            source/ldid.hpp \
            release/source/

          tar \
            -czf \
            release/ldid-source.tar.gz \
            -C source \
            ldid.cpp \
            ldid.hpp

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp build/ldid release/ldid-ios-arm64
          cp build/ldid.unstripped release/ldid-ios-arm64.unstripped

          sha256sum \
            release/ldid-ios-arm64 \
            release/ldid-ios-arm64.unstripped \
            release/ldid-source.tar.gz \
            > release/SHA256SUMS

          echo "===== RELEASE ====="
          ls -lah release

          echo "===== SHA256 ====="
          cat release/SHA256SUMS

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64
            release/ldid-ios-arm64.unstripped
            release/ldid-source.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
