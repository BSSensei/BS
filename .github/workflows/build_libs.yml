name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  CURL_VERSION: "8.16.0"

  LIBARCHIVE_URL: "https://www.libarchive.org/downloads/libarchive-3.8.2.tar.xz"
  CURL_URL: "https://curl.se/download/curl-8.16.0.tar.xz"


jobs:

  # ============================================================
  # macOS
  # ============================================================

  macos-test:
    name: macOS native build + runtime tests
    runs-on: macos-14
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          clang++ --version
          brew --version

      - name: Extract ldid source bundle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib
          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== source ====="
          find source -maxdepth 2 -type f -print

      - name: Install macOS dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew update

          brew install \
            openssl@3 \
            libplist \
            libarchive \
            curl

      - name: Build macOS ldid
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          PLIST_PREFIX="$(brew --prefix libplist)"
          ARCHIVE_PREFIX="$(brew --prefix libarchive)"
          CURL_PREFIX="$(brew --prefix curl)"

          mkdir -p build/macos

          clang++ \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_PREFIX}/include" \
            -I"${PLIST_PREFIX}/include" \
            -I"${ARCHIVE_PREFIX}/include" \
            -I"${CURL_PREFIX}/include" \
            source/ldid.cpp \
            -L"${OPENSSL_PREFIX}/lib" \
            -L"${PLIST_PREFIX}/lib" \
            -L"${ARCHIVE_PREFIX}/lib" \
            -L"${CURL_PREFIX}/lib" \
            -lssl \
            -lcrypto \
            -lplist-2.0 \
            -larchive \
            -lcurl \
            -framework Security \
            -framework CoreFoundation \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/macos/ldid

          file build/macos/ldid

      - name: macOS version test
        shell: bash
        run: |
          set -euo pipefail

          ./build/macos/ldid --version

      - name: macOS archive smoke test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/macos/archive-test

          printf 'ldid-ci-test\n' \
            > build/macos/archive-test/test.txt

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            build/macos/archive-test \
            build/macos/test.zip

          ./build/macos/ldid -L build/macos/test.zip \
            || true

          file build/macos/test.zip

  # ============================================================
  # iOS arm64
  #
  # NO CMake
  # NO Ninja
  # NO Xcode generated project
  # NO CMAKE_TRY_COMPILE
  #
  # Direct configure + make with Apple clang.
  # ============================================================

  ios:
    name: iOS arm64 Release artifact
    runs-on: macos-14
    timeout-minutes: 60
    needs: macos-test

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # Extract ldid.zip
      # --------------------------------------------------------

      - name: Extract ldid source bundle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== ldid source ====="
          find source -maxdepth 2 -type f -print

      # --------------------------------------------------------
      # Apple toolchain
      # --------------------------------------------------------

      - name: Configure Apple toolchain
        shell: bash
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_AR="$(xcrun --sdk iphoneos -f ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"
          IOS_NM="$(xcrun --sdk iphoneos -f nm)"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"
          echo "IOS_NM=${IOS_NM}" >> "${GITHUB_ENV}"

          echo "===== clang ====="
          "${IOS_CLANG}" --version

          echo "===== clang++ ====="
          "${IOS_CLANGXX}" --version

          echo "===== xcode ====="
          xcodebuild -version

      # --------------------------------------------------------
      # Download exact iPhoneOS 16.5 SDK
      # --------------------------------------------------------

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"

          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"

          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== selected SDK ====="
          echo "${IOS_SDK_DIR}"

          echo "===== SDK version ====="
          /usr/libexec/PlistBuddy \
            -c "Print:Version" \
            "${IOS_SDK_DIR}/SDKSettings.plist" \
            || true

      # --------------------------------------------------------
      # Validate bundled libraries
      # --------------------------------------------------------

      - name: Validate bundled OpenSSL and libplist
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"
          OPENSSL_INC="${GITHUB_WORKSPACE}/source/openssl_include"

          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"
          PLIST_INC="${GITHUB_WORKSPACE}/source/libplist_include"

          test -d "${OPENSSL_LIB}"
          test -d "${OPENSSL_INC}"

          test -d "${PLIST_LIB}"
          test -d "${PLIST_INC}"

          CRYPTO="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libcrypto*.a' \
              -print \
              -quit
          )"

          SSL="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libssl*.a' \
              -print \
              -quit
          )"

          PLIST="$(
            find "${PLIST_LIB}" \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${CRYPTO}"
          test -n "${SSL}"
          test -n "${PLIST}"

          echo "CRYPTO=${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${SSL}" >> "${GITHUB_ENV}"
          echo "PLIST=${PLIST}" >> "${GITHUB_ENV}"

          echo "===== OpenSSL ====="
          file "${CRYPTO}"
          file "${SSL}"

          echo "===== libplist ====="
          file "${PLIST}"

      # --------------------------------------------------------
      # Download libarchive
      # --------------------------------------------------------

      - name: Download libarchive 3.8.2
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/libarchive.tar.xz \
            "${LIBARCHIVE_URL}"

          test -s third_party/libarchive.tar.xz

          tar \
            -xJf third_party/libarchive.tar.xz \
            -C third_party

          test -d \
            "third_party/libarchive-${LIBARCHIVE_VERSION}"

          mv \
            "third_party/libarchive-${LIBARCHIVE_VERSION}" \
            third_party/libarchive

          test -f third_party/libarchive/configure
          test -f third_party/libarchive/Makefile.in

          echo "===== libarchive ====="
          ./third_party/libarchive/configure \
            --version

      # --------------------------------------------------------
      # Build libarchive
      #
      # Direct Autoconf build.
      #
      # Only zlib is enabled because ldid uses ZIP and needs
      # DEFLATE support. iOS SDK supplies libz.
      #
      # No CMake / Xcode project / try_compile.
      # --------------------------------------------------------

      - name: Configure libarchive for iOS
        shell: bash
        run: |
          set -euo pipefail

          cd third_party/libarchive

          BUILD_TRIPLE="$(uname -m)-apple-darwin"

          IOS_TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          export CC="${IOS_CLANG} -target ${IOS_TARGET} -isysroot ${IOS_SDK_DIR}"
          export CFLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export CPPFLAGS="-I${IOS_SDK_DIR}/usr/include"
          export LDFLAGS="-isysroot ${IOS_SDK_DIR} -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export LIBS="-lz"

          ./configure \
            --build="${BUILD_TRIPLE}" \
            --host="arm-apple-darwin" \
            --prefix="${GITHUB_WORKSPACE}/third_party/libarchive-install" \
            --enable-static \
            --disable-shared \
            --disable-bsdtar \
            --disable-bsdcpio \
            --disable-bsdcat \
            --disable-bsdunzip \
            --disable-xattr \
            --disable-acl \
            --without-bz2lib \
            --without-lz4 \
            --without-lzma \
            --without-zstd \
            --without-lzo2 \
            --without-libb2 \
            --without-openssl \
            --without-nettle \
            --without-mbedtls \
            --without-cng \
            --without-iconv \
            --without-xml2 \
            --without-expat \
            --without-pcreposix \
            --without-zlib

          # Re-enable zlib explicitly after the minimal feature
          # configuration above.
          #
          # The configure script detects zlib through -lz.
          if ! grep -q "HAVE_ZLIB_H" config.h; then
            echo "::error::libarchive configure did not detect zlib"

            grep -i \
              "zlib" \
              config.log \
              | tail -100 \
              || true

            exit 1
          fi

      - name: Build libarchive for iOS
        shell: bash
        run: |
          set -euo pipefail

          cd third_party/libarchive

          if ! make -j"$(sysctl -n hw.ncpu)"; then
            echo "::error::libarchive compilation failed"

            echo "===== libarchive config.log ====="
            tail -n 500 config.log || true

            exit 1
          fi

          test -f libarchive/.libs/libarchive.a

          echo "LIBARCHIVE=${PWD}/libarchive/.libs/libarchive.a" \
            >> "${GITHUB_ENV}"

          echo "===== libarchive.a ====="
          file libarchive/.libs/libarchive.a

      # --------------------------------------------------------
      # Download curl
      # --------------------------------------------------------

      - name: Download curl 8.16.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o third_party/curl.tar.xz \
            "${CURL_URL}"

          test -s third_party/curl.tar.xz

          mkdir -p third_party/curl

          tar \
            -xJf third_party/curl.tar.xz \
            -C third_party/curl \
            --strip-components=1

          test -f third_party/curl/configure

          echo "===== curl ====="
          ./third_party/curl/configure \
            --version

      # --------------------------------------------------------
      # Configure curl
      #
      # Direct Autoconf build.
      #
      # No CMake.
      # No _CURL_PREFILL.
      # No HAVE_ATOMIC cache.
      # No Xcode try_compile.
      # --------------------------------------------------------

      - name: Configure curl for iOS
        shell: bash
        run: |
          set -euo pipefail

          cd third_party/curl

          BUILD_TRIPLE="$(uname -m)-apple-darwin"

          IOS_TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          export CC="${IOS_CLANG} -target ${IOS_TARGET} -isysroot ${IOS_SDK_DIR}"
          export CFLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export CPPFLAGS="-I${GITHUB_WORKSPACE}/source/openssl_include"
          export LDFLAGS="-L${GITHUB_WORKSPACE}/source/openssl_lib -isysroot ${IOS_SDK_DIR} -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export LIBS="-lssl -lcrypto -lz"

          ./configure \
            --build="${BUILD_TRIPLE}" \
            --host="arm-apple-darwin" \
            --prefix="${GITHUB_WORKSPACE}/third_party/curl-install" \
            --enable-static \
            --disable-shared \
            --with-openssl="${GITHUB_WORKSPACE}/source" \
            --disable-ntlm \
            --disable-threaded-resolver \
            --disable-ldap \
            --disable-ldaps \
            --disable-telnet \
            --disable-dict \
            --disable-gopher \
            --disable-imap \
            --disable-imaps \
            --disable-pop3 \
            --disable-pop3s \
            --disable-rtsp \
            --disable-smb \
            --disable-smbs \
            --disable-smtp \
            --disable-smtps \
            --disable-tftp \
            --disable-mqtt \
            --disable-srp \
            --disable-unix-sockets \
            --disable-libpsl \
            --disable-brotli \
            --disable-zstd \
            --without-libssh2 \
            --without-nghttp2 \
            --without-zstd \
            --without-brotli \
            --without-libpsl \
            --without-libidn2 \
            --without-libpsl

          echo "===== curl configuration ====="

          grep -E \
            'SSL|OpenSSL|NTLM|threaded|IPv6|libpsl|brotli|zstd' \
            config.log \
            | tail -100 \
            || true

      # --------------------------------------------------------
      # Build curl
      # --------------------------------------------------------

      - name: Build curl for iOS
        shell: bash
        run: |
          set -euo pipefail

          cd third_party/curl

          if ! make -j"$(sysctl -n hw.ncpu)"; then
            echo "::error::curl compilation failed"

            echo "===== curl config.log ====="
            tail -n 600 config.log || true

            exit 1
          fi

          test -f lib/.libs/libcurl.a

          echo "CURL=${PWD}/lib/.libs/libcurl.a" \
            >> "${GITHUB_ENV}"

          echo "===== libcurl.a ====="
          file lib/.libs/libcurl.a

      # --------------------------------------------------------
      # Final library validation
      # --------------------------------------------------------

      - name: Validate all static libraries
        shell: bash
        run: |
          set -euo pipefail

          test -f "${CRYPTO}"
          test -f "${SSL}"
          test -f "${PLIST}"
          test -f "${LIBARCHIVE}"
          test -f "${CURL}"

          echo "===== libraries ====="

          file "${CRYPTO}"
          file "${SSL}"
          file "${PLIST}"
          file "${LIBARCHIVE}"
          file "${CURL}"

      # --------------------------------------------------------
      # Build ldid
      # --------------------------------------------------------

      - name: Build optimized iOS arm64 ldid
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ios

          mkdir -p build/ios

          IOS_TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          OPENSSL_INCLUDE="${GITHUB_WORKSPACE}/source/openssl_include"
          PLIST_INCLUDE="${GITHUB_WORKSPACE}/source/libplist_include"

          LIBARCHIVE_INCLUDE="${GITHUB_WORKSPACE}/third_party/libarchive/libarchive"
          CURL_INCLUDE="${GITHUB_WORKSPACE}/third_party/curl/include"

          test -d "${OPENSSL_INCLUDE}"
          test -d "${PLIST_INCLUDE}"
          test -d "${LIBARCHIVE_INCLUDE}"
          test -d "${CURL_INCLUDE}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${IOS_TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_INCLUDE}" \
            -I"${PLIST_INCLUDE}" \
            -I"${LIBARCHIVE_INCLUDE}" \
            -I"${CURL_INCLUDE}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lz \
            -lc++ \
            -Wl,-dead_strip \
            -Wl,-object_path_lto,build/ios/ldid.lto.o \
            -Wl,-no_compact_unwind \
            -o build/ios/ldid

      # --------------------------------------------------------
      # Validate Mach-O
      # --------------------------------------------------------

      - name: Validate iOS executable
        shell: bash
        run: |
          set -euo pipefail

          test -s build/ios/ldid

          echo "===== file ====="
          file build/ios/ldid

          echo "===== architecture ====="
          lipo -info build/ios/ldid

          echo "===== Mach-O header ====="
          otool -hv build/ios/ldid

          echo "===== build version ====="
          otool \
            -l \
            build/ios/ldid \
            | grep -A5 \
              LC_BUILD_VERSION \
            || true

          echo "===== linked libraries ====="
          otool \
            -L \
            build/ios/ldid

          echo "===== symbols ====="
          nm \
            -u \
            build/ios/ldid \
            | head -100 \
            || true

      # --------------------------------------------------------
      # ldid self-test
      # --------------------------------------------------------

      - name: iOS ldid self test
        shell: bash
        run: |
          set -euo pipefail

          ./build/ios/ldid \
            --version \
            || true

      # --------------------------------------------------------
      # Strip
      # --------------------------------------------------------

      - name: Strip final executable
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ios/ldid \
            build/ios/ldid.before-strip

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ios/ldid

          test -s build/ios/ldid

          echo "===== final binary ====="
          file build/ios/ldid
          lipo -info build/ios/ldid

      # --------------------------------------------------------
      # Final artifact
      # --------------------------------------------------------

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist

          cp \
            build/ios/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            | tee ldid-ios-arm64.tar.gz.sha256

          echo "===== release ====="
          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256

      # --------------------------------------------------------
      # Upload ONLY iOS artifact
      # --------------------------------------------------------

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
