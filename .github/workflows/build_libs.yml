name: Build ldid

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  CURL_VERSION: "8.16.0"

jobs:

  # ============================================================
  # macOS
  # ============================================================

  macos:
    name: Build macOS
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew update

          brew install \
            openssl@3 \
            libplist \
            libarchive \
            curl

      # ----------------------------------------------------------
      # Extract source
      # ----------------------------------------------------------

      - name: Extract ldid.zip
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf source

          mkdir -p source

          test -f ldid.zip

          ditto -x -k ldid.zip source

          echo "=== Extracted files ==="
          find source -maxdepth 3 -type f -print

          test -f source/ldid.cpp
          test -f source/ldid.hpp

      # ----------------------------------------------------------
      # Configure Homebrew
      # ----------------------------------------------------------

      - name: Configure macOS dependencies
        shell: bash
        run: |
          set -euxo pipefail

          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          LIBPLIST_ROOT="$(brew --prefix libplist)"
          LIBARCHIVE_ROOT="$(brew --prefix libarchive)"
          CURL_ROOT="$(brew --prefix curl)"

          CC_PATH="$(xcrun --find clang)"
          CXX_PATH="$(xcrun --find clang++)"

          echo "OPENSSL_ROOT=$OPENSSL_ROOT" >> "$GITHUB_ENV"
          echo "LIBPLIST_ROOT=$LIBPLIST_ROOT" >> "$GITHUB_ENV"
          echo "LIBARCHIVE_ROOT=$LIBARCHIVE_ROOT" >> "$GITHUB_ENV"
          echo "CURL_ROOT=$CURL_ROOT" >> "$GITHUB_ENV"

          echo "CC=$CC_PATH" >> "$GITHUB_ENV"
          echo "CXX=$CXX_PATH" >> "$GITHUB_ENV"

          echo "CC=$CC_PATH"
          echo "CXX=$CXX_PATH"
          echo "OPENSSL_ROOT=$OPENSSL_ROOT"
          echo "LIBPLIST_ROOT=$LIBPLIST_ROOT"
          echo "LIBARCHIVE_ROOT=$LIBARCHIVE_ROOT"
          echo "CURL_ROOT=$CURL_ROOT"

      # ----------------------------------------------------------
      # Build macOS
      # ----------------------------------------------------------

      - name: Build macOS ldid
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build/macos

          "$CXX" \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"$OPENSSL_ROOT/include" \
            -I"$LIBPLIST_ROOT/include" \
            -I"$LIBARCHIVE_ROOT/include" \
            -I"$CURL_ROOT/include" \
            source/ldid.cpp \
            -L"$OPENSSL_ROOT/lib" \
            -L"$LIBPLIST_ROOT/lib" \
            -L"$LIBARCHIVE_ROOT/lib" \
            -L"$CURL_ROOT/lib" \
            -lssl \
            -lcrypto \
            -lplist-2.0 \
            -larchive \
            -lcurl \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/macos/ldid

      # ----------------------------------------------------------
      # macOS validation
      # ----------------------------------------------------------

      - name: Validate macOS binary
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/macos/ldid

          file build/macos/ldid

          build/macos/ldid --version

          echo "macOS build successful."

  # ============================================================
  # iOS arm64
  # ============================================================

  ios:
    name: Build iOS arm64
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Extract ldid.zip
      # ----------------------------------------------------------

      - name: Extract ldid.zip
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf source

          mkdir -p source

          test -f ldid.zip

          ditto -x -k ldid.zip source

          echo "========================================"
          echo "Extracted source tree"
          echo "========================================"

          find source -maxdepth 3 -print

          echo "========================================"

          test -f source/ldid.cpp
          test -f source/ldid.hpp

      # ----------------------------------------------------------
      # Xcode
      # ----------------------------------------------------------

      - name: Configure Xcode
        shell: bash
        run: |
          set -euxo pipefail

          xcode-select -p

          IOS_CC="$(xcrun --sdk iphoneos --find clang)"
          IOS_CXX="$(xcrun --sdk iphoneos --find clang++)"

          echo "IOS_CC=$IOS_CC"
          echo "IOS_CXX=$IOS_CXX"

          test -x "$IOS_CC"
          test -x "$IOS_CXX"

          echo "IOS_CC=$IOS_CC" >> "$GITHUB_ENV"
          echo "IOS_CXX=$IOS_CXX" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Download exact iOS SDK
      # ----------------------------------------------------------

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_URL="$IOS_SDK_URL"

          SDK_ARCHIVE="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          SDK_ROOT="$RUNNER_TEMP/iphoneos-sdk"

          rm -rf "$SDK_ROOT"

          mkdir -p "$SDK_ROOT"

          echo "Downloading:"
          echo "$SDK_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$SDK_ARCHIVE" \
            "$SDK_URL"

          test -s "$SDK_ARCHIVE"

          echo "Extracting SDK..."

          tar \
            -xJf "$SDK_ARCHIVE" \
            -C "$SDK_ROOT"

          echo "Searching SDK..."

          find "$SDK_ROOT" \
            -type d \
            -name "iPhoneOS16.5.sdk" \
            -print

          IOS_SDK_DIR="$(
            find "$SDK_ROOT" \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          test -n "$IOS_SDK_DIR"

          test -d "$IOS_SDK_DIR"

          echo "IOS_SDK_DIR=$IOS_SDK_DIR" >> "$GITHUB_ENV"

          echo "Using SDK:"
          echo "$IOS_SDK_DIR"

          - name: Build libarchive for iOS
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf third_party/libarchive-build

          cmake \
            -S third_party/libarchive-src \
            -B third_party/libarchive-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER="$IOS_CC" \
            -DCMAKE_CXX_COMPILER="$IOS_CXX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DBUILD_SHARED_LIBS=OFF \
            \
            -DENABLE_TEST=OFF \
            \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            \
            -DENABLE_BSDTAR=OFF \
            -DENABLE_BSDCPIO=OFF \
            -DENABLE_BSDCAT=OFF \
            \
            -DENABLE_ACL=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ICONV=OFF \
            \
            -DENABLE_LIBXML2=OFF \
            -DENABLE_EXPAT=OFF \
            \
            -DENABLE_LZ4=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_BZip2=OFF \
            \
            -DENABLE_CNG=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF

          cmake \
            --build third_party/libarchive-build \
            --parallel

          LIBARCHIVE_A="$(
            find third_party/libarchive-build \
              -type f \
              -name "libarchive*.a" \
              -print \
              -quit
          )"

          test -n "$LIBARCHIVE_A"
          test -f "$LIBARCHIVE_A"

          echo "LIBARCHIVE_A=$GITHUB_WORKSPACE/$LIBARCHIVE_A" >> "$GITHUB_ENV"

          echo "========================================"
          echo "libarchive"
          echo "========================================"

          file "$LIBARCHIVE_A"

          lipo -info "$LIBARCHIVE_A" || true
      # ----------------------------------------------------------
      # Download libarchive
      # ----------------------------------------------------------

      - name: Download libarchive
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p third_party

          LIBARCHIVE_ARCHIVE="$RUNNER_TEMP/libarchive.tar.xz"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$LIBARCHIVE_ARCHIVE" \
            "https://www.libarchive.org/downloads/libarchive-${LIBARCHIVE_VERSION}.tar.xz"

          test -s "$LIBARCHIVE_ARCHIVE"

          rm -rf third_party/libarchive-src

          mkdir -p third_party/libarchive-src

          tar \
            -xJf "$LIBARCHIVE_ARCHIVE" \
            -C third_party/libarchive-src \
            --strip-components=1

          test -f third_party/libarchive-src/CMakeLists.txt

      # ----------------------------------------------------------
      # Build libarchive
      # ----------------------------------------------------------

      - name: Build libarchive for iOS
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf third_party/libarchive-build

          cmake \
            -S third_party/libarchive-src \
            -B third_party/libarchive-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER="$IOS_CC" \
            -DCMAKE_CXX_COMPILER="$IOS_CXX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_BSDCAT=OFF \
            -DENABLE_BSDCPIO=OFF \
            -DENABLE_BSDTAR=OFF \
            -DENABLE_ACL=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_LIBXML2=OFF \
            -DENABLE_EXPAT=OFF \
            -DENABLE_LZ4=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_BZip2=OFF \
            -DENABLE_CNG=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF

          cmake \
            --build third_party/libarchive-build \
            --parallel

          LIBARCHIVE_A="$(
            find third_party/libarchive-build \
              -type f \
              -name "libarchive*.a" \
              -print \
              -quit
          )"

          test -n "$LIBARCHIVE_A"
          test -f "$LIBARCHIVE_A"

          echo "LIBARCHIVE_A=$GITHUB_WORKSPACE/$LIBARCHIVE_A" >> "$GITHUB_ENV"

          echo "libarchive:"
          file "$LIBARCHIVE_A"

          lipo -info "$LIBARCHIVE_A" || true

      # ----------------------------------------------------------
      # Download curl
      # ----------------------------------------------------------

      - name: Download curl
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p third_party

          CURL_ARCHIVE="$RUNNER_TEMP/curl.tar.xz"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$CURL_ARCHIVE" \
            "https://curl.se/download/curl-${CURL_VERSION}.tar.xz"

          test -s "$CURL_ARCHIVE"

          rm -rf third_party/curl-src

          mkdir -p third_party/curl-src

          tar \
            -xJf "$CURL_ARCHIVE" \
            -C third_party/curl-src \
            --strip-components=1

          test -f third_party/curl-src/CMakeLists.txt

      # ----------------------------------------------------------
      # Build curl
      #
      # NTLM is explicitly disabled.
      #
      # Without this:
      #
      # curl_ntlm_core.c
      # -> DES required
      # -> bundled OpenSSL has no usable DES
      # -> compilation failure
      #
      # ldid only needs HTTPS/TLS/TSA.
      # ----------------------------------------------------------

      - name: Build curl for iOS
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$OPENSSL_SSL"
          test -f "$OPENSSL_CRYPTO"

          test -d "$OPENSSL_INC"

          rm -rf third_party/curl-build

          cmake \
            -S third_party/curl-src \
            -B third_party/curl-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER="$IOS_CC" \
            -DCMAKE_CXX_COMPILER="$IOS_CXX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_TFTP=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_IMAPS=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_POP3S=ON \
            -DCURL_DISABLE_SMB=ON \
            -DCURL_DISABLE_SMBS=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_DISABLE_SRP=ON \
            -DCURL_ENABLE_NTLM=OFF \
            -DCURL_USE_LIBSSH2=OFF \
            -DCURL_USE_GSSAPI=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_LIBIDN2=OFF \
            -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF \
            -DCURL_ZLIB=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/source" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_INC" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_SSL" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_CRYPTO"

          cmake \
            --build third_party/curl-build \
            --parallel

          CURL_A="$(
            find third_party/curl-build \
              -type f \
              -name "libcurl*.a" \
              -print \
              -quit
          )"

          test -n "$CURL_A"
          test -f "$CURL_A"

          echo "CURL_A=$GITHUB_WORKSPACE/$CURL_A" >> "$GITHUB_ENV"

          echo "curl:"
          file "$CURL_A"

          lipo -info "$CURL_A" || true

      # ----------------------------------------------------------
      # Build ldid
      # ----------------------------------------------------------

      - name: Build ldid for iOS arm64
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build/ios

          test -f "$OPENSSL_SSL"
          test -f "$OPENSSL_CRYPTO"
          test -f "$PLIST_A"
          test -f "$LIBARCHIVE_A"
          test -f "$CURL_A"

          "$IOS_CXX" \
            -std=c++20 \
            -arch arm64 \
            -isysroot "$IOS_SDK_DIR" \
            -miphoneos-version-min="$IOS_DEPLOYMENT_TARGET" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"$OPENSSL_INC" \
            -I"$PLIST_INC" \
            -Ithird_party/curl-src/include \
            -Ithird_party/libarchive-src/libarchive \
            source/ldid.cpp \
            "$OPENSSL_SSL" \
            "$OPENSSL_CRYPTO" \
            "$PLIST_A" \
            "$LIBARCHIVE_A" \
            "$CURL_A" \
            -framework Security \
            -framework CoreFoundation \
            -lz \
            -lc++ \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ios/ldid

      # ----------------------------------------------------------
      # Verify binary
      # ----------------------------------------------------------

      - name: Validate iOS binary
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/ios/ldid

          echo "========================================"
          echo "file"
          echo "========================================"

          file build/ios/ldid

          echo "========================================"
          echo "lipo"
          echo "========================================"

          lipo -info build/ios/ldid

          echo "========================================"
          echo "Mach-O header"
          echo "========================================"

          otool -hv build/ios/ldid

          echo "========================================"
          echo "Load commands"
          echo "========================================"

          otool -l build/ios/ldid \
            | grep -A6 \
              -E "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS" \
            || true

          echo "========================================"
          echo "Dependencies"
          echo "========================================"

          otool -L build/ios/ldid || true

          echo "========================================"
          echo "ldid version"
          echo "========================================"

          build/ios/ldid --version

      # ----------------------------------------------------------
      # Strip
      #
      # Do this BEFORE optional codesign.
      # Do not relink the binary here.
      # ----------------------------------------------------------

      - name: Strip iOS binary
        shell: bash
        run: |
          set -euxo pipefail

          strip \
            -S \
            build/ios/ldid

          file build/ios/ldid

          lipo -info build/ios/ldid

      # ----------------------------------------------------------
      # Ad-hoc sign
      # ----------------------------------------------------------

      - name: Ad-hoc sign iOS binary
        shell: bash
        run: |
          set -euxo pipefail

          if command -v codesign >/dev/null 2>&1; then

            codesign \
              --force \
              --sign - \
              --timestamp=none \
              build/ios/ldid

            codesign \
              --verify \
              --verbose \
              build/ios/ldid

          else

            echo "codesign unavailable; skipping."

          fi

      # ----------------------------------------------------------
      # Final validation
      # ----------------------------------------------------------

      - name: Final iOS validation
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/ios/ldid

          echo "========================================"
          echo "Final binary"
          echo "========================================"

          file build/ios/ldid

          echo "========================================"
          echo "Architecture"
          echo "========================================"

          lipo -info build/ios/ldid

          echo "========================================"
          echo "Size"
          echo "========================================"

          ls -lh build/ios/ldid

      # ----------------------------------------------------------
      # Package
      # ----------------------------------------------------------

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf release

          mkdir -p release

          cp \
            build/ios/ldid \
            release/ldid

          tar \
            -C release \
            -czf release/ldid-ios-arm64.tar.gz \
            ldid

          shasum \
            -a 256 \
            release/ldid-ios-arm64.tar.gz \
            > release/ldid-ios-arm64.tar.gz.sha256

          echo "========================================"
          echo "Release"
          echo "========================================"

          ls -lh release

          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cat release/ldid-ios-arm64.tar.gz.sha256

      # ----------------------------------------------------------
      # Upload ONLY iOS artifact
      # ----------------------------------------------------------

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64.tar.gz
            release/ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
