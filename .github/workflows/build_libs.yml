name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  CURL_VERSION: "8.16.0"

jobs:

  # ============================================================
  # macOS
  # ============================================================

  macos:
    name: macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew update

          brew install \
            openssl@3 \
            libplist \
            libarchive \
            curl

      - name: Extract ldid.zip
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_lib
          test -d source/openssl_include

          test -d source/libplist_lib
          test -d source/libplist_include

      - name: Build macOS ldid
        run: |
          set -euo pipefail

          OPENSSL="$(brew --prefix openssl@3)"
          PLIST="$(brew --prefix libplist)"
          ARCHIVE="$(brew --prefix libarchive)"
          CURL="$(brew --prefix curl)"

          mkdir -p build/macos

          clang++ \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL}/include" \
            -I"${PLIST}/include" \
            -I"${ARCHIVE}/include" \
            -I"${CURL}/include" \
            source/ldid.cpp \
            -L"${OPENSSL}/lib" \
            -L"${PLIST}/lib" \
            -L"${ARCHIVE}/lib" \
            -L"${CURL}/lib" \
            -lcrypto \
            -lssl \
            -lplist-2.0 \
            -larchive \
            -lcurl \
            -framework Security \
            -framework CoreFoundation \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/macos/ldid

          file build/macos/ldid

          ./build/macos/ldid --version

  # ============================================================
  # iOS
  # ============================================================

  ios:
    name: iOS arm64
    runs-on: macos-14

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Extract user's ldid.zip
      # --------------------------------------------------------

      - name: Extract ldid.zip
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_lib
          test -d source/openssl_include

          test -d source/libplist_lib
          test -d source/libplist_include

          echo "===== source ====="
          find source -maxdepth 2 -type f -print

      # --------------------------------------------------------
      # Apple toolchain
      # --------------------------------------------------------

      - name: Configure Apple toolchain
        run: |
          set -euo pipefail

          CLANG="$(xcrun --sdk iphoneos --find clang)"
          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          AR="$(xcrun --sdk iphoneos --find ar)"
          RANLIB="$(xcrun --sdk iphoneos --find ranlib)"
          STRIP="$(xcrun --sdk iphoneos --find strip)"
          LD="$(xcrun --sdk iphoneos --find ld)"

          echo "CLANG=${CLANG}" >> "${GITHUB_ENV}"
          echo "CLANGXX=${CLANGXX}" >> "${GITHUB_ENV}"
          echo "AR=${AR}" >> "${GITHUB_ENV}"
          echo "RANLIB=${RANLIB}" >> "${GITHUB_ENV}"
          echo "STRIP=${STRIP}" >> "${GITHUB_ENV}"
          echo "LD=${LD}" >> "${GITHUB_ENV}"

          "${CLANG}" --version
          "${CLANGXX}" --version

      # --------------------------------------------------------
      # iPhoneOS 16.5 SDK
      # --------------------------------------------------------

      - name: Download iPhoneOS 16.5 SDK
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphone-sdk"

          rm -rf "${SDK_ROOT}"

          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${SDK_DIR}"
          test -d "${SDK_DIR}"

          echo "SDK_DIR=${SDK_DIR}" >> "${GITHUB_ENV}"

          echo "Using SDK:"
          echo "${SDK_DIR}"

      # --------------------------------------------------------
      # Download libarchive
      # --------------------------------------------------------

      - name: Download libarchive
        run: |
          set -euo pipefail

          rm -rf third_party

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o "${RUNNER_TEMP}/libarchive.tar.xz" \
            "https://www.libarchive.org/downloads/libarchive-${LIBARCHIVE_VERSION}.tar.xz"

          tar \
            -xJf "${RUNNER_TEMP}/libarchive.tar.xz" \
            -C third_party

          test -d \
            "third_party/libarchive-${LIBARCHIVE_VERSION}"

          mv \
            "third_party/libarchive-${LIBARCHIVE_VERSION}" \
            third_party/libarchive

          test -f third_party/libarchive/CMakeLists.txt

      # --------------------------------------------------------
      # Build libarchive using Xcode
      #
      # Important:
      # We deliberately use Xcode generator here instead of Ninja.
      # --------------------------------------------------------

      - name: Configure libarchive Xcode project
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive-xcode

          cmake \
            -S third_party/libarchive \
            -B third_party/libarchive-xcode \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${CLANG}" \
            -DCMAKE_CXX_COMPILER="${CLANGXX}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_INSTALL=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            -DENABLE_ACL=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_CNG=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_LIBB2=OFF

      - name: Build libarchive with Xcode
        run: |
          set -euo pipefail

          if ! xcodebuild \
            -project third_party/libarchive-xcode/libarchive.xcodeproj \
            -configuration Release \
            -sdk "${SDK_DIR}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          then
            echo "::error::libarchive Xcode build failed"

            echo "===== libarchive build files ====="

            find third_party/libarchive-xcode \
              -type f \
              | tail -100 \
              || true

            exit 1
          fi

      # --------------------------------------------------------
      # Find libarchive.a
      # --------------------------------------------------------

      - name: Find libarchive
        run: |
          set -euo pipefail

          LIBARCHIVE_A="$(
            find third_party/libarchive-xcode \
              -type f \
              -name 'libarchive.a' \
              -print \
              | head -1
          )"

          if [ -z "${LIBARCHIVE_A}" ]; then
            echo "::error::libarchive.a not found"

            find third_party/libarchive-xcode \
              -type f \
              -name '*.a' \
              -print \
              || true

            exit 1
          fi

          test -f "${LIBARCHIVE_A}"

          echo "LIBARCHIVE_A=${LIBARCHIVE_A}" >> "${GITHUB_ENV}"

          file "${LIBARCHIVE_A}"

      # --------------------------------------------------------
      # Download curl
      # --------------------------------------------------------

      - name: Download curl
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o "${RUNNER_TEMP}/curl.tar.xz" \
            "https://github.com/curl/curl/releases/download/curl-8_16_0/curl-8.16.0.tar.xz"

          mkdir -p third_party/curl

          tar \
            -xJf "${RUNNER_TEMP}/curl.tar.xz" \
            -C third_party/curl \
            --strip-components=1

          test -f third_party/curl/CMakeLists.txt

      # --------------------------------------------------------
      # curl
      #
      # Keep curl CMake simple.
      #
      # No:
      #   -C .github/curl-ios-cache.cmake
      #
      # No hand-written HAVE_ATOMIC cache.
      #
      # _CURL_PREFILL is curl's own mechanism.
      # --------------------------------------------------------

      - name: Configure curl
        run: |
          set -euo pipefail

          rm -rf third_party/curl-build

          OPENSSL_ROOT="${GITHUB_WORKSPACE}/source"

          cmake \
            -S third_party/curl \
            -B third_party/curl-build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${CLANG}" \
            -DCMAKE_CXX_COMPILER="${CLANGXX}" \
            -D_CURL_PREFILL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_LIBCURL_DOCS=OFF \
            -DBUILD_MISC_DOCS=OFF \
            -DENABLE_CURL_MANUAL=OFF \
            -DCURL_BUILD_EVERYTHING=OFF \
            -DCURL_DISABLE_INSTALL=ON \
            -DCURL_DISABLE_NTLM=ON \
            -DENABLE_THREADED_RESOLVER=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}" \
            -DOPENSSL_INCLUDE_DIR="${OPENSSL_ROOT}/openssl_include" \
            -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_ROOT}/openssl_lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="${OPENSSL_ROOT}/openssl_lib/libssl.a"

      - name: Build curl with Xcode
        run: |
          set -euo pipefail

          if ! xcodebuild \
            -project third_party/curl-build/curl.xcodeproj \
            -configuration Release \
            -sdk "${SDK_DIR}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          then
            echo "::error::curl Xcode build failed"

            echo "===== curl CMake errors ====="

            find third_party/curl-build \
              -type f \
              \( \
                -name CMakeError.log \
                -o \
                -name CMakeOutput.log \
              \) \
              -print \
              -exec tail -n 400 {} \; \
              || true

            exit 1
          fi

      # --------------------------------------------------------
      # Find curl
      # --------------------------------------------------------

      - name: Find curl
        run: |
          set -euo pipefail

          CURL_A="$(
            find third_party/curl-build \
              -type f \
              -name 'libcurl.a' \
              -print \
              | head -1
          )"

          if [ -z "${CURL_A}" ]; then
            echo "::error::libcurl.a not found"

            find third_party/curl-build \
              -type f \
              -name '*.a' \
              -print \
              || true

            exit 1
          fi

          test -f "${CURL_A}"

          echo "CURL_A=${CURL_A}" >> "${GITHUB_ENV}"

          file "${CURL_A}"

      # --------------------------------------------------------
      # Final ldid
      # --------------------------------------------------------

      - name: Build ldid
        run: |
          set -euo pipefail

          rm -rf build/ios
          mkdir -p build/ios

          OPENSSL_INCLUDE="${GITHUB_WORKSPACE}/source/openssl_include"
          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"

          PLIST_INCLUDE="${GITHUB_WORKSPACE}/source/libplist_include"
          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"

          test -f "${OPENSSL_LIB}/libcrypto.a"
          test -f "${OPENSSL_LIB}/libssl.a"

          test -f "${PLIST_LIB}/libplist-2.0.a"
          test -f "${LIBARCHIVE_A}"
          test -f "${CURL_A}"

          "${CLANGXX}" \
            -std=c++20 \
            -arch arm64 \
            -isysroot "${SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_INCLUDE}" \
            -I"${PLIST_INCLUDE}" \
            source/ldid.cpp \
            "${LIBARCHIVE_A}" \
            "${CURL_A}" \
            "${PLIST_LIB}/libplist-2.0.a" \
            "${OPENSSL_LIB}/libssl.a" \
            "${OPENSSL_LIB}/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -lz \
            -lc++ \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ios/ldid

      # --------------------------------------------------------
      # Validate
      # --------------------------------------------------------

      - name: Validate iOS binary
        run: |
          set -euo pipefail

          test -f build/ios/ldid

          echo "===== file ====="
          file build/ios/ldid

          echo "===== architecture ====="
          xcrun lipo -info build/ios/ldid

          echo "===== Mach-O ====="
          xcrun otool \
            -arch arm64 \
            -l \
            build/ios/ldid \
            | grep -E \
              'LC_BUILD_VERSION|platform|minos|sdk' \
            || true

          echo "===== dependencies ====="
          xcrun otool \
            -arch arm64 \
            -L \
            build/ios/ldid

      # --------------------------------------------------------
      # Strip
      # --------------------------------------------------------

      - name: Strip
        run: |
          set -euo pipefail

          "${STRIP}" \
            -S \
            -x \
            build/ios/ldid

          file build/ios/ldid

          xcrun lipo -info build/ios/ldid

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          tar \
            -C build/ios \
            -czf release/ldid-ios-arm64.tar.gz \
            ldid

          shasum \
            -a 256 \
            release/ldid-ios-arm64.tar.gz \
            > release/ldid-ios-arm64.tar.gz.sha256

          ls -lh release

          cat release/ldid-ios-arm64.tar.gz.sha256

      # --------------------------------------------------------
      # Upload ONLY iOS
      # --------------------------------------------------------

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64.tar.gz
            release/ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
