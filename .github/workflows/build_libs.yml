name: Build ldid

on:
  workflow_dispatch:
  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"
  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  CURL_VERSION: "8.16.0"

  BUILD_TYPE: Release

jobs:
  macos:
    name: macOS build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew update
          brew install \
            openssl@3 \
            libplist \
            libarchive \
            curl

      - name: Extract ldid source
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "Source tree:"
          find source -maxdepth 2 -type f -print

      - name: Build ldid
        run: |
          set -euo pipefail

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          PLIST_PREFIX="$(brew --prefix libplist)"
          ARCHIVE_PREFIX="$(brew --prefix libarchive)"
          CURL_PREFIX="$(brew --prefix curl)"

          mkdir -p build/macos

          clang++ \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_PREFIX}/include" \
            -I"${PLIST_PREFIX}/include" \
            -I"${ARCHIVE_PREFIX}/include" \
            -I"${CURL_PREFIX}/include" \
            source/ldid.cpp \
            -L"${OPENSSL_PREFIX}/lib" \
            -L"${PLIST_PREFIX}/lib" \
            -L"${ARCHIVE_PREFIX}/lib" \
            -L"${CURL_PREFIX}/lib" \
            -lcrypto \
            -lssl \
            -lplist-2.0 \
            -larchive \
            -lcurl \
            -framework Security \
            -framework CoreFoundation \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/macos/ldid

      - name: macOS smoke test
        run: |
          set -euo pipefail

          ./build/macos/ldid --version

          mkdir -p /tmp/ldid-smoke
          printf 'ldid smoke test\n' > /tmp/ldid-smoke/test.txt

          ./build/macos/ldid -A /tmp/ldid-smoke/test.txt \
            || true

          file build/macos/ldid
          otool -L build/macos/ldid

  ios:
    name: iOS arm64 build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ldid source
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "Extracted source:"
          find source -maxdepth 2 -type f -print

      - name: Validate bundled dependencies
        run: |
          set -euo pipefail

          test -d source/openssl_lib
          test -d source/openssl_include
          test -d source/libplist_lib
          test -d source/libplist_include

          echo "OpenSSL:"
          find source/openssl_lib -maxdepth 2 -type f -print

          echo "OpenSSL headers:"
          find source/openssl_include -maxdepth 2 -type f | head -50

          echo "libplist:"
          find source/libplist_lib -maxdepth 2 -type f -print

          echo "libplist headers:"
          find source/libplist_include -maxdepth 2 -type f | head -50

      - name: Download iPhoneOS 16.5 SDK
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/ios-sdk"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o "${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz" \
            "${IOS_SDK_URL}"

          tar -xJf \
            "${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz" \
            -C "${RUNNER_TEMP}/ios-sdk"

          IOS_SDK_DIR="$(find "${RUNNER_TEMP}/ios-sdk" -type d -name 'iPhoneOS16.5.sdk' -print -quit)"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --show-sdk-version

          echo "Using SDK:"
          echo "${IOS_SDK_DIR}"

      - name: Prepare build environment
        run: |
          set -euo pipefail

          export SDKROOT="${IOS_SDK_DIR}"

          IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          IOS_AR="$(xcrun --sdk iphoneos --find ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos --find ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos --find strip)"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "CC=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "CXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"

      - name: Build libarchive for iOS
        run: |
          set -euo pipefail

          rm -rf \
            third_party/libarchive-build \
            third_party/libarchive-install

          mkdir -p \
            third_party/libarchive-build \
            third_party/libarchive-install

          cmake \
            -S third_party/libarchive-src \
            -B third_party/libarchive-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${IOS_CLANG}" \
            -DCMAKE_CXX_COMPILER="${IOS_CLANGXX}" \
            -DCMAKE_AR="${IOS_AR}" \
            -DCMAKE_RANLIB="${IOS_RANLIB}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/third_party/libarchive-install" \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_INSTALL=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ACL=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_CNG=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_LIBB2=OFF

          if ! cmake \
            --build third_party/libarchive-build \
            --parallel \
            --verbose
          then
            echo "::error::libarchive build failed"

            find third_party/libarchive-build/CMakeFiles \
              -type f \
              \( -name CMakeError.log -o -name CMakeOutput.log \) \
              -print \
              -exec tail -n 400 {} \; \
              || true

            exit 1
          fi

      - name: Locate libarchive
        run: |
          set -euo pipefail

          LIBARCHIVE_STATIC="$(
            find third_party/libarchive-build \
              -type f \
              \( -name 'libarchive.a' -o -name 'libarchive_static.a' \) \
              -print \
              | head -1
          )"

          test -n "${LIBARCHIVE_STATIC}"
          test -f "${LIBARCHIVE_STATIC}"

          echo "LIBARCHIVE_STATIC=${LIBARCHIVE_STATIC}" >> "${GITHUB_ENV}"

          file "${LIBARCHIVE_STATIC}"

      - name: Build curl 8.16.0 for iOS
        run: |
          set -euo pipefail

          rm -rf \
            third_party/curl-build \
            third_party/curl-install

          mkdir -p \
            third_party/curl-build \
            third_party/curl-install

          OPENSSL_ROOT="${GITHUB_WORKSPACE}/source"

          test -d "${OPENSSL_ROOT}/openssl_lib"
          test -d "${OPENSSL_ROOT}/openssl_include"

          cmake \
            -S third_party/curl-src \
            -B third_party/curl-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${IOS_CLANG}" \
            -DCMAKE_CXX_COMPILER="${IOS_CLANGXX}" \
            -DCMAKE_AR="${IOS_AR}" \
            -DCMAKE_RANLIB="${IOS_RANLIB}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/third_party/curl-install" \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=EXECUTABLE \
            -D_CURL_PREFILL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_LIBCURL_DOCS=OFF \
            -DBUILD_MISC_DOCS=OFF \
            -DENABLE_CURL_MANUAL=OFF \
            -DCURL_BUILD_EVERYTHING=OFF \
            -DCURL_DISABLE_INSTALL=ON \
            -DCURL_DISABLE_NTLM=ON \
            -DENABLE_THREADED_RESOLVER=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}" \
            -DOPENSSL_INCLUDE_DIR="${OPENSSL_ROOT}/openssl_include" \
            -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_ROOT}/openssl_lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="${OPENSSL_ROOT}/openssl_lib/libssl.a" \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_FILE=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_IMAPS=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_POP3S=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_SMB=ON \
            -DCURL_DISABLE_SMBS=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_SMTPS=ON \
            -DCURL_DISABLE_TFTP=ON \
            -DCURL_DISABLE_WS=ON \
            -DCURL_DISABLE_WSS=ON

          if ! cmake \
            --build third_party/curl-build \
            --parallel \
            --verbose
          then
            echo "::error::curl 8.16.0 build failed"

            echo "===== CMake errors ====="
            find third_party/curl-build \
              -type f \
              \( -name CMakeError.log -o -name CMakeOutput.log \) \
              -print \
              -exec tail -n 500 {} \; \
              || true

            echo "===== Last CMake files ====="
            find third_party/curl-build/CMakeFiles \
              -maxdepth 3 \
              -type f \
              -print \
              | sort \
              | tail -100 \
              || true

            exit 1
          fi

      - name: Locate curl
        run: |
          set -euo pipefail

          CURL_STATIC="$(
            find third_party/curl-build \
              -type f \
              -name 'libcurl.a' \
              -print \
              | head -1
          )"

          test -n "${CURL_STATIC}"
          test -f "${CURL_STATIC}"

          echo "CURL_STATIC=${CURL_STATIC}" >> "${GITHUB_ENV}"

          file "${CURL_STATIC}"

      - name: Build ldid for iOS arm64
        run: |
          set -euo pipefail

          rm -rf build/ios
          mkdir -p build/ios

          IOS_CXX="${IOS_CLANGXX}"

          OPENSSL_INCLUDE="${GITHUB_WORKSPACE}/source/openssl_include"
          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"

          PLIST_INCLUDE="${GITHUB_WORKSPACE}/source/libplist_include"
          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"

          test -d "${OPENSSL_INCLUDE}"
          test -d "${OPENSSL_LIB}"
          test -d "${PLIST_INCLUDE}"
          test -d "${PLIST_LIB}"
          test -f "${LIBARCHIVE_STATIC}"
          test -f "${CURL_STATIC}"

          "${IOS_CXX}" \
            -std=c++20 \
            -arch arm64 \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_INCLUDE}" \
            -I"${PLIST_INCLUDE}" \
            source/ldid.cpp \
            "${LIBARCHIVE_STATIC}" \
            "${CURL_STATIC}" \
            "${PLIST_LIB}/libplist-2.0.a" \
            "${OPENSSL_LIB}/libssl.a" \
            "${OPENSSL_LIB}/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -lz \
            -licucore \
            -lbz2 \
            -llzma \
            -lc++ \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ios/ldid

      - name: Validate iOS binary
        run: |
          set -euo pipefail

          test -f build/ios/ldid

          file build/ios/ldid

          xcrun lipo -info build/ios/ldid

          xcrun otool -arch arm64 -l build/ios/ldid | \
            grep -E \
              'LC_BUILD_VERSION|platform|minos|sdk' \
              || true

          xcrun otool -arch arm64 -L build/ios/ldid

          ./build/ios/ldid --version \
            || true

      - name: Strip iOS binary
        run: |
          set -euo pipefail

          cp build/ios/ldid build/ios/ldid.stripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ios/ldid.stripped

          mv \
            build/ios/ldid.stripped \
            build/ios/ldid

          file build/ios/ldid
          xcrun lipo -info build/ios/ldid

      - name: Package iOS artifact
        run: |
          set -euo pipefail

          mkdir -p release

          tar \
            -C build/ios \
            -czf release/ldid-ios-arm64.tar.gz \
            ldid

          shasum -a 256 \
            release/ldid-ios-arm64.tar.gz \
            > release/ldid-ios-arm64.tar.gz.sha256

          echo "===== Artifact ====="
          ls -lh release/

          cat release/ldid-ios-arm64.tar.gz.sha256

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64.tar.gz
            release/ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
