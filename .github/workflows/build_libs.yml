name: Build TrollStore Rust for iOS (From Zip)

on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Extract entire project
        run: |
          unzip -o TrollStore.zip -d ./project
          # 确保资源目录存在且权限正确
          mkdir -p ./project/resources
          chmod +x ./project/resources/ldid ./project/resources/RootHelper ./project/resources/TrollHelper ./project/resources/fastPathSign 2>/dev/null || true

      - name: Setup Cargo config
        working-directory: ./project
        run: |
          mkdir -p .cargo
          cat << 'EOF' > .cargo/config.toml
          [target.aarch64-apple-ios]
          linker = "cc"
          rustflags = ["-C", "link-args=-arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=14.0"]
          EOF

      - name: Build for iOS (arm64)
        working-directory: ./project
        run: cargo build --release --target aarch64-apple-ios

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: trollstore-rs-ios-binary
          path: project/target/aarch64-apple-ios/release/trollstore-rs
