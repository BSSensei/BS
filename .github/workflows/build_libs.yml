name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "16.0"
  IOS_SDK_VERSION: "16.5"

  THEOS_REPO: "https://github.com/theos/theos.git"
  THEOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  OPENSSL_URL: "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip"

  CURL_URL: "https://github.com/XDcobra/libcurl-ios-prebuilt-and-buildscripts/releases/download/curl-8_17_0/libcurl_artifact.zip"

  LIBARCHIVE_REPO: "https://github.com/okferret/libarchive.git"

jobs:
  build-ios-arm64:
    name: iOS arm64 / Theos / iOS 16.5
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Host"
          echo "=================================================="

          sw_vers
          xcodebuild -version
          xcode-select -p
          clang --version
          make --version | head -n 1

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q ldid.zip -d source

          test -f source/ldid.cpp
          test -f source/ldid.hpp
          test -d source/libplist_include
          test -d source/libplist_lib

          echo "=================================================="
          echo "Source"
          echo "=================================================="

          find source -maxdepth 2 -type f -print | sort

      - name: Setup Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="${GITHUB_WORKSPACE}/theos"

          rm -rf "${THEOS}"

          git clone \
            --depth 1 \
            "${THEOS_REPO}" \
            "${THEOS}"

          test -f "${THEOS}/makefiles/common.mk"
          test -x "${THEOS}/bin/update-theos"

          echo "=================================================="
          echo "Initialize Theos"
          echo "=================================================="

          "${THEOS}/bin/update-theos"

          test -d "${THEOS}/vendor"
          test -d "${THEOS}/vendor/include"
          test -d "${THEOS}/vendor/lib"

          echo "THEOS=${THEOS}" >> "${GITHUB_ENV}"

          echo
          echo "=================================================="
          echo "Theos"
          echo "=================================================="

          git -C "${THEOS}" rev-parse --short HEAD

      - name: Install Theos iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${THEOS}/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"

          rm -rf "${SDK_DIR}"

          mkdir -p "${THEOS}/sdks"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            "${THEOS_SDK_URL}" \
            --output /tmp/iPhoneOS16.5.sdk.tar.xz

          tar \
            -xJf /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "${THEOS}/sdks"

          test -d "${SDK_DIR}"
          test -f "${SDK_DIR}/SDKSettings.plist"

          echo "=================================================="
          echo "Theos SDK"
          echo "=================================================="

          echo "SDK: ${SDK_DIR}"

          /usr/libexec/PlistBuddy \
            -c "Print :Version" \
            "${SDK_DIR}/SDKSettings.plist" || true

      - name: Download prebuilt OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/openssl
          mkdir -p third_party/openssl

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            "${OPENSSL_URL}" \
            --output /tmp/OpenSSL.xcframework.zip

          unzip \
            -q \
            -o \
            /tmp/OpenSSL.xcframework.zip \
            -d third_party/openssl

          test -d third_party/openssl/OpenSSL.xcframework

          echo "=================================================="
          echo "OpenSSL"
          echo "=================================================="

          find \
            third_party/openssl/OpenSSL.xcframework \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

      - name: Prepare OpenSSL arm64
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_ROOT="${GITHUB_WORKSPACE}/third_party/openssl/OpenSSL.xcframework"
          OPENSSL_SLICE="${OPENSSL_ROOT}/ios-arm64"

          test -d "${OPENSSL_SLICE}"

          rm -rf third_party/openssl-ios

          mkdir -p \
            third_party/openssl-ios/include \
            third_party/openssl-ios/lib

          #
          # Current OpenSSL.xcframework layout:
          #
          # ios-arm64/
          #   OpenSSL.framework/
          #     Headers/
          #     OpenSSL
          #
          # Some releases instead expose Headers + *.a.
          #

          if [ -d "${OPENSSL_SLICE}/OpenSSL.framework/Headers" ]; then
            cp -R \
              "${OPENSSL_SLICE}/OpenSSL.framework/Headers/." \
              third_party/openssl-ios/include/
          elif [ -d "${OPENSSL_SLICE}/Headers" ]; then
            cp -R \
              "${OPENSSL_SLICE}/Headers/." \
              third_party/openssl-ios/include/
          else
            echo "ERROR: OpenSSL headers not found"
            exit 1
          fi

          if [ -f "${OPENSSL_SLICE}/libssl.a" ]; then
            cp \
              "${OPENSSL_SLICE}/libssl.a" \
              third_party/openssl-ios/lib/libssl.a
          fi

          if [ -f "${OPENSSL_SLICE}/libcrypto.a" ]; then
            cp \
              "${OPENSSL_SLICE}/libcrypto.a" \
              third_party/openssl-ios/lib/libcrypto.a
          fi

          #
          # OpenSSL-Universal releases may provide a single
          # OpenSSL.framework binary containing both ssl/crypto.
          #
          if [ -f "${OPENSSL_SLICE}/OpenSSL.framework/OpenSSL" ]; then
            cp \
              "${OPENSSL_SLICE}/OpenSSL.framework/OpenSSL" \
              third_party/openssl-ios/lib/libopenssl-framework.a

            #
            # The framework binary is not automatically treated as
            # libssl/libcrypto. Keep it separately for inspection.
            #
            mkdir -p third_party/openssl-ios/framework

            cp -R \
              "${OPENSSL_SLICE}/OpenSSL.framework/." \
              third_party/openssl-ios/framework/
          fi

          echo "=================================================="
          echo "OpenSSL arm64 files"
          echo "=================================================="

          find \
            third_party/openssl-ios \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

          #
          # The libcurl OpenSSL build needs these symbols from
          # libssl/libcrypto. Fail early instead of producing a
          # confusing linker error later.
          #
          if [ ! -f third_party/openssl-ios/lib/libssl.a ] || \
             [ ! -f third_party/openssl-ios/lib/libcrypto.a ]; then
            echo
            echo "ERROR: This OpenSSL XCFramework does not expose"
            echo "libssl.a and libcrypto.a as separate static libraries."
            echo
            echo "The selected libcurl artifact requires the matching"
            echo "OpenSSL static libraries."
            exit 1
          fi

          file \
            third_party/openssl-ios/lib/libssl.a \
            third_party/openssl-ios/lib/libcrypto.a

      - name: Download prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl
          mkdir -p third_party/curl

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            "${CURL_URL}" \
            --output /tmp/libcurl_artifact.zip

          unzip \
            -q \
            -o \
            /tmp/libcurl_artifact.zip \
            -d third_party/curl

          echo "=================================================="
          echo "libcurl artifact"
          echo "=================================================="

          find \
            third_party/curl \
            -maxdepth 8 \
            -type f \
            -print \
            | sort

      - name: Prepare libcurl arm64
        shell: bash
        run: |
          set -euo pipefail

          CURL_ROOT="${GITHUB_WORKSPACE}/third_party/curl"

          rm -rf third_party/curl-ios

          mkdir -p \
            third_party/curl-ios/include \
            third_party/curl-ios/lib

          CURL_LIB="$(find "${CURL_ROOT}" \
            -type f \
            -path "*/ios-arm64/*" \
            -name "libcurl.a" \
            -print \
            | head -n 1)"

          if [ -z "${CURL_LIB}" ]; then
            CURL_LIB="$(find "${CURL_ROOT}" \
              -type f \
              -name "libcurl.a" \
              -print \
              | head -n 1)"
          fi

          if [ -z "${CURL_LIB}" ]; then
            echo "ERROR: libcurl.a not found"
            exit 1
          fi

          cp \
            "${CURL_LIB}" \
            third_party/curl-ios/lib/libcurl.a

          CURL_HEADER="$(find "${CURL_ROOT}" \
            -type f \
            -name "curl.h" \
            -print \
            | head -n 1)"

          if [ -z "${CURL_HEADER}" ]; then
            echo "ERROR: curl.h not found"
            exit 1
          fi

          CURL_INCLUDE_ROOT="$(dirname "$(dirname "${CURL_HEADER}")")"

          if [ -d "${CURL_INCLUDE_ROOT}/curl" ]; then
            cp -R \
              "${CURL_INCLUDE_ROOT}/curl" \
              third_party/curl-ios/include/
          else
            echo "ERROR: curl include directory not found"
            exit 1
          fi

          test -f third_party/curl-ios/include/curl/curl.h

          echo "=================================================="
          echo "libcurl arm64"
          echo "=================================================="

          file third_party/curl-ios/lib/libcurl.a

      - name: Verify libcurl OpenSSL ABI
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "libcurl OpenSSL ABI"
          echo "=================================================="

          echo "OpenSSL libraries:"
          file \
            third_party/openssl-ios/lib/libssl.a \
            third_party/openssl-ios/lib/libcrypto.a

          echo
          echo "libcurl unresolved OpenSSL references:"

          nm -u \
            third_party/curl-ios/lib/libcurl.a \
            2>/dev/null \
            | grep -E \
              "SSL_|OPENSSL_|UI_OpenSSL" \
            | sort -u \
            | head -n 100 \
            || true

      - name: Get prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive

          git clone \
            --depth 1 \
            "${LIBARCHIVE_REPO}" \
            third_party/libarchive

          ARCHIVE_ROOT="third_party/libarchive/libarchive-apple-build/libArchive.xcframework/ios-arm64"

          test -f "${ARCHIVE_ROOT}/libarchive.a"
          test -d "${ARCHIVE_ROOT}/Headers"

          rm -rf third_party/libarchive-ios

          mkdir -p \
            third_party/libarchive-ios/lib \
            third_party/libarchive-ios/include

          cp \
            "${ARCHIVE_ROOT}/libarchive.a" \
            third_party/libarchive-ios/lib/libarchive.a

          cp -R \
            "${ARCHIVE_ROOT}/Headers/." \
            third_party/libarchive-ios/include/

          echo "=================================================="
          echo "libarchive arm64"
          echo "=================================================="

          file third_party/libarchive-ios/lib/libarchive.a

      - name: Verify dependency architectures
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Dependency architectures"
          echo "=================================================="

          file \
            third_party/openssl-ios/lib/libssl.a \
            third_party/openssl-ios/lib/libcrypto.a \
            third_party/curl-ios/lib/libcurl.a \
            third_party/libarchive-ios/lib/libarchive.a

      - name: Prepare Theos project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf theos-build
          mkdir -p theos-build

          cp \
            source/ldid.cpp \
            source/ldid.hpp \
            theos-build/

          cp -R \
            source/libplist_include \
            theos-build/libplist_include

          cp -R \
            source/libplist_lib \
            theos-build/libplist_lib

          cat > theos-build/Makefile <<'EOF'
          THEOS ?= $(CURDIR)/../theos

          TARGET := iphone:clang:16.5:16.0
          ARCHS := arm64

          TOOL_NAME := ldid

          ldid_FILES := ldid.cpp

          ldid_CXXFLAGS := \
              -std=c++20 \
              -O3 \
              -DNDEBUG \
              -flto=thin \
              -ffunction-sections \
              -fdata-sections \
              -fvisibility=hidden \
              -fstrict-aliasing \
              -Wall \
              -Wextra \
              -Wpedantic \
              -Werror

          ldid_CPPFLAGS := \
              -I$(CURDIR)/libplist_include \
              -I$(CURDIR)/../third_party/openssl-ios/include \
              -I$(CURDIR)/../third_party/curl-ios/include \
              -I$(CURDIR)/../third_party/libarchive-ios/include

          ldid_LDFLAGS := \
              -L$(CURDIR)/../third_party/curl-ios/lib \
              -L$(CURDIR)/../third_party/libarchive-ios/lib \
              -L$(CURDIR)/../third_party/openssl-ios/lib \
              -L$(CURDIR)/libplist_lib \
              -Wl,-dead_strip \
              -Wl,-no_warn_duplicate_libraries

          ldid_LDLIBS := \
              -lcurl \
              -larchive \
              -lplist \
              -lssl \
              -lcrypto \
              -framework Security \
              -framework CoreFoundation \
              -framework SystemConfiguration \
              -framework CFNetwork \
              -liconv \
              -lxml2 \
              -lz \
              -lbz2 \
              -lc++

          include $(THEOS)/makefiles/common.mk
          include $(THEOS_MAKE_PATH)/tool.mk
          EOF

          echo "=================================================="
          echo "Theos Makefile"
          echo "=================================================="

          cat theos-build/Makefile

      - name: Build with Theos
        shell: bash
        run: |
          set -euo pipefail

          cd theos-build

          make \
            THEOS="${THEOS}" \
            TARGET="iphone:clang:16.5:16.0" \
            ARCHS="arm64" \
            -j"$(sysctl -n hw.logicalcpu_max)"

          test -f obj/ldid

          mkdir -p "${GITHUB_WORKSPACE}/build"

          cp \
            obj/ldid \
            "${GITHUB_WORKSPACE}/build/ldid"

      - name: Validate binary
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Validate"
          echo "=================================================="

          test -x build/ldid

          file build/ldid

          lipo -info build/ldid

          echo
          echo "Mach-O:"
          xcrun otool -hv build/ldid

          echo
          echo "Undefined symbols:"
          xcrun nm -u build/ldid || true

          echo
          echo "Version:"
          build/ldid --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp \
            build/ldid \
            dist/ldid

          chmod 755 dist/ldid

          cd dist

          zip \
            -9 \
            -q \
            ldid-ios-arm64.zip \
            ldid

          echo "=================================================="
          echo "Artifacts"
          echo "=================================================="

          file ldid
          lipo -info ldid

          echo
          echo "SHA256:"
          shasum -a 256 ldid
          shasum -a 256 ldid-ios-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            dist/ldid
            dist/ldid-ios-arm64.zip
          if-no-files-found: error
          retention-days: 14
