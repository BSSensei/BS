name: Build dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "dylib.zip"
      - ".github/workflows/build_dylib.yml"
  pull_request:
    paths:
      - "dylib.zip"
      - ".github/workflows/build_dylib.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-122e9c7/iPhoneOS16.5.sdk.tar.xz"

jobs:
  build:
    name: Build iOS dylibs
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -e

          test -f dylib.zip

          rm -rf source build package
          mkdir -p source build package

          unzip -q dylib.zip -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f -print

          MAIN_C="$(find source -type f -name 'main.c' -print -quit)"
          MOD_C="$(find source -type f -name 'Mod.c' -print -quit)"

          if [ -z "$MAIN_C" ]; then
            echo "ERROR: main.c not found inside dylib.zip"
            exit 1
          fi

          if [ -z "$MOD_C" ]; then
            echo "ERROR: Mod.c not found inside dylib.zip"
            exit 1
          fi

          cp "$MAIN_C" source/main.c
          cp "$MOD_C" source/Mod.c

          echo "MAIN_C=source/main.c" >> "$GITHUB_ENV"
          echo "MOD_C=source/Mod.c" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        shell: bash
        run: |
          set -e

          SDK_ARCHIVE="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="$RUNNER_TEMP/sdk"

          mkdir -p "$SDK_ROOT"

          curl -L --fail --retry 3 \
            "$IOS_SDK_URL" \
            -o "$SDK_ARCHIVE"

          tar -xf "$SDK_ARCHIVE" -C "$SDK_ROOT"

          SDK_PATH="$(find "$SDK_ROOT" -type d -name 'iPhoneOS*.sdk' -print -quit)"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: iPhoneOS SDK not found"
            find "$SDK_ROOT" -maxdepth 4 -print
            exit 1
          fi

          echo "SDK_PATH=$SDK_PATH" >> "$GITHUB_ENV"

          echo "Using SDK:"
          echo "$SDK_PATH"

      - name: Prepare substrate header
        shell: bash
        run: |
          set -e

          mkdir -p source/include

          cat > source/include/substrate.h <<'EOF'
          #ifndef SUBSTRATE_H
          #define SUBSTRATE_H

          #include <stdint.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          void MSHookFunction(
              void *symbol,
              void *replace,
              void **result
          ) __attribute__((weak_import));

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF

      - name: Syntax check
        shell: bash
        run: |
          set -e

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror=return-type \
            -fsyntax-only \
            "$MAIN_C"

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror=return-type \
            -fsyntax-only \
            "$MOD_C"

      - name: Build HKPerformance.dylib
        shell: bash
        run: |
          set -e

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -O3 \
            -flto \
            -fvisibility=hidden \
            -ffunction-sections \
            -fdata-sections \
            -dynamiclib \
            -Wl,-dead_strip \
            -Wl,-no_adhoc_codesign \
            -install_name @rpath/HKPerformance.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreFoundation \
            "$MAIN_C" \
            -o build/HKPerformance.dylib

      - name: Build HKMod.dylib
        shell: bash
        run: |
          set -e

          clang \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -I"source/include" \
            -fblocks \
            -fobjc-arc \
            -std=c11 \
            -O3 \
            -flto \
            -fvisibility=hidden \
            -ffunction-sections \
            -fdata-sections \
            -dynamiclib \
            -Wl,-dead_strip \
            -Wl,-no_adhoc_codesign \
            -install_name @rpath/HKMod.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreFoundation \
            "$MOD_C" \
            -o build/HKMod.dylib

      - name: Verify binaries
        shell: bash
        run: |
          set -e

          file build/HKPerformance.dylib
          file build/HKMod.dylib

          xcrun --sdk iphoneos lipo \
            -info build/HKPerformance.dylib

          xcrun --sdk iphoneos lipo \
            -info build/HKMod.dylib

      - name: Strip binaries
        shell: bash
        run: |
          set -e

          strip -S build/HKPerformance.dylib
          strip -S build/HKMod.dylib

      - name: Create dylib.zip
        shell: bash
        run: |
          set -e

          rm -rf package
          mkdir -p package

          cp build/HKPerformance.dylib package/
          cp build/HKMod.dylib package/

          rm -f dylib.zip

          (
            cd package
            zip -9 -q ../dylib.zip \
              HKPerformance.dylib \
              HKMod.dylib
          )

          echo "Generated:"
          ls -lh dylib.zip

          echo "Archive:"
          unzip -l dylib.zip

      - name: Upload dylib.zip
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: dylib.zip
          if-no-files-found: error
          retention-days: 30
