name: Build Terminal App (No Xcode)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid

    - name: Prepare environment
      run: |
        mkdir -p TerminalApp
        if [ -f Terminal.zip ]; then
          unzip -q Terminal.zip -d TerminalApp
        else
          echo "Terminal.zip not found, assuming files are in root"
          cp *.swift Info.plist entitlements.plist RootHelper TerminalApp/ 2>/dev/null || true
        fi

    - name: Compile Swift Source Code
      working-directory: ./TerminalApp
      run: |
        export SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        export TARGET="arm64-apple-ios16.5"
        
        # 收集所有 Swift 文件
        SWIFT_FILES=$(find . -name "*.swift")
        
        # 使用 swiftc 直接编译并链接为 iOS 可执行文件
        swiftc -sdk $SDK_PATH -target $TARGET -parse-as-library -module-name Terminal \
          -framework UIKit -framework Foundation \
          $SWIFT_FILES -o Terminal

    - name: Assemble App Bundle
      working-directory: ./TerminalApp
      run: |
        mkdir -p Terminal.app
        cp Terminal Terminal.app/
        cp Info.plist Terminal.app/
        cp RootHelper Terminal.app/
        chmod +x Terminal.app/RootHelper
        
        if [ -f "1.png" ]; then
            cp 1.png Terminal.app/AppIcon.png
        fi
        
        # 转换 Info.plist 为二进制格式 (iOS 要求)
        plutil -convert binary1 Terminal.app/Info.plist

    - name: Sign and Package IPA
      working-directory: ./TerminalApp
      run: |
        # 使用 ldid 注入巨魔所需的 entitlements
        ldid -Sentitlements.plist Terminal.app/Terminal
        ldid -Sentitlements.plist Terminal.app/RootHelper
        
        # 打包为 IPA
        mkdir Payload
        cp -R Terminal.app Payload/
        zip -r Terminal.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Terminal-IPA
        path: TerminalApp/Terminal.ipa
