name: IL2CPP Reverse

on:
  push:
    paths:
      - '逆向.zip'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Extract zip
        run: |
          mkdir -p input
          unzip -o 逆向.zip -d input
          echo "=== 文件列表 ==="
          find input -type f

      - name: Download Il2CppDumper
        run: |
          wget https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip -O dumper.zip
          unzip -o dumper.zip -d dumper
          chmod +x dumper/Il2CppDumper
          ls -la dumper

      - name: Run Il2CppDumper
        run: |
          mkdir -p output
          BIN=$(find input -name "UnityFramework" -type f | head -n 1)
          META=$(find input -name "global-metadata.dat" -type f | head -n 1)
          echo "Binary: $BIN"
          echo "Metadata: $META"
          if [ -z "$BIN" ] || [ -z "$META" ]; then
            echo "❌ 没找到 UnityFramework 或 global-metadata.dat"
            exit 1
          fi
          ./dumper/Il2CppDumper "$BIN" "$META" output
          echo "=== 输出结果 ==="
          ls -la output

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp-dump
          path: output/
