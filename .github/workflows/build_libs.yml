name: 编译 ldid 和 zsign 静态库

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译工具
        run: |
          brew install cmake make git

      - name: 编译所有静态库
        run: |
          chmod +x scripts/build_all.sh
          bash scripts/build_all.sh

      - name: 上传静态库
        uses: actions/upload-artifact@v4
        with:
          name: ios-static-libs
          path: Frameworks/
