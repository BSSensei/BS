name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_REPOSITORY: "okferret/libarchive"

  CURL_REPOSITORY: "XDcobra/libcurl-ios-prebuilt-and-buildscripts"
  CURL_RELEASE: "curl-8_17_0"

  CURL_VERSION: "8.17.0"
  CURL_SOURCE_URL: "https://curl.se/download/curl-8.17.0.tar.xz"

jobs:
  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================================
      # Extract ldid.zip
      # ==========================================================

      - name: Extract ldid
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== SOURCE ====="

          find source \
            -maxdepth 2 \
            -print


      # ==========================================================
      # Download exact iPhoneOS 16.5 SDK
      # ==========================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -e

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== IOS SDK ====="
          echo "${IOS_SDK_DIR}"


      # ==========================================================
      # Configure compiler
      # ==========================================================

      - name: Configure compiler
        shell: bash
        run: |
          set -e

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          "${IOS_CLANGXX}" --version


      # ==========================================================
      # Locate OpenSSL
      # ==========================================================

      - name: Locate OpenSSL
        shell: bash
        run: |
          set -e

          CRYPTO="$(
            find source/openssl_lib \
              -type f \
              -name "libcrypto*.a" \
              -print \
              -quit
          )"

          SSL="$(
            find source/openssl_lib \
              -type f \
              -name "libssl*.a" \
              -print \
              -quit
          )"

          if [ -z "${CRYPTO}" ]; then
            echo "ERROR: libcrypto.a not found."
            find source/openssl_lib -type f -print
            exit 1
          fi

          if [ -z "${SSL}" ]; then
            echo "ERROR: libssl.a not found."
            find source/openssl_lib -type f -print
            exit 1
          fi

          echo "CRYPTO=${GITHUB_WORKSPACE}/${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${GITHUB_WORKSPACE}/${SSL}" >> "${GITHUB_ENV}"

          echo "===== LIBCRYPTO ====="
          echo "${CRYPTO}"

          echo "===== LIBSSL ====="
          echo "${SSL}"


      # ==========================================================
      # Locate libplist
      # ==========================================================

      - name: Locate libplist
        shell: bash
        run: |
          set -e

          PLIST="$(
            find source/libplist_lib \
              -type f \
              -name "libplist*.a" \
              -print \
              -quit
          )"

          if [ -z "${PLIST}" ]; then
            echo "ERROR: libplist.a not found."
            find source/libplist_lib -type f -print
            exit 1
          fi

          echo "PLIST=${GITHUB_WORKSPACE}/${PLIST}" >> "${GITHUB_ENV}"

          echo "===== LIBPLIST ====="
          echo "${PLIST}"


      # ==========================================================
      # Download PREBUILT libarchive
      # ==========================================================

      - name: Download libarchive
        shell: bash
        run: |
          set -e

          rm -rf third_party/libarchive
          mkdir -p third_party

          git clone \
            --depth 1 \
            "https://github.com/${LIBARCHIVE_REPOSITORY}.git" \
            third_party/libarchive

          test -d third_party/libarchive

          echo "libarchive downloaded."


      # ==========================================================
      # Locate libarchive
      # ==========================================================

      - name: Locate libarchive
        shell: bash
        run: |
          set -e

          XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name "libArchive.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${XCFRAMEWORK}" ]; then
            XCFRAMEWORK="$(
              find third_party/libarchive \
                -type d \
                -name "*.xcframework" \
                -print \
                -quit
            )"
          fi

          if [ -z "${XCFRAMEWORK}" ]; then
            echo "ERROR: libarchive XCFramework not found."
            find third_party/libarchive \
              -type d \
              -name "*.xcframework" \
              -print
            exit 1
          fi

          SLICE="${XCFRAMEWORK}/ios-arm64"

          if [ ! -d "${SLICE}" ]; then
            echo "ERROR: libarchive ios-arm64 slice not found."
            find "${XCFRAMEWORK}" \
              -maxdepth 2 \
              -type d \
              -print
            exit 1
          fi

          LIBARCHIVE="$(
            find "${SLICE}" \
              -type f \
              -name "libarchive.a" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE}" ]; then
            echo "ERROR: libarchive.a not found."
            find "${SLICE}" -type f -print
            exit 1
          fi

          HEADERS="$(
            find "${SLICE}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          if [ -z "${HEADERS}" ]; then
            echo "ERROR: libarchive Headers not found."
            find "${SLICE}" -maxdepth 3 -print
            exit 1
          fi

          test -f "${LIBARCHIVE}"
          test -d "${HEADERS}"

          echo "LIBARCHIVE=${GITHUB_WORKSPACE}/${LIBARCHIVE}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${GITHUB_WORKSPACE}/${HEADERS}" >> "${GITHUB_ENV}"

          echo "===== LIBARCHIVE ====="
          echo "${LIBARCHIVE}"

          echo "===== LIBARCHIVE HEADERS ====="
          echo "${HEADERS}"


      # ==========================================================
      # Validate libarchive
      # ==========================================================

      - name: Validate libarchive
        shell: bash
        run: |
          set -e

          test -f "${LIBARCHIVE}"
          test -d "${LIBARCHIVE_HEADERS}"

          file "${LIBARCHIVE}"

          echo "===== ARCHITECTURE ====="

          lipo -info "${LIBARCHIVE}" || true

          echo "===== SYMBOLS ====="

          nm -gU "${LIBARCHIVE}" 2>/dev/null \
            | grep -E \
              "archive_read_new|archive_read_open|archive_write_new|archive_write_open" \
            | head -20 \
            || true


      # ==========================================================
      # Download PREBUILT libcurl
      # ==========================================================

      - name: Download libcurl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

          gh --version

          rm -rf third_party/curl

          mkdir -p \
            third_party/curl/download \
            third_party/curl/extracted

          gh release view \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}"

          gh release download \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}" \
            --dir third_party/curl/download \
            --clobber

          echo "===== CURL RELEASE ASSETS ====="

          find third_party/curl/download \
            -maxdepth 2 \
            -type f \
            -print


      # ==========================================================
      # Extract libcurl
      # ==========================================================

      - name: Extract libcurl
        shell: bash
        run: |
          set -e

          FOUND=0

          while IFS= read -r -d '' FILE; do

            case "${FILE}" in

              *.zip|*.ZIP)
                FOUND=1

                unzip \
                  -q \
                  -o \
                  "${FILE}" \
                  -d third_party/curl/extracted
                ;;

              *.tar.gz|*.tgz)
                FOUND=1

                tar \
                  -xzf "${FILE}" \
                  -C third_party/curl/extracted
                ;;

              *.tar.xz)
                FOUND=1

                tar \
                  -xJf "${FILE}" \
                  -C third_party/curl/extracted
                ;;

            esac

          done < <(
            find third_party/curl/download \
              -type f \
              -print0
          )

          if [ "${FOUND}" -eq 0 ]; then
            echo "ERROR: no archive found in curl release."

            find third_party/curl/download \
              -type f \
              -print

            exit 1
          fi

          echo "===== EXTRACTED CURL ====="

          find third_party/curl/extracted \
            -maxdepth 6 \
            -print


      # ==========================================================
      # Locate libcurl
      #
      # IMPORTANT:
      # The actual release layout is:
      #
      # ios-arm64/libcurl.a
      # Info.plist
      #
      # There is NO Headers directory.
      # ==========================================================

      - name: Locate libcurl
        shell: bash
        run: |
          set -e

          CURL="$(
            find third_party/curl/extracted \
              -type f \
              -path "*/ios-arm64/libcurl.a" \
              -print \
              -quit
          )"

          if [ -z "${CURL}" ]; then
            CURL="$(
              find third_party/curl/extracted \
                -type f \
                -name "libcurl.a" \
                -print \
                -quit
            )"
          fi

          if [ -z "${CURL}" ]; then
            echo "ERROR: libcurl.a not found."

            find third_party/curl/extracted \
              -type f \
              -print

            exit 1
          fi

          test -f "${CURL}"

          echo "CURL=${GITHUB_WORKSPACE}/${CURL}" >> "${GITHUB_ENV}"

          echo "===== LIBCURL ====="
          echo "${CURL}"

          file "${CURL}"

          echo "===== ARCHITECTURE ====="

          lipo -info "${CURL}" || true


      # ==========================================================
      # Download ONLY curl headers
      #
      # This does NOT compile curl.
      #
      # The binary above is the prebuilt Release binary.
      # The headers are from exactly the same curl version.
      # ==========================================================

      - name: Download curl 8.17.0 headers
        shell: bash
        run: |
          set -e

          rm -rf third_party/curl-headers
          mkdir -p third_party/curl-headers

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o third_party/curl-8.17.0.tar.xz \
            "${CURL_SOURCE_URL}"

          test -s third_party/curl-8.17.0.tar.xz

          tar \
            -xJf third_party/curl-8.17.0.tar.xz \
            -C third_party/curl-headers

          CURL_SOURCE_DIR="$(
            find third_party/curl-headers \
              -maxdepth 1 \
              -type d \
              -name "curl-${CURL_VERSION}" \
              -print \
              -quit
          )"

          if [ -z "${CURL_SOURCE_DIR}" ]; then
            echo "ERROR: curl source directory not found."

            find third_party/curl-headers \
              -maxdepth 2 \
              -type d \
              -print

            exit 1
          fi

          CURL_HEADERS="${CURL_SOURCE_DIR}/include"

          if [ ! -d "${CURL_HEADERS}" ]; then
            echo "ERROR: curl include directory not found."
            exit 1
          fi

          if [ ! -f "${CURL_HEADERS}/curl/curl.h" ]; then
            echo "ERROR: curl/curl.h not found."
            exit 1
          fi

          echo "CURL_HEADERS=${GITHUB_WORKSPACE}/${CURL_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== CURL HEADERS ====="
          echo "${CURL_HEADERS}"

          find "${CURL_HEADERS}/curl" \
            -maxdepth 1 \
            -type f \
            -print


      # ==========================================================
      # Validate libcurl
      # ==========================================================

      - name: Validate libcurl
        shell: bash
        run: |
          set -e

          test -f "${CURL}"
          test -d "${CURL_HEADERS}"
          test -f "${CURL_HEADERS}/curl/curl.h"

          echo "===== LIBCURL ====="

          file "${CURL}"

          echo "===== LIBCURL ARCHITECTURE ====="

          lipo -info "${CURL}" || true

          echo "===== CURL HEADER ====="

          head -30 \
            "${CURL_HEADERS}/curl/curl.h"

          echo "===== CURL SYMBOLS ====="

          nm -gU "${CURL}" 2>/dev/null \
            | grep -E \
              "curl_easy_init|curl_easy_cleanup|curl_easy_perform" \
            | head -20 \
            || true


      # ==========================================================
      # Build ldid
      # ==========================================================

      - name: Build ldid
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          echo "===== BUILD CONFIGURATION ====="
          echo "TARGET=${TARGET}"
          echo "SDK=${IOS_SDK_DIR}"
          echo "OPENSSL=${GITHUB_WORKSPACE}/source/openssl_include"
          echo "LIBPLIST=${GITHUB_WORKSPACE}/source/libplist_include"
          echo "LIBARCHIVE=${LIBARCHIVE_HEADERS}"
          echo "LIBCURL=${CURL_HEADERS}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${CURL_HEADERS}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lc++ \
            -lz \
            -lbz2 \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid

          test -s build/ldid

          echo "===== BUILD SUCCESS ====="

          file build/ldid


      # ==========================================================
      # Validate Mach-O
      # ==========================================================

      - name: Validate binary
        shell: bash
        run: |
          set -e

          test -f build/ldid

          echo "===== FILE ====="
          file build/ldid

          echo "===== ARCHITECTURE ====="
          lipo -info build/ldid

          echo "===== MACH-O ====="
          otool -hv build/ldid

          echo "===== BUILD VERSION ====="

          otool -l build/ldid \
            > build/load_commands.txt

          awk '
            /LC_BUILD_VERSION/ {
              print
              n=8
              next
            }
            n > 0 {
              print
              n--
            }
          ' build/load_commands.txt

          echo "===== LINKED LIBRARIES ====="

          otool -L build/ldid


      # ==========================================================
      # Strip
      # ==========================================================

      - name: Strip binary
        shell: bash
        run: |
          set -e

          cp \
            build/ldid \
            build/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid

          test -s build/ldid

          echo "===== FINAL BINARY ====="

          file build/ldid
          lipo -info build/ldid


      # ==========================================================
      # Package
      # ==========================================================

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          cp \
            build/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== ARTIFACT ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256

          cat \
            ldid-ios-arm64.tar.gz.sha256


      # ==========================================================
      # Upload final artifact
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
