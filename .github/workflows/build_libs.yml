name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  # Verified prebuilt libarchive XCFramework.
  LIBARCHIVE_URL: "https://github.com/everpcpc/libarchive-swift/releases/latest/download/CArchive.xcframework.zip"

jobs:
  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # Extract ldid.zip
      # ============================================================

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== extracted source ====="

          find source \
            -maxdepth 2 \
            -type f \
            -print


      # ============================================================
      # Download exact iPhoneOS 16.5 SDK
      # ============================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== SDK ====="
          echo "${IOS_SDK_DIR}"

          /usr/libexec/PlistBuddy \
            -c "Print:Version" \
            "${IOS_SDK_DIR}/SDKSettings.plist" \
            || true


      # ============================================================
      # Configure Apple compiler
      # ============================================================

      - name: Configure iOS compiler
        shell: bash
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== clang ====="
          "${IOS_CLANG}" --version

          echo "===== clang++ ====="
          "${IOS_CLANGXX}" --version


      # ============================================================
      # Validate bundled OpenSSL / libplist
      # ============================================================

      - name: Validate bundled libraries
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"
          OPENSSL_INC="${GITHUB_WORKSPACE}/source/openssl_include"

          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"
          PLIST_INC="${GITHUB_WORKSPACE}/source/libplist_include"

          test -d "${OPENSSL_LIB}"
          test -d "${OPENSSL_INC}"

          test -d "${PLIST_LIB}"
          test -d "${PLIST_INC}"

          CRYPTO="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libcrypto*.a' \
              -print \
              -quit
          )"

          SSL="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libssl*.a' \
              -print \
              -quit
          )"

          PLIST="$(
            find "${PLIST_LIB}" \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${CRYPTO}"
          test -n "${SSL}"
          test -n "${PLIST}"

          test -f "${CRYPTO}"
          test -f "${SSL}"
          test -f "${PLIST}"

          echo "CRYPTO=${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${SSL}" >> "${GITHUB_ENV}"
          echo "PLIST=${PLIST}" >> "${GITHUB_ENV}"

          echo "===== OpenSSL crypto ====="
          file "${CRYPTO}"

          echo "===== OpenSSL ssl ====="
          file "${SSL}"

          echo "===== libplist ====="
          file "${PLIST}"


      # ============================================================
      # Download PREBUILT libarchive
      #
      # NO compilation.
      # ============================================================

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive
          mkdir -p third_party/libarchive

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o third_party/CArchive.xcframework.zip \
            "${LIBARCHIVE_URL}"

          test -s third_party/CArchive.xcframework.zip

          unzip \
            -q \
            third_party/CArchive.xcframework.zip \
            -d third_party/libarchive

          echo "===== libarchive package ====="

          find third_party/libarchive \
            -maxdepth 5 \
            -type f \
            -print


      # ============================================================
      # Locate libarchive iOS device arm64 slice
      # ============================================================

      - name: Select libarchive iOS arm64
        shell: bash
        run: |
          set -euo pipefail

          XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name 'CArchive.xcframework' \
              -print \
              -quit
          )"

          if [ -z "${XCFRAMEWORK}" ]; then
            XCFRAMEWORK="$(
              find third_party/libarchive \
                -type d \
                -name '*.xcframework' \
                -print \
                -quit
            )"
          fi

          test -n "${XCFRAMEWORK}"
          test -d "${XCFRAMEWORK}"

          echo "XCFRAMEWORK=${XCFRAMEWORK}"

          # Prefer the explicit iOS device arm64 slice.
          LIBARCHIVE_SLICE="${XCFRAMEWORK}/ios-arm64"

          test -d "${LIBARCHIVE_SLICE}"

          LIBARCHIVE="$(
            find "${LIBARCHIVE_SLICE}" \
              -type f \
              -name '*.a' \
              -print \
              -quit
          )"

          test -n "${LIBARCHIVE}"
          test -f "${LIBARCHIVE}"

          HEADERS="$(
            find "${LIBARCHIVE_SLICE}" \
              -type d \
              -name 'Headers' \
              -print \
              -quit
          )"

          test -n "${HEADERS}"
          test -d "${HEADERS}"

          echo "LIBARCHIVE=${GITHUB_WORKSPACE}/${LIBARCHIVE}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${GITHUB_WORKSPACE}/${HEADERS}" >> "${GITHUB_ENV}"

          echo "===== libarchive ====="
          file "${LIBARCHIVE}"

          echo "===== headers ====="
          echo "${HEADERS}"


      # ============================================================
      # Validate libarchive
      # ============================================================

      - name: Validate libarchive
        shell: bash
        run: |
          set -euo pipefail

          test -f "${LIBARCHIVE}"
          test -d "${LIBARCHIVE_HEADERS}"

          echo "===== file ====="
          file "${LIBARCHIVE}"

          echo "===== lipo ====="
          lipo -info "${LIBARCHIVE}"

          # The selected XCFramework directory is ios-arm64,
          # therefore this must contain arm64.
          lipo -info "${LIBARCHIVE}" \
            | grep -E 'arm64|Architectures in the fat file'

          echo "===== archive symbols ====="

          nm -gU "${LIBARCHIVE}" \
            | grep -E \
              'archive_read_new|archive_read_open|archive_write_new|archive_write_open' \
            | head -20


      # ============================================================
      # libcurl
      #
      # IMPORTANT:
      #
      # Do NOT download an unverified third-party libcurl binary.
      #
      # If ldid.zip already contains libcurl, use it.
      # Otherwise fail explicitly instead of silently downloading
      # an incompatible OpenSSL/SecureTransport build.
      # ============================================================

      - name: Locate prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          CURL_LIB=""
          CURL_HEADERS=""

          # Preferred layout.
          if [ -d "${GITHUB_WORKSPACE}/source/curl_lib" ]; then
            CURL_LIB="$(
              find "${GITHUB_WORKSPACE}/source/curl_lib" \
                -type f \
                -name 'libcurl*.a' \
                -print \
                -quit
            )"
          fi

          # Alternative layout.
          if [ -z "${CURL_LIB}" ] && [ -d "${GITHUB_WORKSPACE}/source/curl" ]; then
            CURL_LIB="$(
              find "${GITHUB_WORKSPACE}/source/curl" \
                -type f \
                -name 'libcurl*.a' \
                -print \
                -quit
            )"
          fi

          # Header directory.
          if [ -d "${GITHUB_WORKSPACE}/source/curl_include" ]; then
            CURL_HEADERS="${GITHUB_WORKSPACE}/source/curl_include"
          elif [ -d "${GITHUB_WORKSPACE}/source/curl/include" ]; then
            CURL_HEADERS="${GITHUB_WORKSPACE}/source/curl/include"
          fi

          if [ -z "${CURL_LIB}" ]; then
            echo "ERROR: no prebuilt libcurl.a found."
            echo
            echo "Expected one of:"
            echo "  source/curl_lib/libcurl*.a"
            echo "  source/curl/libcurl*.a"
            echo
            echo "No libcurl source compilation is performed by this workflow."
            exit 1
          fi

          if [ -z "${CURL_HEADERS}" ]; then
            echo "ERROR: no prebuilt libcurl headers found."
            exit 1
          fi

          test -f "${CURL_LIB}"
          test -d "${CURL_HEADERS}"

          echo "CURL=${CURL_LIB}" >> "${GITHUB_ENV}"
          echo "CURL_HEADERS=${CURL_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== libcurl ====="
          file "${CURL_LIB}"

          echo "===== libcurl headers ====="
          echo "${CURL_HEADERS}"


      # ============================================================
      # Validate libcurl architecture
      # ============================================================

      - name: Validate libcurl
        shell: bash
        run: |
          set -euo pipefail

          test -f "${CURL}"
          test -d "${CURL_HEADERS}"

          echo "===== libcurl file ====="

          file "${CURL}"

          echo "===== libcurl architecture ====="

          lipo -info "${CURL}"

          lipo -info "${CURL}" \
            | grep -E 'arm64|Architectures in the fat file'

          echo "===== libcurl symbols ====="

          nm -gU "${CURL}" \
            | grep -E \
              'curl_easy_init|curl_easy_cleanup|curl_easy_perform' \
            | head -20


      # ============================================================
      # Build ldid
      # ============================================================

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ldid
          mkdir -p build/ldid

          IOS_TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${IOS_TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${CURL_HEADERS}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lc++ \
            -lz \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid/ldid

          test -s build/ldid/ldid


      # ============================================================
      # Validate final Mach-O
      # ============================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          echo "===== file ====="

          file build/ldid/ldid

          echo "===== architecture ====="

          lipo -info build/ldid/ldid

          echo "===== Mach-O header ====="

          otool -hv build/ldid/ldid

          echo "===== LC_BUILD_VERSION ====="

          otool -l build/ldid/ldid \
            | grep -A5 LC_BUILD_VERSION

          echo "===== linked libraries ====="

          otool -L build/ldid/ldid


      # ============================================================
      # Verify iOS platform
      # ============================================================

      - name: Validate iOS platform
        shell: bash
        run: |
          set -euo pipefail

          otool -l build/ldid/ldid \
            > build/ldid/load-commands.txt

          grep -A5 \
            LC_BUILD_VERSION \
            build/ldid/load-commands.txt

          grep -A5 \
            LC_BUILD_VERSION \
            build/ldid/load-commands.txt \
            | grep "platform 2"


      # ============================================================
      # Strip
      # ============================================================

      - name: Strip final binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid/ldid \
            build/ldid/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid/ldid

          test -s build/ldid/ldid

          file build/ldid/ldid

          lipo -info build/ldid/ldid


      # ============================================================
      # Package
      # ============================================================

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp \
            build/ldid/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== artifact ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256

          cat \
            ldid-ios-arm64.tar.gz.sha256


      # ============================================================
      # Upload
      # ============================================================

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
