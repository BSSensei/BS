name: Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          git clone --recursive https://github.com/opa334/TrollStore.git
          cd TrollStore
          
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git
          cp -r sdks/iPhoneOS16.5.sdk .
          rm -rf sdks
          
          export SDK_PATH="$THEOS/sdks/iPhoneOS16.5.sdk"
          
          cd $GITHUB_WORKSPACE/TrollStore
          
          # 编译 libarchive
          curl -LO https://github.com/libarchive/libarchive/releases/download/v3.7.2/libarchive-3.7.2.tar.gz
          tar -xzf libarchive-3.7.2.tar.gz
          cd libarchive-3.7.2
          
          ./configure \
            --host=arm64-apple-darwin \
            --disable-shared \
            --enable-static \
            --without-xml2 \
            --without-expat \
            --without-openssl \
            --without-lzma \
            --without-zstd \
            --without-bz2lib \
            CC="xcrun -sdk iphoneos clang -arch arm64" \
            CFLAGS="-isysroot $SDK_PATH -miphoneos-version-min=14.0" \
            LDFLAGS="-isysroot $SDK_PATH"
          
          make -j$(sysctl -n hw.ncpu)
          
          mkdir -p $THEOS/vendor/include $THEOS/vendor/lib
          cp libarchive/archive.h $THEOS/vendor/include/
          cp libarchive/archive_entry.h $THEOS/vendor/include/
          find . -name "*.a" -exec cp {} $THEOS/vendor/lib/ \;
          
          cd $GITHUB_WORKSPACE/TrollStore
          
          # 编译 OpenSSL for iOS
          curl -LO https://github.com/openssl/openssl/releases/download/openssl-3.0.12/openssl-3.0.12.tar.gz
          tar -xzf openssl-3.0.12.tar.gz
          cd openssl-3.0.12
          
          ./Configure ios64-cross no-shared no-dso no-hw no-engine \
            --prefix=$THEOS/vendor \
            CC="xcrun -sdk iphoneos clang -arch arm64" \
            CFLAGS="-isysroot $SDK_PATH -miphoneos-version-min=14.0"
          
          make -j$(sysctl -n hw.ncpu)
          make install_sw
          
          cd $GITHUB_WORKSPACE/TrollStore
          
          # 编译 fastPathSign (macOS版本用于构建时签名)
          cd Exploits/fastPathSign
          make clean 2>/dev/null || true
          make
          
          # 编译 fastPathSign (iOS版本)
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -isysroot $SDK_PATH \
            -miphoneos-version-min=14.0 \
            -o fastPathSign-ios \
            src/codesign.m \
            src/main.m \
            src/coretrust_bug.c \
            ../../ChOma/src/Base64.c \
            ../../ChOma/src/BufferedStream.c \
            ../../ChOma/src/CSBlob.c \
            ../../ChOma/src/CodeDirectory.c \
            ../../ChOma/src/FAT.c \
            ../../ChOma/src/FileStream.c \
            ../../ChOma/src/Host.c \
            ../../ChOma/src/MachO.c \
            ../../ChOma/src/MachOLoadCommand.c \
            ../../ChOma/src/MemoryStream.c \
            ../../ChOma/src/PatchFinder.c \
            ../../ChOma/src/PatchFinder_arm64.c \
            ../../ChOma/src/Util.c \
            ../../ChOma/src/arm64.c \
            -framework Foundation \
            -framework Security \
            -framework CoreFoundation \
            -framework CoreServices \
            -fobjc-arc \
            -I../../ChOma/src \
            -I./src \
            -I$THEOS/vendor/include \
            -L$THEOS/vendor/lib \
            -lcrypto
          
          cd $GITHUB_WORKSPACE/TrollStore/RootHelper
          export CFLAGS="-I$THEOS/vendor/include"
          export LDFLAGS="-L$THEOS/vendor/lib -larchive -lz -liconv"
          make clean
          make FINALPACKAGE=1
          
          cp .theos/obj/trollstorehelper ../TrollHelper/Resources/RootHelper
          
          cd ../TrollHelper
          export CFLAGS="-I$THEOS/vendor/include"
          export LDFLAGS="-L$THEOS/vendor/lib -larchive -lz -liconv"
          make clean
          make FINALPACKAGE=1
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp .theos/obj/trollstorehelper $GITHUB_WORKSPACE/output/RootHelper
          cp ../RootHelper/.theos/obj/trollstorehelper $GITHUB_WORKSPACE/output/
          cp ../Exploits/fastPathSign/fastPathSign-ios $GITHUB_WORKSPACE/output/fastPathSign
          
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: output/*
