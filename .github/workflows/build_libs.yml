name: Build ldid

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  LIBARCHIVE_URL: "https://github.com/libarchive/libarchive/releases/download/v3.8.2/libarchive-3.8.2.tar.xz"

  CURL_VERSION: "8.16.0"
  CURL_URL: "https://curl.se/download/curl-8.16.0.tar.xz"

  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:

  # ============================================================
  # macOS
  # ============================================================

  macos:
    name: macOS build + smoke test
    runs-on: macos-14

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Homebrew dependencies
      # ----------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew update

          brew install \
            openssl@3 \
            libplist \
            libarchive \
            curl \
            cmake \
            ninja

      # ----------------------------------------------------------
      # Extract ldid.zip
      # ----------------------------------------------------------

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "===== source ====="

          ls -lh \
            source/ldid.cpp \
            source/ldid.hpp

      # ----------------------------------------------------------
      # Validate bundled libraries
      # ----------------------------------------------------------

      - name: Validate bundled libraries
        shell: bash
        run: |
          set -euo pipefail

          test -d source/openssl_lib
          test -d source/openssl_include
          test -d source/libplist_lib
          test -d source/libplist_include

          OPENSSL_SSL="$(
            find source/openssl_lib \
              -type f \
              -name 'libssl.a' \
              -print \
              -quit
          )"

          OPENSSL_CRYPTO="$(
            find source/openssl_lib \
              -type f \
              -name 'libcrypto.a' \
              -print \
              -quit
          )"

          LIBPLIST="$(
            find source/libplist_lib \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${OPENSSL_SSL}"
          test -n "${OPENSSL_CRYPTO}"
          test -n "${LIBPLIST}"

          echo "OPENSSL_SSL=${OPENSSL_SSL}" >> "${GITHUB_ENV}"
          echo "OPENSSL_CRYPTO=${OPENSSL_CRYPTO}" >> "${GITHUB_ENV}"
          echo "LIBPLIST=${LIBPLIST}" >> "${GITHUB_ENV}"

          echo "OpenSSL SSL:"
          echo "  ${OPENSSL_SSL}"

          echo "OpenSSL Crypto:"
          echo "  ${OPENSSL_CRYPTO}"

          echo "libplist:"
          echo "  ${LIBPLIST}"

      # ----------------------------------------------------------
      # Build macOS ldid
      # ----------------------------------------------------------

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/macos

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          LIBPLIST_PREFIX="$(brew --prefix libplist)"
          LIBARCHIVE_PREFIX="$(brew --prefix libarchive)"
          CURL_PREFIX="$(brew --prefix curl)"

          clang++ \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_PREFIX}/include" \
            -I"${LIBPLIST_PREFIX}/include" \
            -I"${LIBARCHIVE_PREFIX}/include" \
            -I"${CURL_PREFIX}/include" \
            -Isource \
            source/ldid.cpp \
            "${OPENSSL_PREFIX}/lib/libssl.a" \
            "${OPENSSL_PREFIX}/lib/libcrypto.a" \
            "${LIBPLIST_PREFIX}/lib/libplist-2.0.a" \
            "${LIBARCHIVE_PREFIX}/lib/libarchive.a" \
            "${CURL_PREFIX}/lib/libcurl.a" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CoreServices \
            -framework IOKit \
            -lz \
            -lbz2 \
            -liconv \
            -lresolv \
            -lc++ \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/macos/ldid

          test -s build/macos/ldid

      # ----------------------------------------------------------
      # macOS smoke test
      # ----------------------------------------------------------

      - name: macOS smoke test
        shell: bash
        run: |
          set -euo pipefail

          ./build/macos/ldid --version

          file build/macos/ldid

          echo "macOS smoke test passed."

  # ============================================================
  # iOS
  # ============================================================

  ios:
    name: iOS arm64
    runs-on: macos-14

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Extract ldid.zip
      # ----------------------------------------------------------

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "===== source ====="

          ls -lh \
            source/ldid.cpp \
            source/ldid.hpp

      # ----------------------------------------------------------
      # Validate bundled OpenSSL / libplist
      # ----------------------------------------------------------

      - name: Validate bundled libraries
        shell: bash
        run: |
          set -euo pipefail

          test -d source/openssl_lib
          test -d source/openssl_include
          test -d source/libplist_lib
          test -d source/libplist_include

          OPENSSL_SSL="$(
            find source/openssl_lib \
              -type f \
              -name 'libssl.a' \
              -print \
              -quit
          )"

          OPENSSL_CRYPTO="$(
            find source/openssl_lib \
              -type f \
              -name 'libcrypto.a' \
              -print \
              -quit
          )"

          LIBPLIST="$(
            find source/libplist_lib \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${OPENSSL_SSL}"
          test -n "${OPENSSL_CRYPTO}"
          test -n "${LIBPLIST}"

          echo "OPENSSL_SSL=${OPENSSL_SSL}" >> "${GITHUB_ENV}"
          echo "OPENSSL_CRYPTO=${OPENSSL_CRYPTO}" >> "${GITHUB_ENV}"
          echo "LIBPLIST=${LIBPLIST}" >> "${GITHUB_ENV}"

          echo "===== OpenSSL ====="

          file \
            "${OPENSSL_SSL}" \
            "${OPENSSL_CRYPTO}"

          echo "===== libplist ====="

          file "${LIBPLIST}"

      # ----------------------------------------------------------
      # Download exact iPhoneOS16.5 SDK
      # ----------------------------------------------------------

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"
          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"

          rm -rf "${SDK_ROOT}"

          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            "${IOS_SDK_URL}" \
            -o "${SDK_ARCHIVE}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK}"
          test -d "${IOS_SDK}/usr/include"

          echo "IOS_SDK=${IOS_SDK}" >> "${GITHUB_ENV}"
          echo "IOS_SDK_DIR=${IOS_SDK}" >> "${GITHUB_ENV}"

          echo "===== SDK ====="
          echo "${IOS_SDK}"

      # ----------------------------------------------------------
      # Apple toolchain
      # ----------------------------------------------------------

      - name: Configure iOS toolchain
        shell: bash
        run: |
          set -euo pipefail

          IOS_CC="$(xcrun --sdk iphoneos -f clang)"
          IOS_CXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_AR="$(xcrun --sdk iphoneos -f ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"
          IOS_LIPO="$(xcrun --sdk iphoneos -f lipo)"
          IOS_OTOOL="$(xcrun --sdk iphoneos -f otool)"

          echo "IOS_CC=${IOS_CC}" >> "${GITHUB_ENV}"
          echo "IOS_CXX=${IOS_CXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"
          echo "IOS_LIPO=${IOS_LIPO}" >> "${GITHUB_ENV}"
          echo "IOS_OTOOL=${IOS_OTOOL}" >> "${GITHUB_ENV}"

          "${IOS_CC}" --version
          "${IOS_CXX}" --version

      # ==========================================================
      # libarchive 3.8.2
      # ==========================================================

      - name: Download libarchive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            "${LIBARCHIVE_URL}" \
            -o "${RUNNER_TEMP}/libarchive.tar.xz"

          test -s "${RUNNER_TEMP}/libarchive.tar.xz"

          rm -rf \
            third_party/libarchive-src \
            "third_party/libarchive-${LIBARCHIVE_VERSION}"

          tar \
            -xJf "${RUNNER_TEMP}/libarchive.tar.xz" \
            -C third_party

          test -d \
            "third_party/libarchive-${LIBARCHIVE_VERSION}"

          mv \
            "third_party/libarchive-${LIBARCHIVE_VERSION}" \
            third_party/libarchive-src

          test -f \
            third_party/libarchive-src/CMakeLists.txt

      # ----------------------------------------------------------
      # Build libarchive
      #
      # Only build the library.
      #
      # Disable all command line programs because ldid only needs
      # libarchive's library API.
      # ----------------------------------------------------------

      - name: Build libarchive for iOS
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive-build

          cmake \
            -S third_party/libarchive-src \
            -B third_party/libarchive-build \
            -G Ninja \
            --log-level=WARNING \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_C_COMPILER="${IOS_CC}" \
            -DCMAKE_CXX_COMPILER="${IOS_CXX}" \
            -DCMAKE_AR="${IOS_AR}" \
            -DCMAKE_RANLIB="${IOS_RANLIB}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_INSTALL=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            -DENABLE_ACL=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_CNG=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_LIBB2=OFF

          echo "===== libarchive build ====="

          if ! cmake \
            --build third_party/libarchive-build \
            --parallel \
            --verbose; then

            echo
            echo "============================================================"
            echo "LIBARCHIVE BUILD FAILED"
            echo "============================================================"

            echo
            echo "===== CMakeError.log ====="

            if test -f \
              third_party/libarchive-build/CMakeFiles/CMakeError.log; then
              cat \
                third_party/libarchive-build/CMakeFiles/CMakeError.log
            fi

            echo
            echo "===== CMakeOutput.log ====="

            if test -f \
              third_party/libarchive-build/CMakeFiles/CMakeOutput.log; then
              tail -n 300 \
                third_party/libarchive-build/CMakeFiles/CMakeOutput.log
            fi

            exit 1
          fi

          LIBARCHIVE_A="$(
            find third_party/libarchive-build \
              -type f \
              -name 'libarchive*.a' \
              -print \
              -quit
          )"

          test -n "${LIBARCHIVE_A}"
          test -f "${LIBARCHIVE_A}"

          echo "LIBARCHIVE_A=${LIBARCHIVE_A}" >> "${GITHUB_ENV}"

          echo "===== libarchive.a ====="

          file "${LIBARCHIVE_A}"

          "${IOS_LIPO}" \
            -info "${LIBARCHIVE_A}" || true

      # ==========================================================
      # curl 8.16.0
      # ==========================================================

      - name: Download curl
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            "${CURL_URL}" \
            -o "${RUNNER_TEMP}/curl.tar.xz"

          test -s "${RUNNER_TEMP}/curl.tar.xz"

          rm -rf \
            third_party/curl-src \
            "third_party/curl-${CURL_VERSION}"

          tar \
            -xJf "${RUNNER_TEMP}/curl.tar.xz" \
            -C third_party

          test -d \
            "third_party/curl-${CURL_VERSION}"

          mv \
            "third_party/curl-${CURL_VERSION}" \
            third_party/curl-src

          test -f \
            third_party/curl-src/CMakeLists.txt

      # ----------------------------------------------------------
      # Build curl
      #
      # IMPORTANT:
      #
      # _CURL_PREFILL=ON is the official curl mechanism for
      # pre-filling known platform feature detection.
      #
      # This avoids unnecessary HAVE_ATOMIC and resolver-shape
      # try_compile tests on the iOS build.
      #
      # CURL_ENABLE_NTLM=OFF avoids the DES/NTLM problem.
      # ----------------------------------------------------------

      - name: Build curl for iOS
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl-build

          cmake \
            -S third_party/curl-src \
            -B third_party/curl-build \
            -G Ninja \
            --log-level=WARNING \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_C_COMPILER="${IOS_CC}" \
            -DCMAKE_CXX_COMPILER="${IOS_CXX}" \
            -DCMAKE_AR="${IOS_AR}" \
            -DCMAKE_RANLIB="${IOS_RANLIB}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_LIBCURL_DOCS=OFF \
            -DBUILD_MISC_DOCS=OFF \
            -DENABLE_CURL_MANUAL=OFF \
            -DCURL_BUILD_EVERYTHING=OFF \
            -DCURL_DISABLE_INSTALL=ON \
            -D_CURL_PREFILL=ON \
            -DCURL_ENABLE_NTLM=OFF \
            -C "${GITHUB_WORKSPACE}/.github/curl-ios-cache.cmake" \
            -DCURL_USE_OPENSSL=ON \
            -DCURL_USE_MBEDTLS=OFF \
            -DCURL_USE_WOLFSSL=OFF \
            -DCURL_USE_GNUTLS=OFF \
            -DCURL_USE_RUSTLS=OFF \
            -DCURL_USE_LIBSSH2=OFF \
            -DCURL_USE_LIBSSH=OFF \
            -DCURL_USE_GSSAPI=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_LIBIDN2=OFF \
            -DENABLE_ARES=OFF \
            -DENABLE_THREADED_RESOLVER=OFF \
            -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF \
            -DCURL_ZLIB=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_TFTP=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_SMB=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_DISABLE_SRP=ON \
            -DCURL_DISABLE_WEBSOCKETS=ON \
            -DCURL_DISABLE_NTLM=ON \
            -DCURL_DISABLE_IPFS=ON \
            -DOPENSSL_ROOT_DIR="${GITHUB_WORKSPACE}/source" \
            -DOPENSSL_INCLUDE_DIR="${GITHUB_WORKSPACE}/source/openssl_include" \
            -DOPENSSL_SSL_LIBRARY="${OPENSSL_SSL}" \
            -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_CRYPTO}"

          echo "===== curl build ====="

          if ! cmake \
            --build third_party/curl-build \
            --parallel \
            --verbose; then

            echo
            echo "============================================================"
            echo "CURL BUILD FAILED"
            echo "============================================================"

            echo
            echo "===== CMakeError.log ====="

            if test -f \
              third_party/curl-build/CMakeFiles/CMakeError.log; then
              cat \
                third_party/curl-build/CMakeFiles/CMakeError.log
            fi

            echo
            echo "===== CMakeOutput.log ====="

            if test -f \
              third_party/curl-build/CMakeFiles/CMakeOutput.log; then
              tail -n 300 \
                third_party/curl-build/CMakeFiles/CMakeOutput.log
            fi

            exit 1
          fi

          CURL_A="$(
            find third_party/curl-build \
              -type f \
              -name 'libcurl*.a' \
              -print \
              -quit
          )"

          test -n "${CURL_A}"
          test -f "${CURL_A}"

          echo "CURL_A=${CURL_A}" >> "${GITHUB_ENV}"

          echo "===== libcurl.a ====="

          file "${CURL_A}"

          "${IOS_LIPO}" \
            -info "${CURL_A}" || true

      # ==========================================================
      # libplist
      # ==========================================================

      - name: Locate bundled libplist
        shell: bash
        run: |
          set -euo pipefail

          LIBPLIST_A="$(
            find source/libplist_lib \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${LIBPLIST_A}"
          test -f "${LIBPLIST_A}"

          echo "LIBPLIST_A=${LIBPLIST_A}" >> "${GITHUB_ENV}"

          file "${LIBPLIST_A}"

      # ==========================================================
      # Build ldid
      # ==========================================================

      - name: Build ldid for iOS
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ios

          mkdir -p build/ios

          "${IOS_CXX}" \
            -std=c++20 \
            -arch arm64 \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source" \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${GITHUB_WORKSPACE}/third_party/libarchive-src/libarchive" \
            -I"${GITHUB_WORKSPACE}/third_party/curl-src/include" \
            source/ldid.cpp \
            "${LIBPLIST_A}" \
            "${LIBARCHIVE_A}" \
            "${CURL_A}" \
            "${OPENSSL_SSL}" \
            "${OPENSSL_CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -framework SystemConfiguration \
            -framework CFNetwork \
            -framework Foundation \
            -lz \
            -lc++ \
            -dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ios/ldid

          test -s build/ios/ldid

      # ==========================================================
      # Validate iOS binary
      # ==========================================================

      - name: Validate iOS binary
        shell: bash
        run: |
          set -euo pipefail

          IOS_BIN="build/ios/ldid"

          test -f "${IOS_BIN}"
          test -s "${IOS_BIN}"

          echo "===== file ====="

          file "${IOS_BIN}"

          echo "===== lipo ====="

          "${IOS_LIPO}" \
            -info "${IOS_BIN}"

          echo "===== Mach-O header ====="

          "${IOS_OTOOL}" \
            -hv "${IOS_BIN}"

          echo "===== LC_BUILD_VERSION ====="

          "${IOS_OTOOL}" \
            -l "${IOS_BIN}" | \
            grep -A8 \
              'LC_BUILD_VERSION' || true

          echo "===== linked libraries ====="

          "${IOS_OTOOL}" \
            -L "${IOS_BIN}" || true

          echo "===== external dependency check ====="

          if "${IOS_OTOOL}" -L "${IOS_BIN}" | \
            grep -E \
              '/opt/homebrew|/usr/local/Cellar|libssl|libcrypto|libcurl'; then

            echo "ERROR: unexpected external dependency detected."

            exit 1
          fi

          echo "===== architecture ====="

          "${IOS_LIPO}" \
            -info "${IOS_BIN}" | \
            grep -q 'arm64'

          echo "iOS binary validation passed."

      # ==========================================================
      # Strip
      # ==========================================================

      - name: Strip iOS binary
        shell: bash
        run: |
          set -euo pipefail

          "${IOS_STRIP}" \
            -S \
            build/ios/ldid

          test -s build/ios/ldid

          file build/ios/ldid

          "${IOS_LIPO}" \
            -info build/ios/ldid

      # ==========================================================
      # Inspect code signature
      # ==========================================================

      - name: Inspect codesign
        shell: bash
        run: |
          set -euo pipefail

          if command -v codesign >/dev/null 2>&1; then
            codesign \
              --display \
              --verbose=4 \
              build/ios/ldid || true
          else
            echo "codesign unavailable."
          fi

      # ==========================================================
      # Package
      # ==========================================================

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist/package

          cp \
            build/ios/ldid \
            dist/package/ldid

          chmod 755 \
            dist/package/ldid

          tar \
            -C dist/package \
            -czf dist/ldid-ios-arm64.tar.gz \
            ldid

          shasum \
            -a 256 \
            dist/ldid-ios-arm64.tar.gz \
            > dist/ldid-ios-arm64.tar.gz.sha256

          echo "===== artifact ====="

          ls -lh \
            dist/ldid-ios-arm64.tar.gz \
            dist/ldid-ios-arm64.tar.gz.sha256

          echo "===== SHA256 ====="

          cat \
            dist/ldid-ios-arm64.tar.gz.sha256

      # ==========================================================
      # Upload ONLY iOS
      # ==========================================================

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            dist/ldid-ios-arm64.tar.gz
            dist/ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
