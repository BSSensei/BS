name: 构建 iOS 静态库与 IPA（含 ldid2）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 安装编译依赖
        run: |
          brew install cmake make git autoconf automake libtool pkg-config

      - name: 修复 Git 认证
        run: |
          git config --global --unset-all credential.helper || true
          export GIT_TERMINAL_PROMPT=0
          git config --global url."https://github.com/".insteadOf "https://github.com/"

      - name: 执行构建脚本
        run: |
          chmod +x scripts/build_all.sh
          bash scripts/build_all.sh

      - name: 上传静态库
        uses: actions/upload-artifact@v4
        with:
          name: ios-static-libs
          path: Frameworks/

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PermanentStore-IPA
          path: IPA/

      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt.gz
