name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  # Prebuilt Apple/iOS libarchive.
  LIBARCHIVE_REPOSITORY: "okferret/libarchive"

  # Prebuilt iOS/iPadOS libcurl.
  # This project provides an OpenSSL-backed curl XCFramework.
  CURL_REPOSITORY: "tls-inspector/curl-ios"

jobs:
  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # Extract ldid.zip
      # ============================================================

      - name: Extract ldid source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== source ====="

          find source \
            -maxdepth 2 \
            -type f \
            -print


      # ============================================================
      # Download exact iPhoneOS 16.5 SDK
      # ============================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"

          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== iOS SDK ====="
          echo "${IOS_SDK_DIR}"

          /usr/libexec/PlistBuddy \
            -c "Print:Version" \
            "${IOS_SDK_DIR}/SDKSettings.plist" \
            || true


      # ============================================================
      # Apple Clang
      # ============================================================

      - name: Configure iOS compiler
        shell: bash
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_AR="$(xcrun --sdk iphoneos -f ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_AR}"
          test -x "${IOS_RANLIB}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== clang ====="

          "${IOS_CLANG}" --version

          echo "===== clang++ ====="

          "${IOS_CLANGXX}" --version


      # ============================================================
      # Validate bundled OpenSSL / libplist
      # ============================================================

      - name: Validate bundled libraries
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"
          OPENSSL_INC="${GITHUB_WORKSPACE}/source/openssl_include"

          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"
          PLIST_INC="${GITHUB_WORKSPACE}/source/libplist_include"

          test -d "${OPENSSL_LIB}"
          test -d "${OPENSSL_INC}"

          test -d "${PLIST_LIB}"
          test -d "${PLIST_INC}"

          CRYPTO="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libcrypto*.a' \
              -print \
              -quit
          )"

          SSL="$(
            find "${OPENSSL_LIB}" \
              -type f \
              -name 'libssl*.a' \
              -print \
              -quit
          )"

          PLIST="$(
            find "${PLIST_LIB}" \
              -type f \
              -name 'libplist*.a' \
              -print \
              -quit
          )"

          test -n "${CRYPTO}"
          test -n "${SSL}"
          test -n "${PLIST}"

          test -f "${CRYPTO}"
          test -f "${SSL}"
          test -f "${PLIST}"

          echo "CRYPTO=${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${SSL}" >> "${GITHUB_ENV}"
          echo "PLIST=${PLIST}" >> "${GITHUB_ENV}"

          echo "===== OpenSSL crypto ====="
          file "${CRYPTO}"

          echo "===== OpenSSL ssl ====="
          file "${SSL}"

          echo "===== libplist ====="
          file "${PLIST}"


      # ============================================================
      # Download prebuilt libarchive XCFramework
      #
      # NO libarchive compilation.
      # ============================================================

      - name: Download prebuilt libarchive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/libarchive
          mkdir -p third_party/libarchive

          API_URL="https://api.github.com/repos/${LIBARCHIVE_REPOSITORY}/releases/latest"

          echo "===== libarchive release ====="
          echo "${API_URL}"

          RELEASE_JSON="${RUNNER_TEMP}/libarchive-release.json"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${RELEASE_JSON}" \
            "${API_URL}"

          test -s "${RELEASE_JSON}"

          python3 - "${RELEASE_JSON}" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assets = data.get("assets", [])

          candidates = []

          for asset in assets:
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              lower = name.lower()

              if (
                  "xcframework" in lower
                  and "zip" in lower
                  and url
              ):
                  candidates.append((name, url))

          if not candidates:
              raise SystemExit(
                  "No XCFramework ZIP asset found in latest libarchive release"
              )

          # Prefer an asset whose name explicitly contains libarchive.
          candidates.sort(
              key=lambda item: (
                  "libarchive" not in item[0].lower(),
                  item[0].lower(),
              )
          )

          name, url = candidates[0]

          print(f"LIBARCHIVE_ASSET_NAME={name}")
          print(f"LIBARCHIVE_ASSET_URL={url}")

          with open(
              "${GITHUB_ENV}",
              "a",
              encoding="utf-8",
          ) as env:
              env.write(f"LIBARCHIVE_ASSET_NAME={name}\n")
              env.write(f"LIBARCHIVE_ASSET_URL={url}\n")
          PY

          echo "===== downloading ====="
          echo "${LIBARCHIVE_ASSET_NAME}"
          echo "${LIBARCHIVE_ASSET_URL}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o third_party/libarchive.xcframework.zip \
            "${LIBARCHIVE_ASSET_URL}"

          test -s third_party/libarchive.xcframework.zip

          unzip \
            -q \
            third_party/libarchive.xcframework.zip \
            -d third_party/libarchive

          echo "===== libarchive files ====="

          find third_party/libarchive \
            -maxdepth 5 \
            -type f \
            -print


      # ============================================================
      # Extract iOS arm64 libarchive
      # ============================================================

      - name: Select libarchive iOS arm64
        shell: bash
        run: |
          set -euo pipefail

          LIBARCHIVE_XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name '*.xcframework' \
              -print \
              -quit
          )"

          test -n "${LIBARCHIVE_XCFRAMEWORK}"
          test -d "${LIBARCHIVE_XCFRAMEWORK}"

          LIBARCHIVE_SLICE="${LIBARCHIVE_XCFRAMEWORK}/ios-arm64"

          test -d "${LIBARCHIVE_SLICE}"

          LIBARCHIVE="$(
            find "${LIBARCHIVE_SLICE}" \
              -type f \
              -name 'libarchive.a' \
              -print \
              -quit
          )"

          test -n "${LIBARCHIVE}"
          test -f "${LIBARCHIVE}"

          LIBARCHIVE_HEADERS="$(
            find "${LIBARCHIVE_SLICE}" \
              -type d \
              -name 'Headers' \
              -print \
              -quit
          )"

          test -n "${LIBARCHIVE_HEADERS}"
          test -d "${LIBARCHIVE_HEADERS}"

          echo "LIBARCHIVE=${GITHUB_WORKSPACE}/${LIBARCHIVE}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${GITHUB_WORKSPACE}/${LIBARCHIVE_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== libarchive ====="
          echo "${LIBARCHIVE}"

          file "${LIBARCHIVE}"

          echo "===== libarchive headers ====="
          echo "${LIBARCHIVE_HEADERS}"


      # ============================================================
      # Validate libarchive is an iOS device arm64 library
      # ============================================================

      - name: Validate libarchive architecture
        shell: bash
        run: |
          set -euo pipefail

          test -f "${LIBARCHIVE}"

          echo "===== libarchive architecture ====="

          file "${LIBARCHIVE}"

          lipo -info "${LIBARCHIVE}"

          # A device slice must be arm64.
          lipo -info "${LIBARCHIVE}" \
            | grep -E 'arm64|Architectures in the fat file'

          # Make sure it is not simulator-only.
          if file "${LIBARCHIVE}" | grep -qi simulator; then
            echo "ERROR: simulator libarchive detected"
            exit 1
          fi


      # ============================================================
      # Download prebuilt libcurl XCFramework
      #
      # NO curl compilation.
      #
      # The selected project provides OpenSSL-backed iOS curl.
      # ============================================================

      - name: Download prebuilt libcurl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/curl
          mkdir -p third_party/curl

          API_URL="https://api.github.com/repos/${CURL_REPOSITORY}/releases/latest"

          echo "===== curl release ====="
          echo "${API_URL}"

          RELEASE_JSON="${RUNNER_TEMP}/curl-release.json"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${RELEASE_JSON}" \
            "${API_URL}"

          test -s "${RELEASE_JSON}"

          python3 - "${RELEASE_JSON}" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assets = data.get("assets", [])

          candidates = []

          for asset in assets:
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              lower = name.lower()

              if (
                  "xcframework" in lower
                  and "zip" in lower
                  and "curl" in lower
                  and url
              ):
                  # Prefer the normal C curl XCFramework.
                  if "swift" not in lower:
                      candidates.append((name, url))

          if not candidates:
              # Fall back to any curl XCFramework ZIP.
              for asset in assets:
                  name = asset.get("name", "")
                  url = asset.get("browser_download_url", "")

                  lower = name.lower()

                  if (
                      "xcframework" in lower
                      and "zip" in lower
                      and "curl" in lower
                      and url
                  ):
                      candidates.append((name, url))

          if not candidates:
              raise SystemExit(
                  "No curl XCFramework ZIP asset found in latest release"
              )

          candidates.sort(
              key=lambda item: (
                  "swift" in item[0].lower(),
                  item[0].lower(),
              )
          )

          name, url = candidates[0]

          print(f"CURL_ASSET_NAME={name}")
          print(f"CURL_ASSET_URL={url}")

          with open(
              "${GITHUB_ENV}",
              "a",
              encoding="utf-8",
          ) as env:
              env.write(f"CURL_ASSET_NAME={name}\n")
              env.write(f"CURL_ASSET_URL={url}\n")
          PY

          echo "===== downloading ====="
          echo "${CURL_ASSET_NAME}"
          echo "${CURL_ASSET_URL}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o third_party/curl.xcframework.zip \
            "${CURL_ASSET_URL}"

          test -s third_party/curl.xcframework.zip

          unzip \
            -q \
            third_party/curl.xcframework.zip \
            -d third_party/curl

          echo "===== curl files ====="

          find third_party/curl \
            -maxdepth 5 \
            -type f \
            -print


      # ============================================================
      # Extract iOS arm64 libcurl
      # ============================================================

      - name: Select libcurl iOS arm64
        shell: bash
        run: |
          set -euo pipefail

          CURL_XCFRAMEWORK="$(
            find third_party/curl \
              -type d \
              -name '*.xcframework' \
              -print \
              -quit
          )"

          test -n "${CURL_XCFRAMEWORK}"
          test -d "${CURL_XCFRAMEWORK}"

          CURL_SLICE="${CURL_XCFRAMEWORK}/ios-arm64"

          test -d "${CURL_SLICE}"

          CURL_LIB="$(
            find "${CURL_SLICE}" \
              -type f \
              -name 'libcurl.a' \
              -print \
              -quit
          )"

          test -n "${CURL_LIB}"
          test -f "${CURL_LIB}"

          CURL_HEADERS="$(
            find "${CURL_SLICE}" \
              -type d \
              -name 'Headers' \
              -print \
              -quit
          )"

          test -n "${CURL_HEADERS}"
          test -d "${CURL_HEADERS}"

          echo "CURL=${GITHUB_WORKSPACE}/${CURL_LIB}" >> "${GITHUB_ENV}"
          echo "CURL_HEADERS=${GITHUB_WORKSPACE}/${CURL_HEADERS}" >> "${GITHUB_ENV}"

          echo "===== libcurl ====="
          echo "${CURL_LIB}"

          file "${CURL_LIB}"

          echo "===== libcurl headers ====="
          echo "${CURL_HEADERS}"


      # ============================================================
      # Validate libcurl architecture
      # ============================================================

      - name: Validate libcurl architecture
        shell: bash
        run: |
          set -euo pipefail

          test -f "${CURL}"

          echo "===== libcurl architecture ====="

          file "${CURL}"

          lipo -info "${CURL}"

          lipo -info "${CURL}" \
            | grep -E 'arm64|Architectures in the fat file'

          if file "${CURL}" | grep -qi simulator; then
            echo "ERROR: simulator libcurl detected"
            exit 1
          fi


      # ============================================================
      # Validate static library symbols
      # ============================================================

      - name: Validate static library symbols
        shell: bash
        run: |
          set -euo pipefail

          echo "===== libarchive symbols ====="

          nm -gU "${LIBARCHIVE}" \
            | grep -E \
                'archive_read_new|archive_write_new' \
            | head -20

          echo "===== libcurl symbols ====="

          nm -gU "${CURL}" \
            | grep -E \
                'curl_easy_init|curl_easy_cleanup|curl_easy_perform' \
            | head -20


      # ============================================================
      # Build ldid
      # ============================================================

      - name: Build ldid
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ldid
          mkdir -p build/ldid

          IOS_TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${IOS_TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${CURL_HEADERS}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lc++ \
            -lz \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid/ldid

          test -s build/ldid/ldid


      # ============================================================
      # Validate final Mach-O
      # ============================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -euo pipefail

          echo "===== file ====="

          file build/ldid/ldid

          echo "===== architecture ====="

          lipo -info build/ldid/ldid

          echo "===== Mach-O header ====="

          otool -hv build/ldid/ldid

          echo "===== build version ====="

          otool -l build/ldid/ldid \
            | grep -A5 LC_BUILD_VERSION

          echo "===== linked libraries ====="

          otool -L build/ldid/ldid


      # ============================================================
      # Validate iOS platform
      # ============================================================

      - name: Validate iOS deployment target
        shell: bash
        run: |
          set -euo pipefail

          otool -l build/ldid/ldid \
            > build/ldid/load-commands.txt

          echo "===== LC_BUILD_VERSION ====="

          grep -A5 \
            LC_BUILD_VERSION \
            build/ldid/load-commands.txt

          echo "===== iOS platform ====="

          grep -A5 \
            LC_BUILD_VERSION \
            build/ldid/load-commands.txt \
            | grep "platform 2"


      # ============================================================
      # Strip
      # ============================================================

      - name: Strip final binary
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/ldid/ldid \
            build/ldid/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid/ldid

          test -s build/ldid/ldid

          echo "===== stripped binary ====="

          file build/ldid/ldid

          lipo -info build/ldid/ldid


      # ============================================================
      # Package
      # ============================================================

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp \
            build/ldid/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== final artifact ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256

          cat \
            ldid-ios-arm64.tar.gz.sha256


      # ============================================================
      # Upload
      # ============================================================

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
