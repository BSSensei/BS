name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          git clone --recursive https://github.com/opa334/TrollStore.git
          cd TrollStore
          
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          cd $THEOS/sdks
          curl -LO https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          
          cd $GITHUB_WORKSPACE/TrollStore/RootHelper
          make clean
          make FINALPACKAGE=1
          
          cp .theos/obj/RootHelper ../TrollHelper/Resources/
          
          cd ../TrollHelper
          make clean
          make FINALPACKAGE=1
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp .theos/obj/TrollHelper $GITHUB_WORKSPACE/output/
          cp ../RootHelper/.theos/obj/RootHelper $GITHUB_WORKSPACE/output/
          
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: output/*
