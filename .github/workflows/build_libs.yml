name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_REPOSITORY: "okferret/libarchive"

  CURL_REPOSITORY: "XDcobra/libcurl-ios-prebuilt-and-buildscripts"
  CURL_RELEASE: "curl-8_17_0"
  CURL_VERSION: "8.17.0"
  CURL_SOURCE_URL: "https://curl.se/download/curl-8.17.0.tar.xz"

jobs:
  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # Extract bundled ldid source and libraries
      # ============================================================

      - name: Extract ldid
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          test -d source/openssl_include
          test -d source/openssl_lib

          test -d source/libplist_include
          test -d source/libplist_lib

          echo "===== EXTRACTED SOURCE ====="
          find source -maxdepth 2 -print


      # ============================================================
      # Download exact iPhoneOS 16.5 SDK
      # ============================================================

      - name: Download iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -e

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf \
            "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          if [ -z "${IOS_SDK_DIR}" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found."
            exit 1
          fi

          test -d "${IOS_SDK_DIR}"
          test -f "${IOS_SDK_DIR}/SDKSettings.plist"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== IOS SDK ====="
          echo "${IOS_SDK_DIR}"


      # ============================================================
      # Configure Apple compiler
      # ============================================================

      - name: Configure compiler
        shell: bash
        run: |
          set -e

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          test -x "${IOS_CLANG}"
          test -x "${IOS_CLANGXX}"
          test -x "${IOS_STRIP}"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== COMPILER ====="
          "${IOS_CLANGXX}" --version


      # ============================================================
      # Locate bundled OpenSSL
      # ============================================================

      - name: Locate OpenSSL
        shell: bash
        run: |
          set -e

          CRYPTO="$(
            find source/openssl_lib \
              -type f \
              -name "libcrypto*.a" \
              -print \
              -quit
          )"

          SSL="$(
            find source/openssl_lib \
              -type f \
              -name "libssl*.a" \
              -print \
              -quit
          )"

          if [ -z "${CRYPTO}" ]; then
            echo "ERROR: libcrypto.a not found."
            find source/openssl_lib -print
            exit 1
          fi

          if [ -z "${SSL}" ]; then
            echo "ERROR: libssl.a not found."
            find source/openssl_lib -print
            exit 1
          fi

          CRYPTO="$(cd "$(dirname "${CRYPTO}")" && pwd)/$(basename "${CRYPTO}")"
          SSL="$(cd "$(dirname "${SSL}")" && pwd)/$(basename "${SSL}")"

          echo "CRYPTO=${GITHUB_WORKSPACE}/${CRYPTO#${GITHUB_WORKSPACE}/}" >> "${GITHUB_ENV}"
          echo "SSL=${GITHUB_WORKSPACE}/${SSL#${GITHUB_WORKSPACE}/}" >> "${GITHUB_ENV}"

          echo "===== OPENSSL ====="
          echo "CRYPTO=${CRYPTO}"
          echo "SSL=${SSL}"


      # ============================================================
      # Locate bundled libplist
      # ============================================================

      - name: Locate libplist
        shell: bash
        run: |
          set -e

          PLIST="$(
            find source/libplist_lib \
              -type f \
              -name "libplist*.a" \
              -print \
              -quit
          )"

          if [ -z "${PLIST}" ]; then
            echo "ERROR: libplist.a not found."
            find source/libplist_lib -print
            exit 1
          fi

          PLIST="$(cd "$(dirname "${PLIST}")" && pwd)/$(basename "${PLIST}")"

          echo "PLIST=${GITHUB_WORKSPACE}/${PLIST#${GITHUB_WORKSPACE}/}" >> "${GITHUB_ENV}"

          echo "===== LIBPLIST ====="
          echo "PLIST=${PLIST}"


      # ============================================================
      # IMPORTANT:
      # iOS does not provide macOS SecStaticCode* APIs.
      #
      # __APPLE__ is also defined on iOS, therefore the old:
      #
      #   #ifdef __APPLE__
      #
      # was incorrect.
      #
      # This step changes it to:
      #
      #   #if defined(__APPLE__) && TARGET_OS_OSX
      #
      # so Apple system-code-validation remains available on macOS,
      # but is not compiled into the iOS target.
      # ============================================================

      - name: Patch ldid for iOS Security APIs
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("source/ldid.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # Security/CoreFoundation includes
          # --------------------------------------------------------

          old = """#ifdef __APPLE__
          #include <Security/Security.h>
          #include <CoreFoundation/CoreFoundation.h>
          #endif"""

          new = """#if defined(__APPLE__)
          #include <TargetConditionals.h>
          #if TARGET_OS_OSX
          #include <Security/Security.h>
          #include <CoreFoundation/CoreFoundation.h>
          #endif
          #endif"""

          if old in s:
              s = s.replace(old, new, 1)

          # Handle variants with no indentation.
          old = """#ifdef __APPLE__
          #include <Security/Security.h>
          #include <CoreFoundation/CoreFoundation.h>
          #endif"""

          new = """#if defined(__APPLE__)
          #include <TargetConditionals.h>
          #if TARGET_OS_OSX
          #include <Security/Security.h>
          #include <CoreFoundation/CoreFoundation.h>
          #endif
          #endif"""

          if old in s:
              s = s.replace(old, new, 1)

          # --------------------------------------------------------
          # macOS SecStaticCode implementation
          # --------------------------------------------------------

          marker = "#ifdef __APPLE__\ninline bool verify_with_apple_system"

          if marker in s:
              s = s.replace(
                  marker,
                  "#if defined(__APPLE__) && TARGET_OS_OSX\n"
                  "inline bool verify_with_apple_system",
                  1
              )

          marker = "#ifdef __APPLE__\r\ninline bool verify_with_apple_system"

          if marker in s:
              s = s.replace(
                  marker,
                  "#if defined(__APPLE__) && TARGET_OS_OSX\r\n"
                  "inline bool verify_with_apple_system",
                  1
              )

          # --------------------------------------------------------
          # verify_with_system_impl
          # --------------------------------------------------------

          marker = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\n"
              "#ifdef __APPLE__"
          )

          if marker in s:
              s = s.replace(
                  marker,
                  (
                      "inline VerificationResult verify_with_system_impl("
                      "const std::filesystem::path& path) {\n"
                      "#if defined(__APPLE__) && TARGET_OS_OSX"
                  ),
                  1
              )

          marker = (
              "inline VerificationResult verify_with_system_impl("
              "const std::filesystem::path& path) {\r\n"
              "#ifdef __APPLE__"
          )

          if marker in s:
              s = s.replace(
                  marker,
                  (
                      "inline VerificationResult verify_with_system_impl("
                      "const std::filesystem::path& path) {\r\n"
                      "#if defined(__APPLE__) && TARGET_OS_OSX"
                  ),
                  1
              )

          # --------------------------------------------------------
          # Verify expected guards were actually applied.
          # --------------------------------------------------------

          if "SecStaticCodeRef" in s:
              if "TARGET_OS_OSX" not in s:
                  raise SystemExit(
                      "ERROR: SecStaticCodeRef exists but TARGET_OS_OSX "
                      "guard was not inserted."
                  )

          p.write_text(s)
          PY

          echo "===== SECURITY GUARDS ====="

          grep -n -E \
            'TargetConditionals|Security/Security|TARGET_OS_OSX|SecStaticCode|verify_with_system_impl' \
            source/ldid.cpp

          echo "===== SOURCE CHECK ====="

          test -f source/ldid.cpp
          test -f source/ldid.hpp


      # ============================================================
      # Download prebuilt libarchive
      # ============================================================

      - name: Download libarchive
        shell: bash
        run: |
          set -e

          rm -rf third_party/libarchive
          mkdir -p third_party

          git clone \
            --depth 1 \
            "https://github.com/${LIBARCHIVE_REPOSITORY}.git" \
            third_party/libarchive

          test -d third_party/libarchive


      # ============================================================
      # Locate prebuilt libarchive iOS arm64 slice
      # ============================================================

      - name: Locate libarchive
        shell: bash
        run: |
          set -e

          XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name "libArchive.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${XCFRAMEWORK}" ]; then
            XCFRAMEWORK="$(
              find third_party/libarchive \
                -type d \
                -name "*.xcframework" \
                -print \
                -quit
            )"
          fi

          if [ -z "${XCFRAMEWORK}" ]; then
            echo "ERROR: libarchive XCFramework not found."
            find third_party/libarchive -maxdepth 5 -print
            exit 1
          fi

          SLICE="${XCFRAMEWORK}/ios-arm64"

          if [ ! -d "${SLICE}" ]; then
            echo "ERROR: iOS arm64 libarchive slice not found:"
            echo "${SLICE}"
            find "${XCFRAMEWORK}" -maxdepth 3 -print
            exit 1
          fi

          LIBARCHIVE="$(
            find "${SLICE}" \
              -type f \
              -name "libarchive.a" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE}" ]; then
            echo "ERROR: libarchive.a not found."
            find "${SLICE}" -print
            exit 1
          fi

          HEADERS="$(
            find "${SLICE}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          if [ -z "${HEADERS}" ]; then
            echo "ERROR: libarchive Headers directory not found."
            find "${SLICE}" -maxdepth 4 -print
            exit 1
          fi

          LIBARCHIVE="$(cd "$(dirname "${LIBARCHIVE}")" && pwd)/$(basename "${LIBARCHIVE}")"
          HEADERS="$(cd "${HEADERS}" && pwd)"

          echo "LIBARCHIVE=${GITHUB_WORKSPACE}/${LIBARCHIVE#${GITHUB_WORKSPACE}/}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${GITHUB_WORKSPACE}/${HEADERS#${GITHUB_WORKSPACE}/}" >> "${GITHUB_ENV}"

          echo "===== LIBARCHIVE ====="
          echo "LIBARCHIVE=${LIBARCHIVE}"
          echo "HEADERS=${HEADERS}"


      # ============================================================
      # Validate libarchive
      # ============================================================

      - name: Validate libarchive
        shell: bash
        run: |
          set -e

          test -f "${LIBARCHIVE}"
          test -d "${LIBARCHIVE_HEADERS}"

          file "${LIBARCHIVE}"

          lipo -info "${LIBARCHIVE}" || true

          nm -gU "${LIBARCHIVE}" 2>/dev/null |
            grep -E \
              "archive_read_new|archive_read_open|archive_write_new|archive_write_open" |
            head -20 || true


      # ============================================================
      # Download prebuilt libcurl release
      # ============================================================

      - name: Download libcurl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

          gh --version

          rm -rf third_party/curl

          mkdir -p \
            third_party/curl/download \
            third_party/curl/extracted

          gh release view \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}"

          gh release download \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}" \
            --dir third_party/curl/download \
            --clobber


      # ============================================================
      # Extract libcurl release
      # ============================================================

      - name: Extract libcurl
        shell: bash
        run: |
          set -e

          FOUND=0

          while IFS= read -r -d '' FILE; do
            case "${FILE}" in

              *.zip|*.ZIP)
                FOUND=1
                unzip -q -o \
                  "${FILE}" \
                  -d third_party/curl/extracted
                ;;

              *.tar.gz|*.tgz)
                FOUND=1
                tar \
                  -xzf \
                  "${FILE}" \
                  -C third_party/curl/extracted
                ;;

              *.tar.xz)
                FOUND=1
                tar \
                  -xJf \
                  "${FILE}" \
                  -C third_party/curl/extracted
                ;;

            esac
          done < <(
            find third_party/curl/download \
              -type f \
              -print0
          )

          if [ "${FOUND}" -eq 0 ]; then
            echo "ERROR: no supported libcurl release archive found."

            find third_party/curl/download -maxdepth 3 -print

            exit 1
          fi

          echo "===== EXTRACTED CURL ====="

          find \
            third_party/curl/extracted \
            -maxdepth 6 \
            -print


      # ============================================================
      # Locate actual libcurl binary
      #
      # Current release layout:
      #
      # extracted/
      # ├── ios-arm64/
      # │   └── libcurl.a
      # └── Info.plist
      #
      # There are NO curl headers in this release.
      # ============================================================

      - name: Locate libcurl
        shell: bash
        run: |
          set -e

          CURL="$(
            find third_party/curl/extracted \
              -type f \
              -path "*/ios-arm64/libcurl.a" \
              -print \
              -quit
          )"

          if [ -z "${CURL}" ]; then
            CURL="$(
              find third_party/curl/extracted \
                -type f \
                -name "libcurl.a" \
                -print \
                -quit
            )"
          fi

          if [ -z "${CURL}" ]; then
            echo "ERROR: prebuilt libcurl.a not found."

            find third_party/curl/extracted -maxdepth 8 -print

            exit 1
          fi

          test -f "${CURL}"

          CURL="$(cd "$(dirname "${CURL}")" && pwd)/$(basename "${CURL}")"

          echo "CURL=${GITHUB_WORKSPACE}/${CURL#${GITHUB_WORKSPACE}/}" >> "${GITHUB_ENV}"

          echo "===== LIBCURL ====="
          echo "CURL=${CURL}"

          file "${CURL}"
          lipo -info "${CURL}" || true


      # ============================================================
      # Download curl 8.17.0 source ONLY for headers.
      #
      # libcurl itself is NOT compiled here.
      # ============================================================

      - name: Download curl 8.17.0 headers
        shell: bash
        run: |
          set -e

          rm -rf third_party/curl-headers

          mkdir -p third_party/curl-headers

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o third_party/curl-8.17.0.tar.xz \
            "${CURL_SOURCE_URL}"

          test -s third_party/curl-8.17.0.tar.xz

          tar \
            -xJf \
            third_party/curl-8.17.0.tar.xz \
            -C third_party/curl-headers

          CURL_SOURCE_DIR="$(
            find third_party/curl-headers \
              -maxdepth 1 \
              -type d \
              -name "curl-${CURL_VERSION}" \
              -print \
              -quit
          )"

          if [ -z "${CURL_SOURCE_DIR}" ]; then
            echo "ERROR: curl source directory not found."

            find third_party/curl-headers -maxdepth 2 -print

            exit 1
          fi

          CURL_HEADERS="${CURL_SOURCE_DIR}/include"

          if [ ! -d "${CURL_HEADERS}" ]; then
            echo "ERROR: curl include directory not found."
            exit 1
          fi

          if [ ! -f "${CURL_HEADERS}/curl/curl.h" ]; then
            echo "ERROR: curl/curl.h not found."
            exit 1
          fi

          CURL_HEADERS="$(cd "${CURL_HEADERS}" && pwd)"

          echo "CURL_HEADERS=${GITHUB_WORKSPACE}/${CURL_HEADERS#${GITHUB_WORKSPACE}/}" >> "${GITHUB_ENV}"

          echo "===== CURL HEADERS ====="
          echo "${CURL_HEADERS}"


      # ============================================================
      # Validate libcurl
      # ============================================================

      - name: Validate libcurl
        shell: bash
        run: |
          set -e

          test -f "${CURL}"
          test -d "${CURL_HEADERS}"
          test -f "${CURL_HEADERS}/curl/curl.h"

          file "${CURL}"

          lipo -info "${CURL}" || true

          nm -gU "${CURL}" 2>/dev/null |
            grep -E \
              "curl_easy_init|curl_easy_cleanup|curl_easy_perform" |
            head -20 || true


      # ============================================================
      # Build iOS arm64 ldid
      # ============================================================

      - name: Build ldid
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          echo "===== BUILD CONFIGURATION ====="
          echo "TARGET=${TARGET}"
          echo "SDK=${IOS_SDK_DIR}"
          echo "OPENSSL=${GITHUB_WORKSPACE}/source/openssl_include"
          echo "LIBPLIST=${GITHUB_WORKSPACE}/source/libplist_include"
          echo "LIBARCHIVE=${LIBARCHIVE_HEADERS}"
          echo "LIBCURL=${CURL_HEADERS}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${CURL_HEADERS}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lc++ \
            -lz \
            -lbz2 \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid

          test -s build/ldid

          echo "===== BUILD SUCCESS ====="
          file build/ldid


      # ============================================================
      # Validate Mach-O
      # ============================================================

      - name: Validate binary
        shell: bash
        run: |
          set -e

          test -f build/ldid

          echo "===== FILE ====="
          file build/ldid

          echo "===== ARCH ====="
          lipo -info build/ldid

          echo "===== MACH-O HEADER ====="
          otool -hv build/ldid

          echo "===== LOAD COMMANDS ====="
          otool -l build/ldid > build/load_commands.txt

          awk '
            /LC_BUILD_VERSION/ {
              print
              n=8
              next
            }
            n > 0 {
              print
              n--
            }
          ' build/load_commands.txt

          echo "===== DEPENDENCIES ====="
          otool -L build/ldid


      # ============================================================
      # Strip iOS binary
      # ============================================================

      - name: Strip binary
        shell: bash
        run: |
          set -e

          cp build/ldid build/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid

          test -s build/ldid

          echo "===== STRIPPED BINARY ====="

          file build/ldid
          lipo -info build/ldid


      # ============================================================
      # Prepare corrected source package
      #
      # This contains the ACTUAL source after the iOS Security API
      # fix, so the uploaded source matches the binary.
      # ============================================================

      - name: Package corrected source
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist/source

          cp source/ldid.cpp dist/source/ldid.cpp
          cp source/ldid.hpp dist/source/ldid.hpp

          test -f dist/source/ldid.cpp
          test -f dist/source/ldid.hpp

          tar \
            -C dist \
            -czf \
            ldid-ios-arm64-source.tar.gz \
            source

          shasum \
            -a 256 \
            ldid-ios-arm64-source.tar.gz \
            > ldid-ios-arm64-source.tar.gz.sha256

          echo "===== CORRECTED SOURCE ====="

          grep -n -E \
            'TargetConditionals|TARGET_OS_OSX|SecStaticCode' \
            dist/source/ldid.cpp || true

          ls -lh \
            ldid-ios-arm64-source.tar.gz \
            ldid-ios-arm64-source.tar.gz.sha256


      # ============================================================
      # Package final iOS ldid
      # ============================================================

      - name: Package iOS ldid
        shell: bash
        run: |
          set -e

          cp \
            build/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== FINAL ARTIFACTS ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256 \
            ldid-ios-arm64-source.tar.gz \
            ldid-ios-arm64-source.tar.gz.sha256

          echo
          echo "===== SHA256 ====="

          cat ldid-ios-arm64.tar.gz.sha256
          cat ldid-ios-arm64-source.tar.gz.sha256


      # ============================================================
      # Upload:
      #
      # 1. iOS arm64 ldid
      # 2. SHA256
      # 3. corrected source
      # 4. corrected source SHA256
      # 5. unstripped binary for debugging
      # ============================================================

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
            ldid-ios-arm64-source.tar.gz
            ldid-ios-arm64-source.tar.gz.sha256
            build/ldid.unstripped
          if-no-files-found: error
          retention-days: 30
