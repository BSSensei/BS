name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"

  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_VERSION: "3.8.2"
  CURL_VERSION: "8.16.0"

  LIBARCHIVE_URL: "https://www.libarchive.org/downloads/libarchive-3.8.2.tar.xz"
  CURL_URL: "https://github.com/curl/curl/releases/download/curl-8_16_0/curl-8.16.0.tar.xz"

jobs:

  # ============================================================
  # iOS arm64 (autotools)
  # ============================================================

  ios:
    name: iOS arm64 build
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Extract user's ldid.zip
      # --------------------------------------------------------

      - name: Extract ldid source
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          test -f source/ldid.cpp
          test -f source/ldid.hpp

          echo "===== extracted source ====="
          find source -maxdepth 2 -type f -print

      # --------------------------------------------------------
      # Validate bundled dependencies
      # --------------------------------------------------------

      - name: Validate bundled OpenSSL and libplist
        run: |
          set -euo pipefail

          test -d source/openssl_lib
          test -d source/openssl_include

          test -d source/libplist_lib
          test -d source/libplist_include

          test -f source/openssl_lib/libcrypto.a
          test -f source/openssl_lib/libssl.a
          test -f source/libplist_lib/libplist-2.0.a

          echo "===== bundled deps OK ====="

      # --------------------------------------------------------
      # Download iPhoneOS 16.5 SDK
      # --------------------------------------------------------

      - name: Download iPhoneOS 16.5 SDK
        run: |
          set -euo pipefail

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/ios-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          test -s "${SDK_ARCHIVE}"

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name 'iPhoneOS16.5.sdk' \
              -print \
              -quit
          )"

          test -n "${IOS_SDK_DIR}"
          test -d "${IOS_SDK_DIR}"

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "===== SDK ====="
          echo "${IOS_SDK_DIR}"

      # --------------------------------------------------------
      # Apple toolchain
      # --------------------------------------------------------

      - name: Configure iOS toolchain
        run: |
          set -euo pipefail

          IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          IOS_AR="$(xcrun --sdk iphoneos --find ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos --find ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos --find strip)"

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "===== clang ====="
          "${IOS_CLANG}" --version

      # --------------------------------------------------------
      # Common autotools env for iOS cross-compile
      # --------------------------------------------------------

      - name: Export iOS autotools env
        run: |
          set -euo pipefail

          IOS_CFLAGS="-O3 -DNDEBUG -arch arm64 -isysroot ${IOS_SDK_DIR} -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET} -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing"
          IOS_LDFLAGS="-arch arm64 -isysroot ${IOS_SDK_DIR} -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"

          {
            echo "IOS_CFLAGS=${IOS_CFLAGS}"
            echo "IOS_LDFLAGS=${IOS_LDFLAGS}"
          } >> "${GITHUB_ENV}"

          echo "===== CFLAGS ====="
          echo "${IOS_CFLAGS}"

      # --------------------------------------------------------
      # Download libarchive source
      # --------------------------------------------------------

      - name: Download libarchive 3.8.2
        run: |
          set -euo pipefail

          rm -rf third_party libarchive-3.8.2 libarchive-3.8.2.tar.xz
          mkdir -p third_party

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o libarchive-3.8.2.tar.xz \
            "${LIBARCHIVE_URL}"

          test -s libarchive-3.8.2.tar.xz

          tar -xJf libarchive-3.8.2.tar.xz

          test -d libarchive-3.8.2

          mv libarchive-3.8.2 third_party/libarchive-src

          test -f third_party/libarchive-src/CMakeLists.txt

      # --------------------------------------------------------
      # Build libarchive (CMake)
      #
      # We use CMake here on purpose: libarchive's autotools
      # configure runs AC_CHECK_SIZEOF / AC_RUN_IFELSE tests
      # which cannot run under iOS cross-compilation without a
      # fully pre-seeded config.cache. CMake handles cross
      # compiles much better.
      #
      # The only iOS-specific override needed is disabling
      # HAVE_FUTIMESAT, which is detected on macOS but is not
      # available on iOS.
      # --------------------------------------------------------

      - name: Configure libarchive
        run: |
          set -euo pipefail

          rm -rf \
            third_party/libarchive-build \
            third_party/libarchive-install

          mkdir -p \
            third_party/libarchive-build \
            third_party/libarchive-install

          cmake \
            -S third_party/libarchive-src \
            -B third_party/libarchive-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${IOS_CLANG}" \
            -DCMAKE_CXX_COMPILER="${IOS_CLANGXX}" \
            -DCMAKE_AR="${IOS_AR}" \
            -DCMAKE_RANLIB="${IOS_RANLIB}" \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing -DHAVE_FUTIMESAT=0 -DHAVE_FUTIMENS=0 -DHAVE_UTIMENSAT=0 -DHAVE_LUTIMES=0" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections -fvisibility=hidden -fstrict-aliasing -DHAVE_FUTIMESAT=0 -DHAVE_FUTIMENS=0 -DHAVE_UTIMENSAT=0 -DHAVE_LUTIMES=0" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_INSTALL=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            -DENABLE_XATTR=OFF \
            -DENABLE_ACL=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_CNG=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_LZ4=OFF \
            -DENABLE_LZO=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_BZip2=OFF \
            -DENABLE_LIBXML2=OFF \
            -DENABLE_EXPAT=OFF \
            -DENABLE_PCREPOSIX=OFF \
            -DENABLE_PCRE2POSIX=OFF

      - name: Build libarchive
        run: |
          set -euo pipefail

          cmake \
            --build third_party/libarchive-build \
            --parallel \
            --verbose

      - name: Locate libarchive
        run: |
          set -euo pipefail

          LIBARCHIVE_STATIC="$(
            find third_party/libarchive-build \
              -type f \
              \( \
                -name 'libarchive.a' \
                -o \
                -name 'libarchive_static.a' \
              \) \
              -print \
              | head -1
          )"

          test -n "${LIBARCHIVE_STATIC}"
          test -f "${LIBARCHIVE_STATIC}"

          echo "LIBARCHIVE_STATIC=${LIBARCHIVE_STATIC}" >> "${GITHUB_ENV}"

          echo "===== libarchive ====="
          file "${LIBARCHIVE_STATIC}"

      # --------------------------------------------------------
      # Download curl source
      # --------------------------------------------------------

      - name: Download curl 8.16.0
        run: |
          set -euo pipefail

          rm -rf curl-8.16.0 curl-8.16.0.tar.xz

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o curl-8.16.0.tar.xz \
            "${CURL_URL}"

          test -s curl-8.16.0.tar.xz

          tar -xJf curl-8.16.0.tar.xz

          test -d curl-8.16.0

          mv curl-8.16.0 third_party/curl-src

          test -x third_party/curl-src/configure

      # --------------------------------------------------------
      # Prepare merged OpenSSL prefix for curl
      # --------------------------------------------------------

      - name: Prepare OpenSSL prefix for curl
        run: |
          set -euo pipefail

          OPENSSL_PREFIX="${GITHUB_WORKSPACE}/third_party/openssl-prefix"
          rm -rf "${OPENSSL_PREFIX}"
          mkdir -p "${OPENSSL_PREFIX}/include" "${OPENSSL_PREFIX}/lib"

          cp -R "${GITHUB_WORKSPACE}/source/openssl_include/." "${OPENSSL_PREFIX}/include/"
          cp "${GITHUB_WORKSPACE}/source/openssl_lib/libcrypto.a" "${OPENSSL_PREFIX}/lib/"
          cp "${GITHUB_WORKSPACE}/source/openssl_lib/libssl.a"    "${OPENSSL_PREFIX}/lib/"

          test -d "${OPENSSL_PREFIX}/include/openssl"
          test -f "${OPENSSL_PREFIX}/lib/libcrypto.a"
          test -f "${OPENSSL_PREFIX}/lib/libssl.a"

          echo "OPENSSL_PREFIX=${OPENSSL_PREFIX}" >> "${GITHUB_ENV}"

          echo "===== OpenSSL prefix ====="
          find "${OPENSSL_PREFIX}" -maxdepth 2 -type f | head -20

      # --------------------------------------------------------
      # Build curl (autotools)
      # --------------------------------------------------------

      - name: Configure and build curl
        run: |
          set -euo pipefail

          cd third_party/curl-src

          export CC="${IOS_CLANG}"
          export CXX="${IOS_CLANGXX}"
          export AR="${IOS_AR}"
          export RANLIB="${IOS_RANLIB}"
          export CFLAGS="${IOS_CFLAGS}"
          export CXXFLAGS="${IOS_CFLAGS}"
          export LDFLAGS="${IOS_LDFLAGS}"

          PREFIX="${GITHUB_WORKSPACE}/third_party/curl-install"
          rm -rf "${PREFIX}"
          mkdir -p "${PREFIX}"

          ./configure \
            --host=arm-apple-darwin \
            --prefix="${PREFIX}" \
            --disable-shared \
            --enable-static \
            --with-openssl="${OPENSSL_PREFIX}" \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-manual \
            --disable-threaded-resolver \
            --without-libidn2 \
            --without-librtmp \
            --without-nghttp2 \
            --without-brotli \
            --without-zstd \
            --without-libpsl \
            --without-libssh2 \
            --without-zlib

          make -j"$(sysctl -n hw.ncpu)"
          make install

          test -f "${PREFIX}/lib/libcurl.a"

          echo "===== libcurl.a ====="
          file "${PREFIX}/lib/libcurl.a"

      # --------------------------------------------------------
      # Final ldid
      # --------------------------------------------------------

      - name: Build ldid iOS arm64
        run: |
          set -euo pipefail

          rm -rf build/ios
          mkdir -p build/ios

          OPENSSL_INCLUDE="${GITHUB_WORKSPACE}/source/openssl_include"
          OPENSSL_LIB="${GITHUB_WORKSPACE}/source/openssl_lib"

          PLIST_INCLUDE="${GITHUB_WORKSPACE}/source/libplist_include"
          PLIST_LIB="${GITHUB_WORKSPACE}/source/libplist_lib"

          CURL_A="${GITHUB_WORKSPACE}/third_party/curl-install/lib/libcurl.a"

          test -f "${OPENSSL_LIB}/libcrypto.a"
          test -f "${OPENSSL_LIB}/libssl.a"
          test -f "${PLIST_LIB}/libplist-2.0.a"
          test -f "${LIBARCHIVE_STATIC}"
          test -f "${CURL_A}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -arch arm64 \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -fno-stack-check \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${OPENSSL_INCLUDE}" \
            -I"${PLIST_INCLUDE}" \
            source/ldid.cpp \
            "${LIBARCHIVE_STATIC}" \
            "${CURL_A}" \
            "${PLIST_LIB}/libplist-2.0.a" \
            "${OPENSSL_LIB}/libssl.a" \
            "${OPENSSL_LIB}/libcrypto.a" \
            -framework Security \
            -framework CoreFoundation \
            -lz \
            -lc++ \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ios/ldid

      # --------------------------------------------------------
      # Validate final binary
      # --------------------------------------------------------

      - name: Validate iOS binary
        run: |
          set -euo pipefail

          test -f build/ios/ldid

          echo "===== file ====="
          file build/ios/ldid

          echo "===== architecture ====="
          xcrun lipo -info build/ios/ldid

          echo "===== load commands ====="
          xcrun otool \
            -arch arm64 \
            -l \
            build/ios/ldid \
            | grep -E \
                'LC_BUILD_VERSION|platform|minos|sdk' \
            || true

          echo "===== linked libraries ====="
          xcrun otool \
            -arch arm64 \
            -L \
            build/ios/ldid

      # --------------------------------------------------------
      # Strip
      # --------------------------------------------------------

      - name: Strip final binary
        run: |
          set -euo pipefail

          cp build/ios/ldid build/ios/ldid.unstripped

          "${IOS_STRIP}" -S -x build/ios/ldid

          echo "===== stripped ====="
          file build/ios/ldid
          xcrun lipo -info build/ios/ldid

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package iOS artifact
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          tar \
            -C build/ios \
            -czf release/ldid-ios-arm64.tar.gz \
            ldid

          shasum \
            -a 256 \
            release/ldid-ios-arm64.tar.gz \
            > release/ldid-ios-arm64.tar.gz.sha256

          echo "===== release ====="
          ls -lh release
          cat release/ldid-ios-arm64.tar.gz.sha256

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            release/ldid-ios-arm64.tar.gz
            release/ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
