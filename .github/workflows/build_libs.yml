name: Build ldid

on:
  workflow_dispatch:

  push:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

  pull_request:
    paths:
      - "ldid.zip"
      - ".github/workflows/build_libs.yml"

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: "13.0"
  IOS_SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

  LIBARCHIVE_REPOSITORY: "okferret/libarchive"

  CURL_REPOSITORY: "XDcobra/libcurl-ios-prebuilt-and-buildscripts"
  CURL_RELEASE: "curl-8_17_0"

jobs:
  ios:
    name: Build iOS arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================================
      # Extract ldid.zip
      # ==========================================================

      - name: Extract ldid
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          ditto -x -k ldid.zip source

          if [ ! -f source/ldid.cpp ]; then
            echo "ERROR: source/ldid.cpp not found"
            exit 1
          fi

          if [ ! -f source/ldid.hpp ]; then
            echo "ERROR: source/ldid.hpp not found"
            exit 1
          fi

          if [ ! -d source/openssl_include ]; then
            echo "ERROR: source/openssl_include not found"
            exit 1
          fi

          if [ ! -d source/openssl_lib ]; then
            echo "ERROR: source/openssl_lib not found"
            exit 1
          fi

          if [ ! -d source/libplist_include ]; then
            echo "ERROR: source/libplist_include not found"
            exit 1
          fi

          if [ ! -d source/libplist_lib ]; then
            echo "ERROR: source/libplist_lib not found"
            exit 1
          fi

          echo "Source extracted successfully."


      # ==========================================================
      # Download iPhoneOS 16.5 SDK
      # ==========================================================

      - name: Download iPhoneOS SDK
        shell: bash
        run: |
          set -e

          SDK_ARCHIVE="${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz"
          SDK_ROOT="${RUNNER_TEMP}/iphoneos-sdk"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -o "${SDK_ARCHIVE}" \
            "${IOS_SDK_URL}"

          if [ ! -s "${SDK_ARCHIVE}" ]; then
            echo "ERROR: SDK download failed."
            exit 1
          fi

          tar \
            -xJf "${SDK_ARCHIVE}" \
            -C "${SDK_ROOT}"

          IOS_SDK_DIR="$(
            find "${SDK_ROOT}" \
              -type d \
              -name "iPhoneOS16.5.sdk" \
              -print \
              -quit
          )"

          if [ -z "${IOS_SDK_DIR}" ]; then
            echo "ERROR: iPhoneOS16.5.sdk was not found."
            find "${SDK_ROOT}" -maxdepth 4 -type d -print
            exit 1
          fi

          if [ ! -f "${IOS_SDK_DIR}/SDKSettings.plist" ]; then
            echo "ERROR: invalid iPhoneOS SDK."
            exit 1
          fi

          echo "IOS_SDK_DIR=${IOS_SDK_DIR}" >> "${GITHUB_ENV}"

          echo "iOS SDK:"
          echo "${IOS_SDK_DIR}"


      # ==========================================================
      # Apple compiler
      # ==========================================================

      - name: Configure compiler
        shell: bash
        run: |
          set -e

          IOS_CLANG="$(xcrun --sdk iphoneos -f clang)"
          IOS_CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          if [ ! -x "${IOS_CLANG}" ]; then
            echo "ERROR: clang not found."
            exit 1
          fi

          if [ ! -x "${IOS_CLANGXX}" ]; then
            echo "ERROR: clang++ not found."
            exit 1
          fi

          if [ ! -x "${IOS_STRIP}" ]; then
            echo "ERROR: strip not found."
            exit 1
          fi

          echo "IOS_CLANG=${IOS_CLANG}" >> "${GITHUB_ENV}"
          echo "IOS_CLANGXX=${IOS_CLANGXX}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          "${IOS_CLANGXX}" --version


      # ==========================================================
      # Find bundled OpenSSL
      # ==========================================================

      - name: Locate OpenSSL
        shell: bash
        run: |
          set -e

          CRYPTO="$(
            find source/openssl_lib \
              -type f \
              -name "libcrypto*.a" \
              -print \
              -quit
          )"

          SSL="$(
            find source/openssl_lib \
              -type f \
              -name "libssl*.a" \
              -print \
              -quit
          )"

          if [ -z "${CRYPTO}" ]; then
            echo "ERROR: libcrypto.a not found."
            find source/openssl_lib -type f -print
            exit 1
          fi

          if [ -z "${SSL}" ]; then
            echo "ERROR: libssl.a not found."
            find source/openssl_lib -type f -print
            exit 1
          fi

          echo "CRYPTO=${GITHUB_WORKSPACE}/${CRYPTO}" >> "${GITHUB_ENV}"
          echo "SSL=${GITHUB_WORKSPACE}/${SSL}" >> "${GITHUB_ENV}"

          echo "libcrypto:"
          echo "${CRYPTO}"

          echo "libssl:"
          echo "${SSL}"


      # ==========================================================
      # Find bundled libplist
      # ==========================================================

      - name: Locate libplist
        shell: bash
        run: |
          set -e

          PLIST="$(
            find source/libplist_lib \
              -type f \
              -name "libplist*.a" \
              -print \
              -quit
          )"

          if [ -z "${PLIST}" ]; then
            echo "ERROR: libplist.a not found."
            find source/libplist_lib -type f -print
            exit 1
          fi

          echo "PLIST=${GITHUB_WORKSPACE}/${PLIST}" >> "${GITHUB_ENV}"

          echo "libplist:"
          echo "${PLIST}"


      # ==========================================================
      # Download prebuilt libarchive
      # ==========================================================

      - name: Download libarchive
        shell: bash
        run: |
          set -e

          rm -rf third_party/libarchive

          mkdir -p third_party

          git clone \
            --depth 1 \
            "https://github.com/${LIBARCHIVE_REPOSITORY}.git" \
            third_party/libarchive

          if [ ! -d third_party/libarchive ]; then
            echo "ERROR: libarchive repository download failed."
            exit 1
          fi

          echo "libarchive downloaded."


      # ==========================================================
      # Locate libarchive XCFramework
      # ==========================================================

      - name: Locate libarchive
        shell: bash
        run: |
          set -e

          XCFRAMEWORK="$(
            find third_party/libarchive \
              -type d \
              -name "libArchive.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${XCFRAMEWORK}" ]; then
            XCFRAMEWORK="$(
              find third_party/libarchive \
                -type d \
                -name "*.xcframework" \
                -print \
                -quit
            )"
          fi

          if [ -z "${XCFRAMEWORK}" ]; then
            echo "ERROR: libarchive XCFramework not found."
            find third_party/libarchive -type d -name "*.xcframework" -print
            exit 1
          fi

          SLICE="${XCFRAMEWORK}/ios-arm64"

          if [ ! -d "${SLICE}" ]; then
            echo "ERROR: libarchive ios-arm64 slice not found."
            find "${XCFRAMEWORK}" -maxdepth 2 -type d -print
            exit 1
          fi

          LIBARCHIVE="$(
            find "${SLICE}" \
              -type f \
              -name "libarchive.a" \
              -print \
              -quit
          )"

          if [ -z "${LIBARCHIVE}" ]; then
            echo "ERROR: libarchive.a not found."
            find "${SLICE}" -type f -print
            exit 1
          fi

          HEADERS="$(
            find "${SLICE}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          if [ -z "${HEADERS}" ]; then
            echo "ERROR: libarchive Headers directory not found."
            exit 1
          fi

          echo "LIBARCHIVE=${GITHUB_WORKSPACE}/${LIBARCHIVE}" >> "${GITHUB_ENV}"
          echo "LIBARCHIVE_HEADERS=${GITHUB_WORKSPACE}/${HEADERS}" >> "${GITHUB_ENV}"

          echo "libarchive:"
          echo "${LIBARCHIVE}"

          echo "libarchive headers:"
          echo "${HEADERS}"


      # ==========================================================
      # Validate libarchive
      # ==========================================================

      - name: Validate libarchive
        shell: bash
        run: |
          set -e

          if [ ! -f "${LIBARCHIVE}" ]; then
            echo "ERROR: ${LIBARCHIVE} does not exist."
            exit 1
          fi

          if [ ! -d "${LIBARCHIVE_HEADERS}" ]; then
            echo "ERROR: ${LIBARCHIVE_HEADERS} does not exist."
            exit 1
          fi

          echo "===== libarchive file ====="
          file "${LIBARCHIVE}"

          echo "===== libarchive architecture ====="
          lipo -info "${LIBARCHIVE}" || true

          echo "===== libarchive symbols ====="

          nm -gU "${LIBARCHIVE}" 2>/dev/null \
            | grep -E \
              "archive_read_new|archive_read_open|archive_write_new|archive_write_open" \
            | head -20 \
            || true


      # ==========================================================
      # Download prebuilt libcurl
      #
      # IMPORTANT:
      # Do not guess the release asset filename.
      # gh downloads the actual assets from the release.
      # ==========================================================

      - name: Download libcurl release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if ! command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI is not installed. Installing..."

            brew install gh
          fi

          gh --version

          rm -rf third_party/curl

          mkdir -p \
            third_party/curl/download \
            third_party/curl/extracted

          echo "Checking curl release..."

          gh release view \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}"

          echo "Downloading curl release assets..."

          gh release download \
            "${CURL_RELEASE}" \
            --repo "${CURL_REPOSITORY}" \
            --dir third_party/curl/download \
            --clobber

          echo "Downloaded files:"

          find third_party/curl/download \
            -maxdepth 2 \
            -type f \
            -print


      # ==========================================================
      # Extract curl assets
      # ==========================================================

      - name: Extract libcurl
        shell: bash
        run: |
          set -e

          FOUND_ARCHIVE=0

          while IFS= read -r -d '' FILE; do
            FOUND_ARCHIVE=1

            echo "Extracting:"
            echo "${FILE}"

            case "${FILE}" in
              *.zip|*.ZIP)
                unzip \
                  -q \
                  -o \
                  "${FILE}" \
                  -d third_party/curl/extracted
                ;;

              *.tar.gz|*.tgz)
                tar \
                  -xzf "${FILE}" \
                  -C third_party/curl/extracted
                ;;

              *.tar.xz)
                tar \
                  -xJf "${FILE}" \
                  -C third_party/curl/extracted
                ;;

              *)
                echo "Ignoring non-archive asset:"
                echo "${FILE}"
                ;;
            esac

          done < <(
            find third_party/curl/download \
              -type f \
              -print0
          )

          if [ "${FOUND_ARCHIVE}" -eq 0 ]; then
            echo "ERROR: no curl release files were downloaded."
            exit 1
          fi

          echo "===== extracted curl ====="

          find third_party/curl/extracted \
            -maxdepth 7 \
            -print


      # ==========================================================
      # Locate libcurl XCFramework
      # ==========================================================

      - name: Locate libcurl
        shell: bash
        run: |
          set -e

          CURL_XCFRAMEWORK="$(
            find third_party/curl/extracted \
              -type d \
              -name "libcurl.xcframework" \
              -print \
              -quit
          )"

          if [ -z "${CURL_XCFRAMEWORK}" ]; then
            CURL_XCFRAMEWORK="$(
              find third_party/curl/extracted \
                -type d \
                -name "*.xcframework" \
                -print \
                -quit
            )"
          fi

          if [ -z "${CURL_XCFRAMEWORK}" ]; then
            echo "ERROR: libcurl XCFramework not found."

            echo "Available XCFrameworks:"
            find third_party/curl/extracted \
              -type d \
              -name "*.xcframework" \
              -print

            echo
            echo "All downloaded files:"
            find third_party/curl \
              -type f \
              -print

            exit 1
          fi

          echo "Using XCFramework:"
          echo "${CURL_XCFRAMEWORK}"

          SLICE="${CURL_XCFRAMEWORK}/ios-arm64"

          if [ ! -d "${SLICE}" ]; then
            echo "ERROR: curl ios-arm64 slice not found."

            echo "Available slices:"
            find "${CURL_XCFRAMEWORK}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print

            exit 1
          fi

          CURL="$(
            find "${SLICE}" \
              -type f \
              -name "libcurl*.a" \
              -print \
              -quit
          )"

          if [ -z "${CURL}" ]; then
            echo "ERROR: libcurl.a not found."

            find "${SLICE}" \
              -type f \
              -print

            exit 1
          fi

          CURL_HEADERS="$(
            find "${SLICE}" \
              -type d \
              -name "Headers" \
              -print \
              -quit
          )"

          if [ -z "${CURL_HEADERS}" ]; then
            echo "ERROR: libcurl Headers directory not found."
            exit 1
          fi

          echo "CURL=${GITHUB_WORKSPACE}/${CURL}" >> "${GITHUB_ENV}"
          echo "CURL_HEADERS=${GITHUB_WORKSPACE}/${CURL_HEADERS}" >> "${GITHUB_ENV}"

          echo "libcurl:"
          echo "${CURL}"

          echo "libcurl headers:"
          echo "${CURL_HEADERS}"


      # ==========================================================
      # Validate libcurl
      # ==========================================================

      - name: Validate libcurl
        shell: bash
        run: |
          set -e

          if [ ! -f "${CURL}" ]; then
            echo "ERROR: libcurl library missing."
            exit 1
          fi

          if [ ! -d "${CURL_HEADERS}" ]; then
            echo "ERROR: libcurl headers missing."
            exit 1
          fi

          echo "===== libcurl file ====="
          file "${CURL}"

          echo "===== libcurl architecture ====="
          lipo -info "${CURL}" || true

          echo "===== libcurl symbols ====="

          nm -gU "${CURL}" 2>/dev/null \
            | grep -E \
              "curl_easy_init|curl_easy_cleanup|curl_easy_perform" \
            | head -20 \
            || true


      # ==========================================================
      # Build
      # ==========================================================

      - name: Build ldid
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"

          echo "Building:"
          echo "  target = ${TARGET}"
          echo "  sdk    = ${IOS_SDK_DIR}"

          "${IOS_CLANGXX}" \
            -std=c++20 \
            -target "${TARGET}" \
            -isysroot "${IOS_SDK_DIR}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -O3 \
            -DNDEBUG \
            -flto=thin \
            -ffunction-sections \
            -fdata-sections \
            -fvisibility=hidden \
            -fstrict-aliasing \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -I"${GITHUB_WORKSPACE}/source/openssl_include" \
            -I"${GITHUB_WORKSPACE}/source/libplist_include" \
            -I"${LIBARCHIVE_HEADERS}" \
            -I"${CURL_HEADERS}" \
            source/ldid.cpp \
            "${PLIST}" \
            "${LIBARCHIVE}" \
            "${CURL}" \
            "${SSL}" \
            "${CRYPTO}" \
            -framework Security \
            -framework CoreFoundation \
            -lc++ \
            -lz \
            -lbz2 \
            -Wl,-dead_strip \
            -Wl,-no_compact_unwind \
            -o build/ldid

          if [ ! -s build/ldid ]; then
            echo "ERROR: ldid was not produced."
            exit 1
          fi

          echo "Build completed."


      # ==========================================================
      # Validate final executable
      # ==========================================================

      - name: Validate final binary
        shell: bash
        run: |
          set -e

          if [ ! -f build/ldid ]; then
            echo "ERROR: build/ldid not found."
            exit 1
          fi

          echo "===== FILE ====="
          file build/ldid

          echo "===== ARCHITECTURE ====="
          lipo -info build/ldid

          echo "===== MACH-O HEADER ====="
          otool -hv build/ldid

          echo "===== BUILD VERSION ====="
          otool -l build/ldid > build/load_commands.txt

          awk '
            /LC_BUILD_VERSION/ {
              show=1
              count=0
            }
            show {
              print
              count++
              if (count >= 8) {
                show=0
              }
            }
          ' build/load_commands.txt

          echo "===== LINKED LIBRARIES ====="
          otool -L build/ldid


      # ==========================================================
      # Strip
      # ==========================================================

      - name: Strip binary
        shell: bash
        run: |
          set -e

          cp \
            build/ldid \
            build/ldid.unstripped

          "${IOS_STRIP}" \
            -S \
            -x \
            build/ldid

          if [ ! -s build/ldid ]; then
            echo "ERROR: stripped binary is empty."
            exit 1
          fi

          echo "===== STRIPPED BINARY ====="

          file build/ldid
          lipo -info build/ldid


      # ==========================================================
      # Final artifact
      # ==========================================================

      - name: Package artifact
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          cp \
            build/ldid \
            dist/ldid-ios-arm64

          chmod 755 \
            dist/ldid-ios-arm64

          tar \
            -C dist \
            -czf ldid-ios-arm64.tar.gz \
            ldid-ios-arm64

          shasum \
            -a 256 \
            ldid-ios-arm64.tar.gz \
            > ldid-ios-arm64.tar.gz.sha256

          echo "===== FINAL ARTIFACT ====="

          ls -lh \
            ldid-ios-arm64.tar.gz \
            ldid-ios-arm64.tar.gz.sha256

          cat \
            ldid-ios-arm64.tar.gz.sha256


      # ==========================================================
      # Upload
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldid-ios-arm64
          path: |
            ldid-ios-arm64.tar.gz
            ldid-ios-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
