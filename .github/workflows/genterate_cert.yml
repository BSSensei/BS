name: 生成签名证书

on:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 依赖
        run: pip3 install --break-system-packages cryptography
      - name: 运行证书生成脚本
        run: python3 make_cert.py "59GAB85EFG" "./cert_output" "1"
      - name: 上传证书文件
        uses: actions/upload-artifact@v4
        with:
          name: certificates
          path: |
            cert_output/
            certificates.zip
          retention-days: 90
