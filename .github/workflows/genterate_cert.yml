name: 生成签名证书

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成证书并检查
        run: |
          chmod +x make_cert.sh
          ./make_cert.sh
          
          echo "====== 检查生成的文件 ======"
          if [ -f certificates.zip ]; then
            echo "✅ certificates.zip 已生成"
            ls -lh certificates.zip
          else
            echo "❌ certificates.zip 未找到！"
            exit 1
          fi

      - name: 上传证书
        uses: actions/upload-artifact@v4
        with:
          name: cert-files
          path: certificates.zip
          retention-days: 90
