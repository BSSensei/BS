name: 生成签名证书

on:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成证书
        run: |
          chmod +x make_cert.sh
          ./make_cert.sh

      - name: 上传证书
        uses: actions/upload-artifact@v4
        with:
          name: cert-files
          path: cert_output/
